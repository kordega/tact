---
name: tf-apply
description: Apply the plan generated by tf-plan
author: Kamil Zabielski

inputs:
  chroot-directory:
    description: Directory to chroot into before running tf apply
    required: false
    default: "."
  environment:
    description: The name of the tf environment to use when running tf apply. If not provided, the default environment will be used.
    required: false
  plan-file-path:
    description: The path to the tf plan file to apply. If not provided, the action will attempt to find a tf plan file in the default location.
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Show tofu version
      shell: bash
      run: |
        echo "::group::Show tofu version"
        tofu version
        echo "::endgroup::"

    - name: Run tf init
      working-directory: ${{ inputs.chroot-directory }}
      shell: bash
      run: |
        echo "::group::Run tf init"
        tofu init        \
          -input=false   \
          -backend=false
        echo "::endgroup::"

    - name: Run tf apply
      working-directory: ${{ inputs.chroot-directory }}
      shell: bash
      run: |
        tofu apply \
          -auto-approve \
          -input=false \
          "${{ inputs.plan-file-path }}"