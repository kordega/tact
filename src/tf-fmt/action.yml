---
name: tf-fmt
description: Format files using tf
author: Kamil Zabielski

inputs:
  chroot-directory:
    description: Directory to chroot into before running terraform fmt
    required: false
    default: "."

outputs:
  status-code:
    description: Exit code from tf fmt
    value: ${{ steps.tf-fmt.outputs.status-code }}

runs:
  using: "composite"
  steps:
    - name: Run tf-fmt
      id: tf-fmt
      working-directory: ${{ inputs.chroot-directory }}
      shell: bash
      run: |
        status_code=0
        tofu fmt -check -recursive . || status_code=$?
        echo "status-code=$status_code" >> "$GITHUB_OUTPUT"
        exit "$status_code"