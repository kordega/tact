---
name: tofu-apply
description: Apply the plan generated by tofu-plan
author: Kamil Zabielski

branding:
  icon: git-merge
  color: gray-dark

inputs:
  chroot-directory:
    description: Directory to chroot into before running tofu apply
    required: false
    default: "."
  environment:
    description: The name of the tofu environment to use when running tofu apply.
    required: false
  plan-file-path:
    description: The path to the tofu plan file to apply when not using an artifact. One of plan-file-path or plan-artifact-name must be provided.
    required: false
    default: ""
  plan-artifact-name:
    description: The name of the GitHub Actions artifact containing the tofu plan file to apply. Takes precedence over plan-file-path if both are provided. One of plan-file-path or plan-artifact-name must be provided.
    required: false
    default: ""
  extra_environment_variables:
    description: |
      Additional environment variables to set before running tofu commands.
      Provide one KEY=VALUE pair per line.
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Either plan-file-path or plan-artifact-name must be provided
      if: ${{ inputs.plan-file-path == '' && inputs.plan-artifact-name == '' }}
      shell: bash
      run: |
        echo "::error::Either plan-file-path or plan-artifact-name must be provided"
        exit 1

    - name: Only one of plan-file-path or plan-artifact-name must be provided
      if: ${{ inputs.plan-file-path != '' && inputs.plan-artifact-name != '' }}
      shell: bash
      run: |
        echo "::error::Only one of plan-file-path or plan-artifact-name must be provided"
        exit 1

    - name: Download plan artifact if plan-artifact-name is provided
      if: ${{ inputs.plan-artifact-name != '' }}
      id: download-plan-artifact
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
      with:
        name: ${{ inputs.plan-artifact-name }}
        path: ${{ runner.temp }}

    - name: Set plan-file-path
      id: set-plan-file-path
      shell: bash
      run: |
        if [[ "${{ inputs.plan-artifact-name }}" != "" ]]; then
          echo "plan-file-path=${{ steps.download-plan-artifact.outputs.download-path }}/${{ inputs.plan-artifact-name }}" >> "$GITHUB_OUTPUT"
        else
          echo "plan-file-path=${{ inputs.plan-file-path }}" >> "$GITHUB_OUTPUT"
        fi

    - name: Configure extra environment variables
      if: ${{ inputs.extra_environment_variables != '' }}
      shell: bash
      run: |
        while IFS= read -r line; do
          [ -n "$line" ] && echo "$line" >> "$GITHUB_ENV"
        done <<< "${{ inputs.extra_environment_variables }}"

    - name: Run tofu init
      working-directory: ${{ inputs.chroot-directory }}
      shell: bash
      run: |
        echo "::group::Run tofu init"
        tofu init        \
          -input=false   \
          -backend=false
        echo "::endgroup::"

    - name: Run tofu apply
      working-directory: ${{ inputs.chroot-directory }}
      shell: bash
      run: |
        echo "::group::Run tofu apply"
        tofu apply \
          -auto-approve \
          -input=false \
          "${{ steps.set-plan-file-path.outputs.plan-file-path }}"
        echo "::endgroup::"
