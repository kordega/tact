---
name: tofu-apply
description: Apply the plan generated by tofu-plan
author: Kamil Zabielski

branding:
  icon: git-merge
  color: gray-dark

inputs:
  chroot-directory:
    description: Directory to chroot into before running tf apply
    required: false
    default: "."
  environment:
    description: The name of the tf environment to use when running tf apply.
    required: false
  plan-file-path:
    description: The path to the tf plan file to apply when not using an artifact. One of plan-file-path or plan-artifact-name must be provided.
    required: false
    default: ""
  plan-artifact-name:
    description: The name of the GitHub Actions artifact containing the tf plan file to apply. Takes precedence over plan-file-path if both are provided. One of plan-file-path or plan-artifact-name must be provided.
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Either plan-file-path or plan-artifact-name must be provided
      if: ${{ inputs.plan-file-path == '' && inputs.plan-artifact-name == '' }}
      shell: bash
      run: |
        echo "::error::Either plan-file-path or plan-artifact-name must be provided"
        exit 1

    - name: Only one of plan-file-path or plan-artifact-name must be provided
      if: ${{ inputs.plan-file-path != '' && inputs.plan-artifact-name != '' }}
      shell: bash
      run: |
        echo "::error::Only one of plan-file-path or plan-artifact-name must be provided"
        exit 1

    - name: Download plan artifact if plan-artifact-name is provided
      if: ${{ inputs.plan-artifact-name != '' }}
      id: download-plan-artifact
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
      with:
        name: ${{ inputs.plan-artifact-name }}
        path: ${{ runner.temp }}

    - name: Set plan-file-path
      id: set-plan-file-path
      shell: bash
      run: |
        if [[ "${{ inputs.plan-artifact-name }}" != "" ]]; then
          echo "plan-file-path=${{ steps.download-plan-artifact.outputs.download-path }}/${{ inputs.plan-artifact-name }}" >> "$GITHUB_OUTPUT"
        else
          echo "plan-file-path=${{ inputs.plan-file-path }}" >> "$GITHUB_OUTPUT"
        fi

    - name: Run tofu init
      working-directory: ${{ inputs.chroot-directory }}
      shell: bash
      run: |
        echo "::group::Run tofu init"
        tofu init        \
          -input=false   \
          -backend=false
        echo "::endgroup::"

    - name: Run tofu apply
      working-directory: ${{ inputs.chroot-directory }}
      shell: bash
      run: |
        echo "::group::Run tofu apply"
        tofu apply \
          -auto-approve \
          -input=false \
          "${{ steps.set-plan-file-path.outputs.plan-file-path }}"
        echo "::endgroup::"
