---
name: tf-plan
description: Run tofu plan
author: Kamil Zabielski

inputs:
  chroot-directory:
    description: Directory to chroot into before running tofu plan
    required: false
    default: "."
  environment:
    description: |
      The name of the tf environment to use when running tofu plan. 
      If not provided, the default environment will be used.
    required: true
  tofu-refresh:
    description: |
      Whether to refresh the state before running tofu plan. 
      Defaults to true.
    required: false
    default: "true"
  tofu-destroy:
    description: |
      Whether to run tofu plan with the -destroy flag. 
      Defaults to false.
    required: false
    default: "false"
  plan-retention-days:
    description: |
      Number of days to retain the generated tf plan file. 
      Defaults to 7.
    required: false
    default: "7"
  upload-artifact:
    description: |
      Whether to upload the generated tf plan file as a GitHub Actions artifact. 
      Defaults to true.
    required: false
    default: "true"

outputs:
  plan-file-path:
    description: The path to the generated tf-plan file.
    value: ${{ steps.tf-plan.outputs.plan-file-path }}
  plan-has-changes:
    description: Whether the generated tf plan contains changes. Will be true if the plan contains any changes, including those that require no action, and false if the plan is empty and contains no changes.
    value: ${{ steps.tf-plan.outputs.plan-has-changes }}

runs:
  using: "composite"
  steps:
    - name: Show tofu version
      shell: bash
      run: |
        echo "::group::Show tofu version"
        tofu version
        echo "::endgroup::"

    - name: Run tf init
      working-directory: ${{ inputs.chroot-directory }}
      shell: bash
      run: |
        echo "::group::Run tf init"
        tofu init        \
          -input=false   \
          -backend=false
        echo "::endgroup::"

    - name: Generate random-id for tofu plan
      id: generate-random-id
      shell: bash
      run: |
        echo "plan-id=$(shuf -er -n8  {A..Z} {a..z} {0..9} | tr -d '\n')" >> "$GITHUB_OUTPUT"

    - name: Generate tofu plan name and file path
      id: generate-plan-name
      shell: bash
      run: |
        echo "plan-file-path=${{ runner.temp }}/tofu-plan-${{ inputs.environment }}-${{ github.sha }}-${{ steps.generate-random-id.outputs.plan-id }}.tfplan" >> "$GITHUB_OUTPUT"
        echo "plan-artifact-name=tofu-plan-${{ inputs.environment }}-${{ github.sha }}-${{ steps.generate-random-id.outputs.plan-id }}" >> "$GITHUB_OUTPUT"
        
    - name: Run tf plan
      id: tf-plan
      working-directory: ${{ inputs.chroot-directory }}
      shell: bash
      run: |
        set +e
        tofu plan                           \
          -detailed-exitcode                \
          -destroy=${{ inputs.tofu-destroy }} \
          -refresh=${{ inputs.tofu-refresh }} \
          -out="${{ steps.generate-plan-name.outputs.plan-file-path }}"
        plan_exit_code=$?
        set -e

        if [ "$plan_exit_code" -eq 0 ]; then
          echo "plan-has-changes=false" >> "$GITHUB_OUTPUT"
        elif [ "$plan_exit_code" -eq 2 ]; then
          echo "plan-has-changes=true" >> "$GITHUB_OUTPUT"
        else
          echo "tf plan failed with exit code $plan_exit_code"
          exit "$plan_exit_code"
        fi

    - name: Upload tfplan as artifact
      if: ${{ inputs.upload-artifact == 'true' }}
      uses: actions/upload-artifact@v6
      with:
        name: ${{ steps.generate-plan-name.outputs.plan-artifact-name }}
        path: ${{ steps.generate-plan-name.outputs.plan-file-path }}
        retention-days: ${{ inputs.plan-retention-days }}