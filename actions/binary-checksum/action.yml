---
name: binary-checksum
description: Verify the checksum and optional GPG signature of a binary file
author: Kamil Zabielski

branding:
  icon: shield
  color: gray-dark

inputs:
  file:
    description: Path to the binary file to verify.
    required: true
  algorithm:
    description: |
      Hash algorithm to use for checksum computation.
      Supported values: sha256, sha512, sha1, md5.
      Defaults to sha256.
    required: false
    default: sha256
  checksum:
    description: |
      Expected checksum value to verify against.
      Mutually exclusive with checksum-file.
    required: false
    default: ""
  checksum-file:
    description: |
      Path to a checksum file in BSD or GNU coreutils format (e.g. SHA256SUMS).
      The file is searched for an entry matching the target file name.
      Mutually exclusive with checksum.
    required: false
    default: ""
  signature-file:
    description: |
      Path to a GPG detached signature file (.sig or .asc) for the target file.
      Requires public-key-file or public-key-url.
    required: false
    default: ""
  public-key-file:
    description: |
      Path to a GPG public key file used to verify the signature.
      Mutually exclusive with public-key-url.
    required: false
    default: ""
  public-key-url:
    description: |
      URL to download the GPG public key used to verify the signature.
      Mutually exclusive with public-key-file.
    required: false
    default: ""

outputs:
  checksum:
    description: The computed checksum of the file.
    value: ${{ steps.compute-checksum.outputs.checksum }}
  checksum-verified:
    description: Whether the checksum matched the expected value (true/false). Empty when no expected checksum was provided.
    value: ${{ steps.verify-checksum.outputs.checksum-verified }}
  signature-verified:
    description: Whether the GPG signature was verified successfully (true/false). Empty when no signature file was provided.
    value: ${{ steps.verify-signature.outputs.signature-verified }}

runs:
  using: "composite"
  steps:
    - name: Validate inputs
      shell: bash
      run: |
        if [[ ! -f "${{ inputs.file }}" ]]; then
          echo "::error::File not found: ${{ inputs.file }}"
          exit 1
        fi

        algo="${{ inputs.algorithm }}"
        case "$algo" in
          sha256|sha512|sha1|md5) ;;
          *)
            echo "::error::Unsupported algorithm: $algo. Supported values: sha256, sha512, sha1, md5."
            exit 1
            ;;
        esac

        if [[ -n "${{ inputs.checksum }}" && -n "${{ inputs.checksum-file }}" ]]; then
          echo "::error::Only one of checksum or checksum-file may be provided, not both."
          exit 1
        fi

        if [[ -n "${{ inputs.checksum-file }}" && ! -f "${{ inputs.checksum-file }}" ]]; then
          echo "::error::Checksum file not found: ${{ inputs.checksum-file }}"
          exit 1
        fi

        if [[ -n "${{ inputs.signature-file }}" && ! -f "${{ inputs.signature-file }}" ]]; then
          echo "::error::Signature file not found: ${{ inputs.signature-file }}"
          exit 1
        fi

        if [[ -n "${{ inputs.signature-file }}" && -z "${{ inputs.public-key-file }}" && -z "${{ inputs.public-key-url }}" ]]; then
          echo "::error::A signature-file requires either public-key-file or public-key-url."
          exit 1
        fi

        if [[ -n "${{ inputs.public-key-file }}" && -n "${{ inputs.public-key-url }}" ]]; then
          echo "::error::Only one of public-key-file or public-key-url may be provided, not both."
          exit 1
        fi

        if [[ -n "${{ inputs.public-key-file }}" && ! -f "${{ inputs.public-key-file }}" ]]; then
          echo "::error::Public key file not found: ${{ inputs.public-key-file }}"
          exit 1
        fi

    - name: Compute checksum
      id: compute-checksum
      shell: bash
      run: |
        algo="${{ inputs.algorithm }}"
        file="${{ inputs.file }}"

        case "$algo" in
          sha256) cmd="sha256sum" ;;
          sha512) cmd="sha512sum" ;;
          sha1)   cmd="sha1sum"   ;;
          md5)    cmd="md5sum"    ;;
        esac

        computed="$("$cmd" "$file" | awk '{print $1}')"
        echo "checksum=$computed" >> "$GITHUB_OUTPUT"
        echo "Computed $algo checksum: $computed"

    - name: Verify checksum
      id: verify-checksum
      shell: bash
      run: |
        expected=""

        if [[ -n "${{ inputs.checksum }}" ]]; then
          expected="${{ inputs.checksum }}"
        elif [[ -n "${{ inputs.checksum-file }}" ]]; then
          target_name="$(basename "${{ inputs.file }}")"
          expected="$(grep -E "(^[0-9a-fA-F]+[[:space:]]+\*?${target_name}$|${target_name}[[:space:]]*=[[:space:]]*[0-9a-fA-F]+$)" "${{ inputs.checksum-file }}" | head -1 | grep -oE '[0-9a-fA-F]{32,}')"
          if [[ -z "$expected" ]]; then
            echo "::error::No checksum entry found for $target_name in ${{ inputs.checksum-file }}"
            exit 1
          fi
        fi

        if [[ -n "$expected" ]]; then
          computed="${{ steps.compute-checksum.outputs.checksum }}"
          if [[ "$computed" == "$expected" ]]; then
            echo "checksum-verified=true" >> "$GITHUB_OUTPUT"
            echo "Checksum verification passed."
          else
            echo "checksum-verified=false" >> "$GITHUB_OUTPUT"
            echo "::error::Checksum mismatch. Expected: $expected, Got: $computed"
            exit 1
          fi
        else
          echo "checksum-verified=" >> "$GITHUB_OUTPUT"
          echo "No expected checksum provided. Skipping verification."
        fi

    - name: Verify GPG signature
      id: verify-signature
      shell: bash
      run: |
        if [[ -z "${{ inputs.signature-file }}" ]]; then
          echo "signature-verified=" >> "$GITHUB_OUTPUT"
          echo "No signature file provided. Skipping signature verification."
          exit 0
        fi

        gnupg_home="$(mktemp -d)"
        trap 'rm -rf "$gnupg_home"' EXIT

        if [[ -n "${{ inputs.public-key-url }}" ]]; then
          key_file="$gnupg_home/public.key"
          curl -fsSL "${{ inputs.public-key-url }}" -o "$key_file"
          gpg --homedir "$gnupg_home" --batch --import "$key_file"
        elif [[ -n "${{ inputs.public-key-file }}" ]]; then
          gpg --homedir "$gnupg_home" --batch --import "${{ inputs.public-key-file }}"
        fi

        if gpg --homedir "$gnupg_home" --batch --verify "${{ inputs.signature-file }}" "${{ inputs.file }}" 2>&1; then
          echo "signature-verified=true" >> "$GITHUB_OUTPUT"
          echo "GPG signature verification passed."
        else
          echo "signature-verified=false" >> "$GITHUB_OUTPUT"
          echo "::error::GPG signature verification failed."
          exit 1
        fi
