---
name: tofu-plan
description: Run tofu plan
author: Kamil Zabielski

branding:
  icon: eye
  color: gray-dark

inputs:
  chroot-directory:
    description: Directory to chroot into before running tofu plan
    required: false
    default: "."
  environment:
    description: |
      The name of the tf environment to use when running tofu plan. 
      If not provided, the default environment will be used.
    required: true
  tofu-refresh:
    description: |
      Whether to refresh the state before running tofu plan. 
      Defaults to true.
    required: false
    default: "true"
  tofu-destroy:
    description: |
      Whether to run tofu plan with the -destroy flag. 
      Defaults to false.
    required: false
    default: "false"
  plan-retention-days:
    description: |
      Number of days to retain the generated tf plan file. 
      Defaults to 1.
    required: false
    default: "1"
  upload-artifact:
    description: |
      Whether to upload the generated tf plan file as a GitHub Actions artifact. 
      Defaults to true.
    required: false
    default: "true"
  upload-artifact-on-no-changes:
    description: |
      Whether to upload the generated tf plan file as a GitHub Actions artifact when the plan has no changes.
      Accepts true/false. Defaults to false.
    required: false
    default: "false"
  tofu-init-backend:
    description: |
      Whether to initialize the backend during tofu init.
      Accepts true/false. Defaults to true.
    required: false
    default: "true"
  send-to-step-summary:
    description: |
      Whether to send the rendered plan output to the GitHub Step Summary.
      Accepts true/false. Defaults to true.
    required: false
    default: "true"

  sops-secret:
    description: |
      The SOPS decryption key (base64 or raw) to be used for decrypting SOPS secrets.
      If provided, will be set as SOPS_AGE_KEY or SOPS_KMS_KEY environment variable.
    required: false

outputs:
  plan-file-path:
    description: The path to the generated tf-plan file.
    value: ${{ steps.tf-plan.outputs.plan-file-path }}
  plan-artifact-name:
    description: The name to use for the tf plan artifact (used when upload-artifact is true).
    value: ${{ steps.tf-plan.outputs.plan-artifact-name }}
  plan-has-changes:
    description: Whether the generated tf plan contains changes. Will be true if the plan contains any changes, including those that require no action, and false if the plan is empty and contains no changes.
    value: ${{ steps.tf-plan.outputs.plan-has-changes }}
  plan-add-count:
    description: Number of resources the plan will add.
    value: ${{ steps.tf-plan.outputs.plan-add-count }}
  plan-change-count:
    description: Number of resources the plan will change in-place.
    value: ${{ steps.tf-plan.outputs.plan-change-count }}
  plan-destroy-count:
    description: Number of resources the plan will destroy.
    value: ${{ steps.tf-plan.outputs.plan-destroy-count }}
  plan-import-count:
    description: Number of resources the plan will import.
    value: ${{ steps.tf-plan.outputs.plan-import-count }}
  plan-replace-count:
    description: Number of resources the plan will replace.
    value: ${{ steps.tf-plan.outputs.plan-replace-count }}
  plan-artifact-uploaded:
    description: Whether the tf plan was uploaded as a GitHub Actions artifact.
    value: ${{ steps.artifact-uploaded.outputs.plan-artifact-uploaded }}

runs:
  using: "composite"
  steps:
    - name: Validate tofu-init-backend input
      if: ${{ inputs.tofu-init-backend != 'true' && inputs.tofu-init-backend != 'false' }}
      shell: bash
      run: |
        echo "::error::tofu-init-backend must be 'true' or 'false', got '${{ inputs.tofu-init-backend }}'"
        exit 1

    - name: Export SOPS secret if provided
      if: ${{ inputs.sops-secret != '' }}
      shell: bash
      run: |
        echo "::add-mask::${{ inputs.sops-secret }}"
        {
          echo 'SOPS_AGE_KEY<<EOF'
          echo '${{ inputs.sops-secret }}'
          echo 'EOF'
        } >> "$GITHUB_ENV"

    - name: Validate upload-artifact-on-no-changes input
      if: ${{ inputs.upload-artifact-on-no-changes != 'true' && inputs.upload-artifact-on-no-changes != 'false' }}
      shell: bash
      run: |
        echo "::error::upload-artifact-on-no-changes must be 'true' or 'false', got '${{ inputs.upload-artifact-on-no-changes }}'"
        exit 1

    - name: Show tofu version
      shell: bash
      run: |
        echo "::group::Show tofu version"
        tofu version
        echo "::endgroup::"

    - name: Run tofu init
      working-directory: ${{ inputs.chroot-directory }}
      shell: bash
      run: |
        echo "::group::Run tofu init"
        tofu init        \
          -input=false   \
          -backend=${{ inputs.tofu-init-backend }}
        echo "::endgroup::"

    - name: Create random-id for tofu plan filename and artifact name
      id: random-id
      shell: bash
      run: |
        echo "random-id=$(shuf -er -n8  {A..Z} {a..z} {0..9} | tr -d '\n')" >> "$GITHUB_OUTPUT"

    - name: Generate tofu plan filename and artifact name
      id: generate-plan-filename
      shell: bash
      run: |
        echo "plan-file-path=${{ runner.temp }}/tfplan-${{ inputs.environment }}-${{ steps.random-id.outputs.random-id }}.tfplan" >> "$GITHUB_OUTPUT"
        echo "plan-artifact-name=tfplan-${{ inputs.environment }}-${{ steps.random-id.outputs.random-id }}.tfplan" >> "$GITHUB_OUTPUT"
        echo "plan-output-path=${{ runner.temp }}/tfplan-output-${{ inputs.environment }}-${{ steps.random-id.outputs.random-id }}.txt" >> "$GITHUB_OUTPUT"

    - name: Run tofu plan
      id: tf-plan
      working-directory: ${{ inputs.chroot-directory }}
      shell: bash
      run: |
        set +e
        tofu plan                           \
          -detailed-exitcode                \
          -destroy=${{ inputs.tofu-destroy }} \
          -refresh=${{ inputs.tofu-refresh }} \
          -out=${{ steps.generate-plan-filename.outputs.plan-file-path }}
        plan_exit_code=$?
        set -e

        if [ "$plan_exit_code" -eq 0 ]; then
          echo "plan-has-changes=false" >> "$GITHUB_OUTPUT"
        elif [ "$plan_exit_code" -eq 2 ]; then
          echo "plan-has-changes=true" >> "$GITHUB_OUTPUT"
        else
          echo "tf plan failed with exit code $plan_exit_code"
          exit "$plan_exit_code"
        fi
        echo "plan-file-path=${{ steps.generate-plan-filename.outputs.plan-file-path }}" >> "$GITHUB_OUTPUT"
        echo "plan-artifact-name=${{ steps.generate-plan-filename.outputs.plan-artifact-name }}" >> "$GITHUB_OUTPUT"

        tofu show -json "${{ steps.generate-plan-filename.outputs.plan-file-path }}" | jq -r '
          ( .resource_changes // [] )
          | reduce (.[] | .change // {}) as $change (
              {"plan-add-count":0, "plan-change-count":0, "plan-destroy-count":0, "plan-replace-count":0, "plan-import-count":0};
              ($change.actions // []) as $actions
              | if (($actions | index("create")) and ($actions | index("delete"))) or ($actions | index("replace")) then ."plan-replace-count" += 1
                elif ($change.importing != null) or ($actions | index("import")) then ."plan-import-count" += 1
                elif ($actions | index("create")) then ."plan-add-count" += 1
                elif ($actions | index("update")) then ."plan-change-count" += 1
                elif ($actions | index("delete")) then ."plan-destroy-count" += 1
                else . end
            )
          | to_entries[]
          | "\(.key)=\(.value)"
        ' | while IFS= read -r line; do
          echo "$line" >> "$GITHUB_OUTPUT"
        done

    - name: Show plan
      id: show-plan
      working-directory: ${{ inputs.chroot-directory }}
      shell: bash
      run: |
        echo "::group::Show plan"
        tofu show -no-color "${{ steps.generate-plan-filename.outputs.plan-file-path }}" > "${{ steps.generate-plan-filename.outputs.plan-output-path }}"
        echo "plan-output-path=${{ steps.generate-plan-filename.outputs.plan-output-path }}" >> "$GITHUB_OUTPUT"
        echo "::endgroup::"

    - name: Add plan to step summary
      if: ${{ inputs.send-to-step-summary == 'true' }}
      working-directory: ${{ inputs.chroot-directory }}
      shell: bash
      run: |
        {
          echo "## ${{ inputs.environment }}"
          echo '```'
          cat "${{ steps.show-plan.outputs.plan-output-path }}"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload tfplan as artifact
      id: upload-artifact
      if: ${{ inputs.upload-artifact == 'true' && (inputs.upload-artifact-on-no-changes == 'true' || steps.tf-plan.outputs.plan-has-changes == 'true') }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ steps.tf-plan.outputs.plan-artifact-name }}
        path: ${{ steps.tf-plan.outputs.plan-file-path }}
        retention-days: ${{ inputs.plan-retention-days }}
        if-no-files-found: error

    - name: Set plan-artifact-uploaded output
      id: artifact-uploaded
      if: always()
      shell: bash
      run: |
        if [[ "${{ steps.upload-artifact.outcome }}" == "success" ]]; then
          echo "plan-artifact-uploaded=true" >> "$GITHUB_OUTPUT"
        else
          echo "plan-artifact-uploaded=false" >> "$GITHUB_OUTPUT"
        fi
