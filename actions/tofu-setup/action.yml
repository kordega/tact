---
name: tofu-setup
description: Setup tofu cli
author: Kamil Zabielski

branding:
  icon: download
  color: gray-dark

inputs:
  cli-config-credentials-hostname:
    description: |
      The hostname of a Terraform Cloud/Enterprise instance to place within the credentials block of the OpenTofu CLI configuration file. 
      Defaults to app.terraform.io.
    required: false
  cli-config-credentials-token:
    description: |
      The API token for a Terraform Cloud/Enterprise instance to place within the credentials block of the OpenTofu CLI configuration file.
    required: false
  tofu-version:
    description: |
      The version of tofu-cli to install
    required: false
  tofu-version-file:
    description: |
      Path to a file containing the OpenTofu version to install. 
      Supported version syntax is the same as for the tofu-version input. 
      Takes precedence over tofu-version if both are provided.
    required: false
  tofu-wrapper:
    description: |
      Whether to install a wrapper to wrap subsequent calls of the tofu binary and expose its STDOUT, STDERR, and exit code as outputs named stdout, stderr, and exitcode respectively. 
      Defaults to true.
    required: false
  cache:
    description: |
      Whether to use GitHub Actions tool-cache to store and reuse downloaded OpenTofu binaries. 
      Defaults to false.
    required: false
  provider-cache:
    description: |
      Whether to cache OpenTofu providers and registry metadata between workflow runs.
      Defaults to true.
    required: false
    default: "true"
  github-token:
    description: |
      Override the GitHub token read from the environment variable. 
      Defaults to the value of the GITHUB_TOKEN environment variable unless running on Forgejo or Gitea.
    required: false
  verify-checksum:
    description: |
      Whether to verify the checksum and GPG signature of the installed OpenTofu binary against the official release artifacts.
      Defaults to true.
    required: false
    default: "true"

outputs:
  tofu-checksum:
    description: SHA256 checksum of the installed OpenTofu binary.
    value: ${{ steps.verify-checksum.outputs.tofu-checksum }}
  checksum-verified:
    description: Whether the installed binary's checksum was verified against the official release (true/false).
    value: ${{ steps.verify-checksum.outputs.checksum-verified }}

runs:
  using: "composite"
  steps:
    - name: Prepare provider cache directory
      if: ${{ inputs.provider-cache == 'true' }}
      shell: bash
      run: |
        cache_root="$(mktemp -d "$RUNNER_TEMP/tofu-provider-cache-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-0}-XXXXXX")"
        cache_dir="$cache_root/.opentofu/plugin-cache"
        mkdir -p "$cache_dir"
        {
          echo "TOFU_PROVIDER_CACHE_DIR=$cache_dir"
          echo "TF_PLUGIN_CACHE_DIR=$cache_dir"
          echo "TOFU_PLUGIN_CACHE_DIR=$cache_dir"
        } >> "$GITHUB_ENV"

    - name: Cache opentofu providers
      if: ${{ inputs.provider-cache == 'true' }}
      uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
      with:
        path: ${{ env.TOFU_PROVIDER_CACHE_DIR }}
        key: tofu-providers-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') || 'no-lockfile' }}
        restore-keys: |
          tofu-providers-${{ runner.os }}-

    - name: Install tofu-cli
      uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
      with:
        github_token: ${{ inputs.github-token }}
        cli_config_credentials_hostname: ${{ inputs.cli-config-credentials-hostname }}
        cli_config_credentials_token: ${{ inputs.cli-config-credentials-token }}
        tofu_version: ${{ inputs.tofu-version }}
        tofu_version_file: ${{ inputs.tofu-version-file }}
        tofu_wrapper: ${{ inputs.tofu-wrapper }}
        cache: ${{ inputs.cache }}

    - name: Verify tofu binary checksum
      if: ${{ inputs.verify-checksum == 'true' }}
      id: verify-checksum
      shell: bash
      run: |
        set -euo pipefail

        version="$(tofu version -json | jq -r '.terraform_version')"
        os="$(uname -s | tr '[:upper:]' '[:lower:]')"
        case "$(uname -m)" in
          x86_64)  arch="amd64" ;;
          aarch64) arch="arm64" ;;
          armv7l)  arch="arm"   ;;
          *)       arch="$(uname -m)" ;;
        esac

        verify_dir="$(mktemp -d)"
        trap 'rm -rf "$verify_dir"' EXIT

        release_url="https://github.com/opentofu/opentofu/releases/download/v${version}"
        archive="tofu_${version}_${os}_${arch}.zip"

        echo "::group::Download verification artifacts for tofu v${version}"
        curl -fsSL -o "${verify_dir}/SHA256SUMS"        "${release_url}/tofu_${version}_SHA256SUMS"
        curl -fsSL -o "${verify_dir}/SHA256SUMS.gpgsig" "${release_url}/tofu_${version}_SHA256SUMS.gpgsig"
        curl -fsSL -o "${verify_dir}/${archive}"        "${release_url}/${archive}"
        echo "::endgroup::"

        echo "::group::Verify GPG signature on SHA256SUMS"
        gpg_home="${verify_dir}/.gnupg"
        mkdir -m 700 -p "$gpg_home"
        curl -fsSL https://get.opentofu.org/opentofu.gpg \
          | gpg --homedir "$gpg_home" --batch --import 2>&1
        gpg --homedir "$gpg_home" --batch --verify \
          "${verify_dir}/SHA256SUMS.gpgsig" \
          "${verify_dir}/SHA256SUMS" 2>&1
        echo "::endgroup::"

        echo "::group::Verify archive checksum"
        expected="$(grep -E "^[0-9a-f]+[[:space:]]+${archive}$" "${verify_dir}/SHA256SUMS" | awk '{print $1}')"
        actual="$(sha256sum "${verify_dir}/${archive}" | awk '{print $1}')"
        if [[ -z "$expected" ]]; then
          echo "::error::No checksum entry for ${archive} in SHA256SUMS"
          exit 1
        fi
        if [[ "$expected" != "$actual" ]]; then
          echo "::error::Archive checksum mismatch for ${archive}. Expected: ${expected}, Got: ${actual}"
          exit 1
        fi
        echo "Archive checksum OK: ${actual}"
        echo "::endgroup::"

        echo "::group::Verify installed binary matches archive"
        unzip -q -o "${verify_dir}/${archive}" tofu -d "${verify_dir}/extracted"
        if [[ ! -f "${verify_dir}/extracted/tofu" ]]; then
          echo "::error::Failed to extract tofu binary from archive"
          exit 1
        fi
        ref_checksum="$(sha256sum "${verify_dir}/extracted/tofu" | awk '{print $1}')"
        installed_tofu="$(find "${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}/tofu" \
          -name tofu -type f ! -path "*/wrapper/*" -executable 2>/dev/null | head -1)"
        : "${installed_tofu:=$(command -v tofu)}"
        if [[ -z "$installed_tofu" ]]; then
          echo "::error::Could not locate installed tofu binary"
          exit 1
        fi
        bin_checksum="$(sha256sum "$installed_tofu" | awk '{print $1}')"
        if [[ "$ref_checksum" != "$bin_checksum" ]]; then
          echo "::error::Installed binary does not match verified archive. Expected: ${ref_checksum}, Got: ${bin_checksum}"
          exit 1
        fi
        echo "Binary checksum OK: ${bin_checksum}"
        echo "::endgroup::"

        echo "tofu-checksum=${bin_checksum}" >> "$GITHUB_OUTPUT"
        echo "checksum-verified=true" >> "$GITHUB_OUTPUT"
