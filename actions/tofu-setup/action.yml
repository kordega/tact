---
name: tofu-setup
description: Setup tofu cli
author: Kamil Zabielski

branding:
  icon: download
  color: gray-dark

inputs:
  cli-config-credentials-hostname:
    description: |
      The hostname of a Terraform Cloud/Enterprise instance to place within the credentials block of the OpenTofu CLI configuration file. 
      Defaults to app.terraform.io.
    required: false
  cli-config-credentials-token:
    description: |
      The API token for a Terraform Cloud/Enterprise instance to place within the credentials block of the OpenTofu CLI configuration file.
    required: false
  tofu-version:
    description: |
      The version of tofu-cli to install
    required: false
  tofu-version-file:
    description: |
      Path to a file containing the OpenTofu version to install. 
      Supported version syntax is the same as for the tofu-version input. 
      Takes precedence over tofu-version if both are provided.
    required: false
  tofu-wrapper:
    description: |
      Whether to install a wrapper to wrap subsequent calls of the tofu binary and expose its STDOUT, STDERR, and exit code as outputs named stdout, stderr, and exitcode respectively. 
      Defaults to true.
    required: false
  cache:
    description: |
      Whether to use GitHub Actions tool-cache to store and reuse downloaded OpenTofu binaries. 
      Defaults to false.
    required: false
  provider-cache:
    description: |
      Whether to cache OpenTofu providers and registry metadata between workflow runs.
      Defaults to true.
    required: false
    default: "true"
  github-token:
    description: |
      Override the GitHub token read from the environment variable. 
      Defaults to the value of the GITHUB_TOKEN environment variable unless running on Forgejo or Gitea.
    required: false

runs:
  using: "composite"
  steps:
    - name: Prepare provider cache directory
      if: ${{ inputs.provider-cache == 'true' }}
      shell: bash
      run: |
        cache_root="$(mktemp -d "$RUNNER_TEMP/tofu-provider-cache-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-0}-XXXXXX")"
        cache_dir="$cache_root/.opentofu/plugin-cache"
        mkdir -p "$cache_dir"
        {
          echo "TOFU_PROVIDER_CACHE_DIR=$cache_dir"
          echo "TF_PLUGIN_CACHE_DIR=$cache_dir"
          echo "TOFU_PLUGIN_CACHE_DIR=$cache_dir"
        } >> "$GITHUB_ENV"

    - name: Cache opentofu providers
      if: ${{ inputs.provider-cache == 'true' }}
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ env.TOFU_PROVIDER_CACHE_DIR }}
        key: tofu-providers-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') || 'no-lockfile' }}
        restore-keys: |
          tofu-providers-${{ runner.os }}-

    - name: Install tofu-cli
      uses: opentofu/setup-opentofu@fc711fa910b93cba0f3fbecaafc9f42fd0c411cb # v2.0.0
      with:
        github_token: ${{ inputs.github-token }}
        cli_config_credentials_hostname: ${{ inputs.cli-config-credentials-hostname }}
        cli_config_credentials_token: ${{ inputs.cli-config-credentials-token }}
        tofu_version: ${{ inputs.tofu-version }}
        tofu_version_file: ${{ inputs.tofu-version-file }}
        tofu_wrapper: ${{ inputs.tofu-wrapper }}
        cache: ${{ inputs.cache }}
