---
name: tofu-setup
description: Setup tofu cli
author: Kamil Zabielski

branding:
  icon: download
  color: gray-dark

inputs:
  cli-config-credentials-hostname:
    description: |
      The hostname of a Terraform Cloud/Enterprise instance to place within the credentials block of the OpenTofu CLI configuration file.
      Defaults to app.terraform.io.
    required: false
  cli-config-credentials-token:
    description: |
      The API token for a Terraform Cloud/Enterprise instance to place within the credentials block of the OpenTofu CLI configuration file.
    required: false
  tofu-version:
    description: |
      The version of tofu-cli to install.
    required: false
  tofu-version-file:
    description: |
      Path to a file containing the OpenTofu version to install.
      Supported version syntax is the same as for the tofu-version input.
      Takes precedence over tofu-version if both are provided.
    required: false
  tofu-wrapper:
    description: |
      Whether to install a wrapper to wrap subsequent calls of the tofu binary and expose its STDOUT, STDERR, and exit code as outputs named stdout, stderr, and exitcode respectively.
      Accepts true/false. Defaults to true.
    required: false
  cache:
    description: |
      Whether to use GitHub Actions tool-cache to store and reuse downloaded OpenTofu binaries.
      Accepts true/false. Defaults to false.
    required: false
  provider-cache:
    description: |
      Whether to cache OpenTofu providers and registry metadata between workflow runs.
      Accepts true/false. Defaults to true.
    required: false
    default: "true"
  github-token:
    description: |
      Override the GitHub token read from the environment variable.
      Defaults to the value of the GITHUB_TOKEN environment variable unless running on Forgejo or Gitea.
    required: false
  telemetry-enabled:
    description: |
      Whether to export OpenTelemetry traces from every subsequent tofu command in the job.
      Requires telemetry-endpoint.
      Accepts true/false. Defaults to false.
    required: false
    default: "false"
  telemetry-endpoint:
    description: |
      Base OTLP endpoint the traces are exported to, such as a Jaeger collector on http://jaeger.internal:4317.
      Exported as OTEL_EXPORTER_OTLP_ENDPOINT.
      Required when telemetry-enabled is true.
    required: false
    default: ""
  telemetry-exporter:
    description: |
      Exporter used for traces.
      Exported as OTEL_TRACES_EXPORTER. OpenTofu only implements otlp, any other value disables the export.
      Defaults to otlp.
    required: false
    default: "otlp"
  telemetry-protocol:
    description: |
      OTLP transport protocol used to export traces.
      Exported as OTEL_EXPORTER_OTLP_PROTOCOL. Accepts grpc, http/protobuf or http/json.
      Left unset by default, which the exporter treats as http/protobuf.
      Set it to grpc when telemetry-endpoint points at an OTLP gRPC port such as 4317.
    required: false
    default: ""
  telemetry-insecure:
    description: |
      Whether to export traces over a plaintext connection instead of TLS.
      Exported as OTEL_EXPORTER_OTLP_INSECURE. Accepts true/false. Defaults to false.
    required: false
    default: "false"
  telemetry-service-name:
    description: |
      Service name reported on the exported traces.
      Exported as OTEL_SERVICE_NAME. Defaults to the OpenTofu built-in name, "OpenTofu CLI".
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Validate telemetry-enabled input
      if: ${{ inputs.telemetry-enabled != 'true' && inputs.telemetry-enabled != 'false' }}
      shell: bash
      env:
        TELEMETRY_ENABLED: ${{ inputs.telemetry-enabled }}
      run: |
        echo "::error::telemetry-enabled must be 'true' or 'false', got '$TELEMETRY_ENABLED'"
        exit 1

    - name: Validate telemetry-insecure input
      if: ${{ inputs.telemetry-insecure != 'true' && inputs.telemetry-insecure != 'false' }}
      shell: bash
      env:
        TELEMETRY_INSECURE: ${{ inputs.telemetry-insecure }}
      run: |
        echo "::error::telemetry-insecure must be 'true' or 'false', got '$TELEMETRY_INSECURE'"
        exit 1

    - name: Validate telemetry-endpoint input
      if: ${{ inputs.telemetry-enabled == 'true' && inputs.telemetry-endpoint == '' }}
      shell: bash
      run: |
        echo "::error::telemetry-endpoint must be provided when telemetry-enabled is 'true'"
        exit 1

    - name: Configure opentelemetry tracing
      if: ${{ inputs.telemetry-enabled == 'true' }}
      shell: bash
      env:
        TELEMETRY_ENDPOINT: ${{ inputs.telemetry-endpoint }}
        TELEMETRY_EXPORTER: ${{ inputs.telemetry-exporter }}
        TELEMETRY_PROTOCOL: ${{ inputs.telemetry-protocol }}
        TELEMETRY_INSECURE: ${{ inputs.telemetry-insecure }}
        TELEMETRY_SERVICE_NAME: ${{ inputs.telemetry-service-name }}
      run: |
        {
          echo "OTEL_TRACES_EXPORTER=$TELEMETRY_EXPORTER"
          echo "OTEL_EXPORTER_OTLP_ENDPOINT=$TELEMETRY_ENDPOINT"
          echo "OTEL_EXPORTER_OTLP_INSECURE=$TELEMETRY_INSECURE"
        } >> "$GITHUB_ENV"

        if [[ -n "$TELEMETRY_PROTOCOL" ]]; then
          echo "OTEL_EXPORTER_OTLP_PROTOCOL=$TELEMETRY_PROTOCOL" >> "$GITHUB_ENV"
        fi

        if [[ -n "$TELEMETRY_SERVICE_NAME" ]]; then
          echo "OTEL_SERVICE_NAME=$TELEMETRY_SERVICE_NAME" >> "$GITHUB_ENV"
        fi

    - name: Prepare provider cache directory
      if: ${{ inputs.provider-cache == 'true' }}
      shell: bash
      run: |
        cache_root="$(mktemp -d "$RUNNER_TEMP/tofu-provider-cache-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-0}-XXXXXX")"
        cache_dir="$cache_root/.opentofu/plugin-cache"
        mkdir -p "$cache_dir"
        {
          echo "TOFU_PROVIDER_CACHE_DIR=$cache_dir"
          echo "TF_PLUGIN_CACHE_DIR=$cache_dir"
          echo "TOFU_PLUGIN_CACHE_DIR=$cache_dir"
        } >> "$GITHUB_ENV"

    - name: Cache opentofu providers
      if: ${{ inputs.provider-cache == 'true' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.TOFU_PROVIDER_CACHE_DIR }}
        key: tofu-providers-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') || 'no-lockfile' }}
        restore-keys: |
          tofu-providers-${{ runner.os }}-

    - name: Install tofu-cli
      uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
      with:
        github_token: ${{ inputs.github-token }}
        cli_config_credentials_hostname: ${{ inputs.cli-config-credentials-hostname }}
        cli_config_credentials_token: ${{ inputs.cli-config-credentials-token }}
        tofu_version: ${{ inputs.tofu-version }}
        tofu_version_file: ${{ inputs.tofu-version-file }}
        tofu_wrapper: ${{ inputs.tofu-wrapper }}
        cache: ${{ inputs.cache }}
