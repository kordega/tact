---
name: Unit - tofu-encode-secrets

on:
  workflow_call:

permissions:
  contents: read

jobs:
  tofu-encode-secrets:
    name: unit - tofu-encode-secrets
    runs-on: ubuntu-slim
    strategy:
      matrix:
        include:
          - name: single-credential
            key: CLOUDFLARE_API_TOKEN
            value: my-secret-token
          - name: special-characters
            key: TEST_SECRET
            value: "p@ss/w0rd+with=special&chars!"
          - name: simple-value
            key: SIMPLE_SECRET
            value: "line1"
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run tofu-encode-secrets
        id: encode
        uses: ./actions/tofu-encode-secrets
        with:
          credentials: ${{ matrix.key }}=${{ matrix.value }}

      - name: Decode and assert round-trip
        shell: bash
        env:
          ENCODED_CREDENTIALS: ${{ steps.encode.outputs.encoded-credentials }}
          EXPECTED_KEY: ${{ matrix.key }}
          EXPECTED_VALUE: ${{ matrix.value }}
        run: |
          set -euo pipefail
          key="${ENCODED_CREDENTIALS%%=*}"
          encoded_value="${ENCODED_CREDENTIALS#*=}"
          decoded="$(echo "$encoded_value" | base64 -d | base64 -d)"
          if [[ "$key" != "$EXPECTED_KEY" ]]; then
            echo "::error::Expected key '${EXPECTED_KEY}' but got '${key}'"
            exit 1
          fi
          if [[ "$decoded" != "$EXPECTED_VALUE" ]]; then
            echo "::error::Expected value '${EXPECTED_VALUE}' but got '${decoded}'"
            exit 1
          fi
          echo "OK: ${key} encoded and decoded correctly"

  tofu-encode-secrets-multi:
    name: unit - tofu-encode-secrets (multiple credentials)
    runs-on: ubuntu-slim
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run tofu-encode-secrets with multiple credentials
        id: encode
        uses: ./actions/tofu-encode-secrets
        with:
          credentials: |
            TOKEN_A=secret-a-value
            TOKEN_B=secret-b-value

      - name: Run tofu-decode-secrets with encoded output
        uses: ./actions/tofu-decode-secrets
        with:
          encoded-credentials: ${{ steps.encode.outputs.encoded-credentials }}

      - name: Assert both credentials decoded correctly
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TOKEN_A" == "secret-a-value" ]] || { echo "::error::TOKEN_A mismatch: got '$TOKEN_A'"; exit 1; }
          [[ "$TOKEN_B" == "secret-b-value" ]] || { echo "::error::TOKEN_B mismatch: got '$TOKEN_B'"; exit 1; }
          echo "OK: both credentials encoded and decoded correctly"

  tofu-encode-secrets-empty:
    name: unit - tofu-encode-secrets (empty input)
    runs-on: ubuntu-slim
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run tofu-encode-secrets with empty input
        id: encode
        uses: ./actions/tofu-encode-secrets

      - name: Assert output is empty
        shell: bash
        env:
          ENCODED_CREDENTIALS: ${{ steps.encode.outputs.encoded-credentials }}
        run: |
          set -euo pipefail
          if [[ -n "$ENCODED_CREDENTIALS" ]]; then
            echo "::error::Expected empty output but got '${ENCODED_CREDENTIALS}'"
            exit 1
          fi
          echo "OK: empty input produces empty output"

  tofu-encode-secrets-comments:
    name: unit - tofu-encode-secrets (comments and blank lines)
    runs-on: ubuntu-slim
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run tofu-encode-secrets with comments and blank lines
        id: encode
        uses: ./actions/tofu-encode-secrets
        with:
          credentials: |
            # this is a comment
            REAL_SECRET=actual-value

            # another comment
            OTHER_SECRET=other-value

      - name: Run tofu-decode-secrets with encoded output
        uses: ./actions/tofu-decode-secrets
        with:
          encoded-credentials: ${{ steps.encode.outputs.encoded-credentials }}

      - name: Assert only real secrets are decoded
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REAL_SECRET" == "actual-value" ]] || { echo "::error::REAL_SECRET mismatch: got '$REAL_SECRET'"; exit 1; }
          [[ "$OTHER_SECRET" == "other-value" ]] || { echo "::error::OTHER_SECRET mismatch: got '$OTHER_SECRET'"; exit 1; }
          echo "OK: comments and blank lines skipped correctly"
