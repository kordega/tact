---
name: Skeleton - tact tests

on:
  workflow_call:
    inputs:
      tofu-version:
        description: |
          Version of opentofu to install.
        required: false
        type: string
      tofu-version-file:
        description: |
          Path to a file containing the opentofu version to install.
        required: false
        type: string
      run-tofu-fmt:
        description: |
          Run tofu fmt check.
          Defaults to true.
        required: false
        type: boolean
        default: true
      run-tofu-policy-check:
        description: |
          Run the rego policy checks against the tofu configuration.
          Defaults to true.
        required: false
        type: boolean
        default: true
      workflow-telemetry-enabled:
        description: |
          Whether to export OpenTelemetry traces and metrics for the workflow run itself, covering the jobs and steps of this skeleton.
          Requires workflow-telemetry-endpoint.
          The run is read back from the GitHub API with the token the caller granted, so a private repository needs the calling workflow to grant actions: read.
          Defaults to false.
        required: false
        default: false
        type: boolean
      workflow-telemetry-endpoint:
        description: |
          Base OTLP endpoint the workflow traces and metrics are exported to, such as https://otlp-gateway-prod-eu-west-6.grafana.net/otlp.
          Required when workflow-telemetry-enabled is true.
        required: false
        default: ""
        type: string
      workflow-telemetry-protocol:
        description: |
          OTLP transport protocol used to export the workflow telemetry.
          Accepts grpc, http/protobuf or http/json. Defaults to http/protobuf, which is what the OTLP gateways of the hosted backends expect.
        required: false
        default: "http/protobuf"
        type: string
      workflow-telemetry-service-name:
        description: |
          Service name reported on the exported workflow telemetry.
          Defaults to github-actions.
        required: false
        default: "github-actions"
        type: string
      workflow-telemetry-resource-attributes:
        description: |
          Comma-separated list of KEY=VALUE resource attributes attached to the exported workflow telemetry, such as environment=ci,team=platform.
          Empty by default.
        required: false
        default: ""
        type: string
    secrets:
      workflow-telemetry-headers:
        description: |
          Comma-separated list of KEY=VALUE headers sent with the workflow telemetry export, which is where a backend behind authentication reads its credentials from.

          Example for a Grafana Cloud OTLP gateway:
            Authorization=Basic <base64(instance-id:token)>
        required: false

# Permissions are pinned per job rather than for the whole workflow. A called
# workflow may not request a scope the caller withheld, and that is rejected
# when the run is parsed rather than when the job runs — so a workflow-level
# grant here would break every caller that narrows its own permissions, even
# for jobs their inputs leave switched off.

jobs:
  tofu-fmt:
    if: inputs.run-tofu-fmt
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout tact
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kordega/tact
          ref: ${{ github.repository == 'kordega/tact' && github.ref || 'main' }}
          path: .tact

      - name: Run tofu setup
        uses: ./.tact/actions/tofu-setup
        with:
          tofu-version: ${{ inputs.tofu-version }}
          tofu-version-file: ${{ inputs.tofu-version-file }}

      - name: Run tofu fmt
        uses: ./.tact/actions/tofu-fmt

  tofu-policy-check:
    if: inputs.run-tofu-policy-check
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout tact
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kordega/tact
          ref: ${{ github.repository == 'kordega/tact' && github.ref || 'main' }}
          path: .tact

      - name: Run tofu policy check
        uses: ./.tact/actions/tofu-policy-check

  # The action reads the run back from the API, so it has to be the last job of
  # the run rather than a step inside one. always() keeps failed runs and runs
  # whose checks were toggled off reporting alongside the green ones.
  # No permissions block: the job takes what the caller granted. Naming
  # actions: read here would be a request, and a caller that withheld it fails
  # the whole run rather than this job.
  workflow-telemetry:
    if: ${{ always() && inputs.workflow-telemetry-enabled }}
    runs-on: ubuntu-slim
    needs:
      - tofu-fmt
      - tofu-policy-check
    steps:
      - name: Validate workflow-telemetry-endpoint input
        if: ${{ inputs.workflow-telemetry-endpoint == '' }}
        run: |
          echo "::error::workflow-telemetry-endpoint must be provided when workflow-telemetry-enabled is 'true'"
          exit 1

      - name: Send workflow telemetry
        uses: paper2/github-actions-opentelemetry@f7ea8331cf2167431503ed5b0218299d09c19986 # v0.10.2
        env:
          OTEL_SERVICE_NAME: ${{ inputs.workflow-telemetry-service-name }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ inputs.workflow-telemetry-endpoint }}
          OTEL_EXPORTER_OTLP_PROTOCOL: ${{ inputs.workflow-telemetry-protocol }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.workflow-telemetry-headers }}
          OTEL_RESOURCE_ATTRIBUTES: ${{ inputs.workflow-telemetry-resource-attributes }}
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
