---

run-name: Continuous Integration

on:
  push:
    branches: [ 'main' ]
  pull_request:
    branches: [ '**' ]

jobs:
  tf-test:
    runs-on: ubuntu-slim
    strategy:
      matrix:
        include:
          - tf-version: 1.6.0
            chroot-directory: test-fixtures/fmt-passed
            status-code: '0'
          - tf-version: 1.6.0
            chroot-directory: test-fixtures/fmt-failed
            status-code: '3'
          - tf-version: 1.7.0
            chroot-directory: test-fixtures/fmt-passed
            status-code: '0'
          - tf-version: 1.7.0
            chroot-directory: test-fixtures/fmt-failed
            status-code: '3'
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Run tf-setup
        uses: ./src/tf-setup
        with:
          tf-version: ${{ matrix.tf-version }}

      - name: Run tf-fmt
        id: tf-fmt
        uses: ./src/tf-fmt
        continue-on-error: true
        with:
          chroot-directory: ${{ matrix.chroot-directory }}

      - name: Assert tf-fmt status code
        if: steps.tf-fmt.outputs.status-code != matrix.status-code
        run: exit 1

  tf-plan:
    runs-on: ubuntu-slim
    strategy:
      matrix:
        tf-version:
          - 1.6.0
          - 1.7.0
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Run tf-setup
        uses: ./src/tf-setup
        with:
          tf-version: ${{ matrix.tf-version }}

      - name: Run tf-plan
        id: tf-plan
        uses: ./src/tf-plan
        with:
          chroot-directory: test-fixtures/plan-passed
          environment: test