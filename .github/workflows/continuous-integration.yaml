---

run-name: Continuous Integration

on:
  push:
    branches: [ 'main' ]
  pull_request:
    branches: [ '**' ]

jobs:
  tf-test:
    runs-on: ubuntu-slim
    strategy:
      matrix:
        tf-version:
          - 1.6.0
          - 1.7.0
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Run tf-setup
        uses: ./src/tf-setup
        with: 
          version: ${{ matrix.tf-version }}