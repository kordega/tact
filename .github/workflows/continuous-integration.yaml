---
name: Continuous Integration
run-name: ci-${{ github.event_name == 'pull_request' && github.event.number || github.run_number }}


on:
  push:
    branches: [ 'main' ]
  pull_request:
    branches: [ '**' ]

permissions:
  contents: read
  actions: read

jobs:
  lint-actions:
    name: Lint GitHub Actions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run actionlint
        uses: rhysd/actionlint@393031adb9afb225ee52ae2ccd7a5af5525e03e8 # v1.7.11

  get-tofu-releases:
    name: Get tofu minor releases
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-slim
    outputs:
      releases: ${{ steps.read-releases.outputs.releases }}
    steps:
      - name: Restore cached releases
        id: cache-releases
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: .cache/tofu-releases.json
          key: tofu-releases-v1
          restore-keys: |
            tofu-releases-

      - name: Fetch releases if cache missed
        id: get-tofu-releases
        if: steps.cache-releases.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p .cache
          releases="$(curl -s 'https://api.github.com/repos/opentofu/opentofu/releases' | jq -c '
            map(select(.prerelease == false)) |
            map(.tag_name | sub("^v";"")) |
            map(select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))) |
            map(split(".") | {major:(.[0]|tonumber), minor:(.[1]|tonumber), patch:(.[2]|tonumber), ver:(.[0]+"."+.[1]+"."+.[2])}) |
            sort_by(.major,.minor,.patch) |
            group_by(.major,.minor) |
            map(last.ver)
          ')"
          echo "$releases" > .cache/tofu-releases.json

      - name: Read releases
        id: read-releases
        shell: bash
        run: |
          releases="$(cat .cache/tofu-releases.json)"
          echo "$releases"
          echo "releases=$releases" >> "$GITHUB_OUTPUT"

  unit-setup:
    name: Units - tofu-setup
    needs: 
      - get-tofu-releases
    strategy:
      fail-fast: true
      matrix:
        tofu-version: ${{ fromJson(needs.get-tofu-releases.outputs.releases) }}
    runs-on: ubuntu-slim
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run tofu setup
        uses: ./src/tofu-setup
        id: tofu-setup
        with:
          tofu-version: ${{ matrix.tofu-version }}

      - name: Assert tofu setup by checking version
        shell: bash
        run: |
          echo "::group::Show tofu version"
          tofu version
          echo "::endgroup::"

          echo "::group::Check tofu version"
          [ "$(tofu version -json | jq -r '.terraform_version')" = "${{ matrix.tofu-version }}" ] && exit 0 || exit 1
          echo "::endgroup::"

  unit-fmt:
    name: Units - tofu-fmt
    runs-on: ubuntu-slim
    needs: 
      - get-tofu-releases
    strategy:
      matrix:
        tofu-version: ${{ fromJson(needs.get-tofu-releases.outputs.releases) }}
        chroot-directory:
          - tst/fmt-passed
          - tst/fmt-failed
        include:
          - chroot-directory: tst/fmt-passed
            status-code: '0'
          - chroot-directory: tst/fmt-failed
            status-code: '3'
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run tofu setup
        uses: ./src/tofu-setup
        with:
          tofu-version: ${{ matrix.tofu-version }}

      - name: Run tofu fmt
        id: tf-fmt
        uses: ./src/tofu-fmt
        continue-on-error: true
        with:
          chroot-directory: ${{ matrix.chroot-directory }}

      - name: Assert tofu fmt status code
        if: steps.tf-fmt.outputs.status-code != matrix.status-code
        run: exit 1

  unit-plan:
    name: Units - tofu-plan
    runs-on: ubuntu-slim
    needs: 
      - get-tofu-releases
    strategy:
      matrix:
        tofu-version: ${{ fromJson(needs.get-tofu-releases.outputs.releases) }}
        chroot-directory:
          - tst/plan-with-changes
    env:
      TOFU_APPLY: 'true'
      UPLOAD_ARTIFACT: 'false'
      TOFU_DESTROY: 'true'
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run tofu setup
        uses: ./src/tofu-setup
        with:
          tofu-version: ${{ matrix.tofu-version }}

      - name: Run tofu plan for apply test fixture
        id: tf-plan
        uses: ./src/tofu-plan
        with:
          chroot-directory: ${{ matrix.chroot-directory }}
          environment: ${{ matrix.tofu-version }}
          upload-artifact: ${{ env.UPLOAD_ARTIFACT }}

      - name: Assert tofu plan change counts
        shell: bash
        run: |
          set -euo pipefail
          [ "${{ steps.tf-plan.outputs.plan-add-count }}" = "1" ]
          [ "${{ steps.tf-plan.outputs.plan-change-count }}" = "0" ]
          [ "${{ steps.tf-plan.outputs.plan-destroy-count }}" = "0" ]
          [ "${{ steps.tf-plan.outputs.plan-replace-count }}" = "0" ]
          [ "${{ steps.tf-plan.outputs.plan-import-count }}" = "0" ]

      - name: Run tofu apply without artifact
        id: tf-apply-no-artifact
        uses: ./src/tofu-apply
        if: env.TOFU_APPLY == 'true' && env.UPLOAD_ARTIFACT == 'false'
        with:
          chroot-directory: ${{ matrix.chroot-directory }}
          environment: ${{ matrix.tofu-version }}
          plan-file-path: ${{ steps.tf-plan.outputs.plan-file-path }}

      - name: Run tofu apply with artifact
        id: tf-apply-with-artifact
        uses: ./src/tofu-apply
        if: env.TOFU_APPLY == 'true' && env.UPLOAD_ARTIFACT == 'true'
        with:
          chroot-directory: ${{ matrix.chroot-directory }}
          environment: ${{ matrix.tofu-version }}
          plan-artifact-name: ${{ steps.tf-plan.outputs.plan-artifact-name }}

      - name: Run tofu plan for destroy test fixture
        id: tf-plan-destroy
        uses: ./src/tofu-plan
        if: env.TOFU_DESTROY == 'true'
        with:
          chroot-directory: ${{ matrix.chroot-directory }}
          environment: ${{ matrix.tofu-version }}
          tofu-destroy: '${{ env.TOFU_DESTROY }}'
          upload-artifact: '${{ env.UPLOAD_ARTIFACT }}'

      - name: Run tofu apply for destroy test fixture
        id: tf-apply-destroy
        uses: ./src/tofu-apply
        if: env.TOFU_DESTROY == 'true'
        with:
          chroot-directory: ${{ matrix.chroot-directory }}
          environment: ${{ matrix.tofu-version }}
          plan-file-path: ${{ steps.tf-plan-destroy.outputs.plan-file-path }}

  unit-taint:
    name: Units - tofu-taint
    runs-on: ubuntu-slim
    needs:
      - get-tofu-releases
    permissions:
      contents: read
    strategy:
      matrix:
        tofu-version: ${{ fromJson(needs.get-tofu-releases.outputs.releases) }}
        chroot-directory:
          - tst/taint-resource
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run tofu setup
        uses: ./src/tofu-setup
        with:
          tofu-version: ${{ matrix.tofu-version }}

      - name: Run tofu plan for taint test fixture
        id: tf-plan
        uses: ./src/tofu-plan
        with:
          chroot-directory: ${{ matrix.chroot-directory }}
          environment: ${{ matrix.tofu-version }}
          upload-artifact: 'false'

      - name: Run tofu apply to create state
        uses: ./src/tofu-apply
        with:
          chroot-directory: ${{ matrix.chroot-directory }}
          plan-file-path: ${{ steps.tf-plan.outputs.plan-file-path }}

      - name: Run tofu taint
        uses: ./src/tofu-taint
        with:
          chroot-directory: ${{ matrix.chroot-directory }}
          address: time_static.this

      - name: Assert resource is marked for tainting
        working-directory: ${{ matrix.chroot-directory }}
        shell: bash
        run: |
          tofu state pull | jq -e '
            .resources[]
            | select(.type == "time_static" and .name == "this")
            | .instances[].status == "tainted"
          '

  integration-plan:
    name: Integration - plan and apply
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-slim
    outputs:
      plan-has-changes: ${{ steps.tf-plan.outputs.plan-has-changes }}
      plan-artifact-name: ${{ steps.tf-plan.outputs.plan-artifact-name }}
      tofu-version: ${{ matrix.tofu-version }}
    strategy:
      fail-fast: true
      matrix:
        tofu-version:
          - 1.11.5
        chroot-directory:
          - tst/plan-with-changes
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run tofu setup
        uses: ./src/tofu-setup
        with:
          tofu-version: ${{ matrix.tofu-version }}

      - name: Run tofu plan
        id: tf-plan
        uses: ./src/tofu-plan
        with:
          chroot-directory: ${{ matrix.chroot-directory }}
          environment: integration
          upload-artifact: 'true'

      - name: Assert resources to be added
        shell: bash
        run: |
          [[ "${{ steps.tf-plan.outputs.plan-has-changes }}" = "true" ]]
          [[ "${{ steps.tf-plan.outputs.plan-add-count }}" = "1" ]]

  integration-apply-with-artifact:
    name: Integration - apply with artifact
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-slim
    needs: 
      - integration-plan
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run tofu setup
        uses: ./src/tofu-setup
        with:
          tofu-version: ${{ needs.integration-plan.outputs.tofu-version }}

      - name: Run tofu apply with artifact
        id: tf-apply-with-artifact
        uses: ./src/tofu-apply
        with:
          chroot-directory: tst/plan-with-changes
          environment: integration
          plan-artifact-name: ${{ needs.integration-plan.outputs.plan-artifact-name }}

      - name: Run tofu plan for destroy
        id: tf-plan-destroy
        uses: ./src/tofu-plan
        with:
          chroot-directory: tst/plan-with-changes
          environment: integration
          tofu-destroy: 'true'
          upload-artifact: 'false'

      - name: Assert resources to be removed
        shell: bash
        run: |
          [[ "${{ steps.tf-plan-destroy.outputs.plan-has-changes }}" = "true" ]]
          [[ "${{ steps.tf-plan-destroy.outputs.plan-destroy-count }}" = "1" ]]

      - name: Run tofu apply for destroy
        id: tf-apply-destroy
        uses: ./src/tofu-apply
        with:
          chroot-directory: tst/plan-with-changes
          environment: integration
          plan-file-path: ${{ steps.tf-plan-destroy.outputs.plan-file-path }}
