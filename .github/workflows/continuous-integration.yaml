---
name: Continuous Integration
run-name: ci-${{ github.event_name == 'pull_request' && github.event.number || github.run_number }}


on:
  push:
    branches: [ 'main' ]
  pull_request:
    branches: [ '**' ]

jobs:
  get-tofu-releases:
    name: Get tofu minor releases
    runs-on: ubuntu-slim
    outputs:
      releases: ${{ steps.read-releases.outputs.releases }}
    steps:
      - name: Restore cached releases
        id: cache-releases
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: .cache/tofu-releases.json
          key: tofu-releases-v1
          restore-keys: |
            tofu-releases-

      - name: Fetch releases if cache missed
        id: get-tofu-releases
        if: steps.cache-releases.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p .cache
          releases="$(curl -s 'https://api.github.com/repos/opentofu/opentofu/releases' | jq -c '
            map(select(.prerelease == false)) |
            map(.tag_name | sub("^v";"")) |
            map(select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))) |
            map(split(".") | {major:(.[0]|tonumber), minor:(.[1]|tonumber), patch:(.[2]|tonumber), ver:(.[0]+"."+.[1]+"."+.[2])}) |
            sort_by(.major,.minor,.patch) |
            group_by(.major,.minor) |
            map(last.ver)
          ')"
          echo "$releases" > .cache/tofu-releases.json

      - name: Read releases
        id: read-releases
        shell: bash
        run: |
          releases="$(cat .cache/tofu-releases.json)"
          echo "$releases"
          echo "releases=$releases" >> "$GITHUB_OUTPUT"

  unit-setup:
    name: Units - tofu-setup
    needs: 
      - get-tofu-releases
    strategy:
      fail-fast: true
      matrix:
        tofu-version: ${{ fromJson(needs.get-tofu-releases.outputs.releases) }}
    runs-on: ubuntu-slim
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run tofu setup
        uses: ./src/tofu-setup
        id: tofu-setup
        with:
          tofu-version: ${{ matrix.tofu-version }}

      - name: Assert tofu setup by checking version
        shell: bash
        run: |
          echo "::group::Show tofu version"
          tofu version
          echo "::endgroup::"

          echo "::group::Check tofu version"
          [ "$(tofu version -json | jq -r '.terraform_version')" = "${{ matrix.tofu-version }}" ] && exit 0 || exit 1
          echo "::endgroup::"

  unit-unlock-state:
    name: Units - tofu-unlock-state
    runs-on: ubuntu-slim
    needs:
      - get-tofu-releases
    strategy:
      matrix:
        tofu-version: ${{ fromJson(needs.get-tofu-releases.outputs.releases) }}
        chroot-directory:
          - tst/unlock-state
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run tofu setup
        uses: ./src/tofu-setup
        with:
          tofu-version: ${{ matrix.tofu-version }}

      - name: Start HTTP state server
        shell: bash
        run: |
          cat > /tmp/state-server.py << 'PYEOF'
          import http.server, json
          lock = [b""]
          state = [b""]
          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200 if state[0] else 204)
                  self.end_headers()
                  if state[0]:
                      self.wfile.write(state[0])
              def do_POST(self):
                  n = int(self.headers.get("Content-Length", 0))
                  state[0] = self.rfile.read(n)
                  self.send_response(200)
                  self.end_headers()
              def do_LOCK(self):
                  if lock[0]:
                      self.send_response(423)
                      self.send_header("Content-Type", "application/json")
                      self.end_headers()
                      self.wfile.write(lock[0])
                  else:
                      n = int(self.headers.get("Content-Length", 0))
                      lock[0] = self.rfile.read(n)
                      self.send_response(200)
                      self.end_headers()
              def do_UNLOCK(self):
                  lock[0] = b""
                  self.send_response(200)
                  self.end_headers()
              def log_message(self, *a):
                  pass
          http.server.HTTPServer(("127.0.0.1", 18080), H).serve_forever()
          PYEOF
          nohup python3 /tmp/state-server.py > /tmp/state-server.log 2>&1 &
          sleep 1

      - name: Run tofu init
        working-directory: ${{ matrix.chroot-directory }}
        shell: bash
        run: |
          echo "::group::Run tofu init"
          tofu init \
            -input=false
          echo "::endgroup::"

      - name: Simulate state lock
        shell: bash
        run: |
          curl -sf -X LOCK \
            -H "Content-Type: application/json" \
            -d '{"ID":"test-lock-id","Operation":"OperationTypeApply","Info":"","Who":"test@localhost","Version":"${{ matrix.tofu-version }}","Created":"2024-01-01T00:00:00.000000Z","Path":"terraform.tfstate"}' \
            http://127.0.0.1:18080/state

      - name: Run tofu unlock-state
        uses: ./src/tofu-unlock-state
        with:
          chroot-directory: ${{ matrix.chroot-directory }}
          lock-id: test-lock-id

      - name: Assert state lock has been removed
        shell: bash
        run: |
          response=$(curl -s -X LOCK \
            -H "Content-Type: application/json" \
            -d '{"ID":"verify-lock","Operation":"OperationTypePlan","Info":"","Who":"ci@test","Version":"${{ matrix.tofu-version }}","Created":"2024-01-01T00:00:00.000000Z","Path":"terraform.tfstate"}' \
            -o /dev/null -w "%{http_code}" \
            http://127.0.0.1:18080/state)
          [ "$response" = "200" ] && exit 0 || exit 1

  unit-fmt:
    name: Units - tofu-fmt
    runs-on: ubuntu-slim
    needs: 
      - get-tofu-releases
    strategy:
      matrix:
        tofu-version: ${{ fromJson(needs.get-tofu-releases.outputs.releases) }}
        chroot-directory:
          - tst/fmt-passed
          - tst/fmt-failed
        include:
          - chroot-directory: tst/fmt-passed
            status-code: '0'
          - chroot-directory: tst/fmt-failed
            status-code: '3'
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run tofu setup
        uses: ./src/tofu-setup
        with:
          tofu-version: ${{ matrix.tofu-version }}

      - name: Run tofu fmt
        id: tf-fmt
        uses: ./src/tofu-fmt
        continue-on-error: true
        with:
          chroot-directory: ${{ matrix.chroot-directory }}

      - name: Assert tofu fmt status code
        if: steps.tf-fmt.outputs.status-code != matrix.status-code
        run: exit 1

  unit-plan:
    name: Units - tofu-plan
    runs-on: ubuntu-slim
    needs: 
      - get-tofu-releases
    strategy:
      matrix:
        tofu-version: ${{ fromJson(needs.get-tofu-releases.outputs.releases) }}
        chroot-directory:
          - tst/plan-with-changes
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run tofu setup
        uses: ./src/tofu-setup
        with:
          tofu-version: ${{ matrix.tofu-version }}

      - name: Run tofu plan for apply test fixture
        id: tf-plan
        uses: ./src/tofu-plan
        with:
          chroot-directory: ${{ matrix.chroot-directory }}
          environment: ${{ matrix.tofu-version }}
          upload-artifact: ${{ matrix.upload-artifact }}

      - name: Run tofu apply without artifact
        id: tf-apply-no-artifact
        uses: ./src/tofu-apply
        if: matrix.tofu-apply == 'true' && matrix.upload-artifact == 'false'
        with:
          chroot-directory: ${{ matrix.chroot-directory }}
          environment: ${{ matrix.tofu-version }}
          plan-file-path: ${{ steps.tf-plan.outputs.plan-file-path }}

      - name: Run tofu apply with artifact
        id: tf-apply-with-artifact
        uses: ./src/tofu-apply
        if: matrix.tofu-apply == 'true' && matrix.upload-artifact == 'true'
        with:
          chroot-directory: ${{ matrix.chroot-directory }}
          environment: ${{ matrix.tofu-version }}
          plan-artifact-name: ${{ steps.tf-plan.outputs.plan-artifact-name }}

      - name: Run tofu plan for destroy test fixture
        id: tf-plan-destroy
        uses: ./src/tofu-plan
        if: matrix.tofu-destroy == 'true'
        with:
          chroot-directory: ${{ matrix.chroot-directory }}
          environment: ${{ matrix.tofu-version }}
          tofu-destroy: '${{ matrix.tofu-destroy }}'
          upload-artifact: '${{ matrix.upload-artifact }}'

      - name: Run tofu apply for destroy test fixture
        id: tf-apply-destroy
        uses: ./src/tofu-apply
        if: matrix.tofu-destroy == 'true'
        with:
          chroot-directory: ${{ matrix.chroot-directory }}
          environment: ${{ matrix.tofu-version }}
          plan-file-path: ${{ steps.tf-plan-destroy.outputs.plan-file-path }}

  integration-plan:
    name: Integration - plan and apply
    runs-on: ubuntu-slim
    outputs:
      plan-has-changes: ${{ steps.tf-plan.outputs.plan-has-changes }}
      plan-artifact-name: ${{ steps.tf-plan.outputs.plan-artifact-name }}
      tofu-version: ${{ matrix.tofu-version }}
    strategy:
      fail-fast: true
      matrix:
        chroot-directory:
          - tst/plan-with-changes
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run tofu setup
        uses: ./src/tofu-setup
        with:
          tofu-version: 1.11.5

      - name: Run tofu plan
        id: tf-plan
        uses: ./src/tofu-plan
        with:
          chroot-directory: ${{ matrix.chroot-directory }}
          environment: ${{ matrix.tofu-version }}
          upload-artifact: 'true'

  integration-apply-with-artifact:
    name: Integration - apply with artifact
    runs-on: ubuntu-slim
    needs: 
      - integration-plan
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run tofu setup
        uses: ./src/tofu-setup
        with:
          tofu-version: ${{ needs.integration-plan.outputs.tofu-version }}

      - name: Run tofu apply with artifact
        id: tf-apply-with-artifact
        uses: ./src/tofu-apply
        with:
          chroot-directory: tst/plan-with-changes
          environment: ${{ needs.integration-plan.outputs.tofu-version }}
          plan-artifact-name: ${{ needs.integration-plan.outputs.plan-artifact-name }}
