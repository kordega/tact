---
name: Continuous Integration
run-name: ci-${{ github.event_name == 'pull_request' && github.event.number || github.run_number }}


on:
  push:
    branches: [ 'main' ]
  pull_request:
    branches: [ '**' ]

jobs:
  get-tofu-releases:
    runs-on: ubuntu-slim
    outputs:
      releases: ${{ steps.get-releases.outputs.releases }}
    steps:
      - name: Get last 10 tofu releases
        id: get-releases
        shell: bash
        run: |
          releases="$(curl -s 'https://api.github.com/repos/opentofu/opentofu/releases?per_page=5' | jq -c '[.[].tag_name | sub("^v";"")]')"
          echo "releases=$releases" >> "$GITHUB_OUTPUT"

  tofu-test:
    runs-on: ubuntu-slim
    needs:
      - get-tofu-releases
    strategy:
      matrix:
        tofu-version: ${{ fromJson(needs.get-tofu-releases.outputs.releases) }}
        chroot-directory:
          - test-fixtures/fmt/fmt-passed/fmt-passed-01
          - test-fixtures/fmt/fmt-failed/fmt-failed-01
        include:
          - chroot-directory: test-fixtures/fmt/fmt-passed/fmt-passed-01
            status-code: '0'
          - chroot-directory: test-fixtures/fmt/fmt-failed/fmt-failed-01
            status-code: '3'
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Run tofu setup
        uses: ./src/tofu-setup
        with:
          tofu-version: ${{ matrix.tofu-version }}

      - name: Run tofu fmt
        id: tf-fmt
        uses: ./src/tofu-fmt
        continue-on-error: true
        with:
          chroot-directory: ${{ matrix.chroot-directory }}

      - name: Assert tofu fmt status code
        if: steps.tf-fmt.outputs.status-code != matrix.status-code
        run: exit 1

  tofu-plan-apply:
    runs-on: ubuntu-slim
    needs:
      - get-tofu-releases
    strategy:
      fail-fast: false
      matrix:
        chroot-directory:
          - test-fixtures/plan-apply/plan-apply-passed/plan-apply-passed-01
        tofu-version: ${{ fromJson(needs.get-tofu-releases.outputs.releases) }}
        include:
          - tofu-version: 1.6.0
            upload-artifact: 'true'
            tofu-apply: 'false'
            tofu-destroy: 'false'
          - tofu-version: 1.7.0
            upload-artifact: 'false'
            tofu-apply: 'true'
            tofu-destroy: 'true'
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Run tofu setup
        uses: ./src/tofu-setup
        with:
          tofu-version: ${{ matrix.tofu-version }}

      - name: Run tofu plan for apply test fixture
        id: tf-plan
        uses: ./src/tofu-plan
        with:
          chroot-directory: ${{ matrix.chroot-directory }}
          environment: ${{ matrix.tofu-version }}
          upload-artifact: ${{ matrix.upload-artifact }}

      - name: Run tofu apply without artifact
        id: tf-apply-no-artifact
        uses: ./src/tofu-apply
        if: matrix.tofu-apply == 'true' && matrix.upload-artifact == 'false'
        with:
          chroot-directory: ${{ matrix.chroot-directory }}
          environment: ${{ matrix.tofu-version }}
          plan-file-path: ${{ steps.tf-plan.outputs.plan-file-path }}

      - name: Run tofu apply with artifact
        id: tf-apply-with-artifact
        uses: ./src/tofu-apply
        if: matrix.tofu-apply == 'true' && matrix.upload-artifact == 'true'
        with:
          chroot-directory: ${{ matrix.chroot-directory }}
          environment: ${{ matrix.tofu-version }}
          plan-artifact-name: ${{ steps.tf-plan.outputs.plan-artifact-name }}

      - name: Run tofu plan for destroy test fixture
        id: tf-plan-destroy
        uses: ./src/tofu-plan
        if: matrix.tofu-destroy == 'true'
        with:
          chroot-directory: ${{ matrix.chroot-directory }}
          environment: ${{ matrix.tofu-version }}
          tofu-destroy: '${{ matrix.tofu-destroy }}'
          upload-artifact: '${{ matrix.upload-artifact }}'

      - name: Run tofu apply for destroy test fixture
        id: tf-apply-destroy
        uses: ./src/tofu-apply
        if: matrix.tofu-destroy == 'true'
        with:
          chroot-directory: ${{ matrix.chroot-directory }}
          environment: ${{ matrix.tofu-version }}
          plan-file-path: ${{ steps.tf-plan-destroy.outputs.plan-file-path }}