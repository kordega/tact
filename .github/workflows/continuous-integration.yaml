---
name: Continuous Integration
run-name: ci-${{ github.event_name == 'pull_request' && github.event.number || github.run_number }}


on:
  push:
    branches: [ 'main' ]
  pull_request:
    branches: [ '**' ]

jobs:
  tf-test:
    runs-on: ubuntu-slim
    strategy:
      matrix:
        include:
          - tofu-version: 1.6.0
            chroot-directory: test-fixtures/fmt-passed
            status-code: '0'
          - tofu-version: 1.6.0
            chroot-directory: test-fixtures/fmt-failed
            status-code: '3'
          - tofu-version: 1.7.0
            chroot-directory: test-fixtures/fmt-passed
            status-code: '0'
          - tofu-version: 1.7.0
            chroot-directory: test-fixtures/fmt-failed
            status-code: '3'
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Run tofu setup
        uses: ./src/tofu-setup
        with:
          tofu-version: ${{ matrix.tofu-version }}

      - name: Run tofu fmt
        id: tf-fmt
        uses: ./src/tofu-fmt
        continue-on-error: true
        with:
          chroot-directory: ${{ matrix.chroot-directory }}

      - name: Assert tofu fmt status code
        if: steps.tf-fmt.outputs.status-code != matrix.status-code
        run: exit 1

  tf-plan:
    runs-on: ubuntu-slim
    strategy:
      matrix:
        tofu-version:
          - 1.6.0
          - 1.7.0
        include:
          - tofu-version: 1.6.0
            upload-artifact: 'true'
            tofu-apply: 'false'
          - tofu-version: 1.7.0
            upload-artifact: 'false'
            tofu-apply: 'true'
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Run tofu setup
        uses: ./src/tofu-setup
        with:
          tofu-version: ${{ matrix.tofu-version }}

      - name: Run tofu plan
        id: tf-plan
        uses: ./src/tofu-plan
        with:
          chroot-directory: test-fixtures/plan-passed
          environment: ${{ matrix.tofu-version }}
          upload-artifact: ${{ matrix.upload-artifact }}

      - name: Run tofu apply
        id: tf-apply-no-artifact
        uses: ./src/tofu-apply
        if: matrix.tofu-apply == 'true' && matrix.upload-artifact == 'false'
        with:
          chroot-directory: test-fixtures/plan-passed
          environment: ${{ matrix.tofu-version }}
          plan-file-path: ${{ steps.tf-plan.outputs.plan-file-path }}

      - name: Run tofu apply with artifact
        id: tf-apply-with-artifact
        uses: ./src/tofu-apply
        if: matrix.tofu-apply == 'true' && matrix.upload-artifact == 'true'
        with:
          chroot-directory: test-fixtures/plan-passed
          environment: ${{ matrix.tofu-version }}
          plan-artifact-name: ${{ steps.tf-plan.outputs.plan-artifact-name }}