---
name: Continuous integration
run-name: Continuous integration

on:
  push:
    branches: [ 'main' ]
  pull_request:
    branches: [ '**' ]

permissions:
  contents: read

env:
  TEST_FIXTURES_DIR: test-fixtures

jobs:
  actionlint:
    name: lint / actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7
        with:
          files: .github/workflows/*.yaml

  get-tofu-releases:
    name: setup / prepare tofu releases
    runs-on: ubuntu-slim
    outputs:
      releases: ${{ steps.read-releases.outputs.releases }}
      latest-release: ${{ steps.read-releases.outputs.latest-release }}
    steps:
      - name: Restore cached releases
        id: cache-releases
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/tofu-releases.json
          # v2 narrowed the list to the supported minors. No restore-keys: a
          # prefix fallback is what would hand back the v1 entry and put the
          # unsupported minors back into every matrix.
          key: tofu-releases-v2

      - name: Fetch releases if cache missed
        id: get-tofu-releases
        if: steps.cache-releases.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p .cache
          # 1.10 is the floor: it is the first release that implements
          # OpenTelemetry tracing and the state lock file, both of which the
          # actions rely on.
          releases="$(curl -s 'https://api.github.com/repos/opentofu/opentofu/releases' | jq -c '
            map(select(.prerelease == false)) |
            map(.tag_name | sub("^v";"")) |
            map(select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))) |
            map(split(".") | {major:(.[0]|tonumber), minor:(.[1]|tonumber), patch:(.[2]|tonumber), ver:(.[0]+"."+.[1]+"."+.[2])}) |
            map(select(.major * 100 + .minor >= 110)) |
            sort_by(.major,.minor,.patch) |
            group_by(.major,.minor) |
            map(last.ver)
          ')"
          echo "$releases" > .cache/tofu-releases.json

      - name: Read releases
        id: read-releases
        shell: bash
        run: |
          releases="$(cat .cache/tofu-releases.json)"
          echo "$releases"
          echo "releases=$releases" >> "$GITHUB_OUTPUT"
          # Sorted ascending, so the last entry is the newest minor.
          echo "latest-release=$(echo "$releases" | jq -r '.[-1]')" >> "$GITHUB_OUTPUT"

  unit-setup:
    name: unit - tofu-setup
    runs-on: ubuntu-slim
    needs:
      - get-tofu-releases
    strategy:
      fail-fast: true
      matrix:
        tofu-version: ${{ fromJson(needs.get-tofu-releases.outputs.releases) }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run tofu setup
        id: tofu-setup
        uses: ./actions/tofu-setup
        with:
          tofu-version: ${{ matrix.tofu-version }}

      - name: Assert tofu setup by checking version
        shell: bash
        run: |
          echo "::group::Show tofu version"
          tofu version
          echo "::endgroup::"

          echo "::group::Check tofu version"
          [ "$(tofu version -json | jq -r '.terraform_version')" = "${{ matrix.tofu-version }}" ] && exit 0 || exit 1
          echo "::endgroup::"

      - name: Assert provider cache path
        shell: bash
        run: |
          [[ "$TOFU_PLUGIN_CACHE_DIR" = "$RUNNER_TEMP"/tofu-provider-cache-*/.opentofu/plugin-cache ]]
          [[ "$TF_PLUGIN_CACHE_DIR" = "$TOFU_PLUGIN_CACHE_DIR" ]]
          [[ "$TOFU_PROVIDER_CACHE_DIR" = "$TOFU_PLUGIN_CACHE_DIR" ]]
          [[ "$TOFU_PLUGIN_CACHE_DIR" != "$HOME/.terraform.d/plugin-cache" ]]
          [[ -d "$TOFU_PLUGIN_CACHE_DIR" ]]

  unit-setup-version-file:
    name: unit - tofu-setup with tofu-version-file
    runs-on: ubuntu-slim
    needs:
      - get-tofu-releases
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare tofu version file
        shell: bash
        run: |
          mkdir -p .cache
          echo "${{ fromJson(needs.get-tofu-releases.outputs.releases)[0] }}" > .cache/tofu-version.txt

      - name: Run tofu setup with tofu version file
        id: tofu-setup
        uses: ./actions/tofu-setup
        with:
          tofu-version-file: .cache/tofu-version.txt

      - name: Assert tofu setup by checking version
        shell: bash
        run: |
          echo "::group::Show tofu version"
          tofu version
          echo "::endgroup::"

          echo "::group::Check tofu version"
          status=0
          [ "$(tofu version -json | jq -r '.terraform_version')" = "${{ fromJson(needs.get-tofu-releases.outputs.releases)[0] }}" ] || status=$?
          echo "::endgroup::"
          exit "$status"

  unit-setup-telemetry:
    name: unit - tofu-setup telemetry variables
    runs-on: ubuntu-slim
    needs:
      - get-tofu-releases
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Only the variable export is under test here, so the endpoint points at
      # nothing. Nothing connects to it: tofu is never run in this job.
      - name: Run tofu setup with every telemetry input
        uses: ./actions/tofu-setup
        with:
          tofu-version: ${{ fromJson(needs.get-tofu-releases.outputs.releases)[0] }}
          telemetry-enabled: 'true'
          telemetry-endpoint: http://127.0.0.1:4317
          telemetry-exporter: otlp
          telemetry-protocol: http/protobuf
          telemetry-insecure: 'true'
          telemetry-service-name: tofu-unit

      - name: Assert opentelemetry variables are exported
        shell: bash
        run: |
          set -euo pipefail
          [ "$OTEL_TRACES_EXPORTER" = "otlp" ]
          [ "$OTEL_EXPORTER_OTLP_ENDPOINT" = "http://127.0.0.1:4317" ]
          [ "$OTEL_EXPORTER_OTLP_PROTOCOL" = "http/protobuf" ]
          [ "$OTEL_EXPORTER_OTLP_INSECURE" = "true" ]
          [ "$OTEL_SERVICE_NAME" = "tofu-unit" ]

  unit-setup-telemetry-disabled:
    name: unit - tofu-setup telemetry stays opt-in
    runs-on: ubuntu-slim
    needs:
      - get-tofu-releases
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # An endpoint is supplied on purpose: telemetry-enabled is the only thing
      # that may turn the export on, so configuring a collector without it must
      # still leave tofu silent.
      - name: Run tofu setup with telemetry disabled
        uses: ./actions/tofu-setup
        with:
          tofu-version: ${{ fromJson(needs.get-tofu-releases.outputs.releases)[0] }}
          telemetry-enabled: 'false'
          telemetry-endpoint: http://127.0.0.1:4317
          telemetry-service-name: tofu-unit

      - name: Assert no opentelemetry variables are exported
        shell: bash
        run: |
          set -euo pipefail
          [ -z "${OTEL_TRACES_EXPORTER:-}" ]
          [ -z "${OTEL_EXPORTER_OTLP_ENDPOINT:-}" ]
          [ -z "${OTEL_EXPORTER_OTLP_PROTOCOL:-}" ]
          [ -z "${OTEL_EXPORTER_OTLP_INSECURE:-}" ]
          [ -z "${OTEL_SERVICE_NAME:-}" ]

  unit-unlock-state:
    name: unit - tofu-unlock
    runs-on: ubuntu-latest
    needs:
      - get-tofu-releases
    strategy:
      matrix:
        tofu-version: ${{ fromJson(needs.get-tofu-releases.outputs.releases) }}
        chroot-directory:
          - unlock-state
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run tofu setup
        uses: ./actions/tofu-setup
        with:
          tofu-version: ${{ matrix.tofu-version }}

      - name: Start MinIO
        shell: bash
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live && break
            sleep 1
          done

      - name: Create S3 bucket
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
        shell: bash
        run: |
          aws s3 mb s3://tofu-state \
            --endpoint-url http://127.0.0.1:9000 \
            --region us-east-1

      - name: Run tofu init
        working-directory: ${{ env.TEST_FIXTURES_DIR }}/${{ matrix.chroot-directory }}
        shell: bash
        run: |
          echo "::group::Run tofu init"
          tofu init \
            -input=false
          echo "::endgroup::"

      - name: Simulate state lock
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
        shell: bash
        run: |
          echo '{"ID":"test-lock-id","Operation":"OperationTypeApply","Info":"","Who":"test@localhost","Version":"${{ matrix.tofu-version }}","Created":"2024-01-01T00:00:00.000000Z","Path":"tofu-state/terraform.tfstate"}' \
            | aws s3 cp - s3://tofu-state/terraform.tfstate.tflock \
                --endpoint-url http://127.0.0.1:9000 \
                --region us-east-1 \
                --content-type application/json

      - name: Run tofu unlock-state
        uses: ./actions/tofu-unlock-state
        with:
          chroot-directory: ${{ env.TEST_FIXTURES_DIR }}/${{ matrix.chroot-directory }}
          lock-id: test-lock-id

      - name: Assert state lock has been removed
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
        shell: bash
        run: |
          ! aws s3 ls s3://tofu-state/terraform.tfstate.tflock \
            --endpoint-url http://127.0.0.1:9000 \
            --region us-east-1

  unit-fmt:
    name: unit - tofu-fmt
    runs-on: ubuntu-slim
    needs:
      - get-tofu-releases
    strategy:
      matrix:
        tofu-version: ${{ fromJson(needs.get-tofu-releases.outputs.releases) }}
        chroot-directory:
          - fmt-passed
          - .fmt-failed
        include:
          - chroot-directory: fmt-passed
            status-code: '0'
          - chroot-directory: .fmt-failed
            status-code: '3'
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run tofu setup
        uses: ./actions/tofu-setup
        with:
          tofu-version: ${{ matrix.tofu-version }}

      - name: Run tofu fmt
        id: tf-fmt
        uses: ./actions/tofu-fmt
        continue-on-error: true
        with:
          chroot-directory: ${{ env.TEST_FIXTURES_DIR }}/${{ matrix.chroot-directory }}

      - name: Assert tofu fmt status code
        if: steps.tf-fmt.outputs.status-code != matrix.status-code
        run: exit 1

  unit-policy:
    name: unit - policy unit tests
    runs-on: ubuntu-slim
    env:
      OPA_VERSION: '1.18.2'
      # Percent of policy lines the tests have to reach, counted over every
      # rego file opa loads, test files included.
      COVERAGE_THRESHOLD: '95'
    steps:

      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Runs the check on the passing fixture, which also leaves conftest on
      # PATH for the policy unit tests below.
      - name: Run tofu-policy-check
        uses: ./actions/tofu-policy-check
        with:
          chroot-directory: ${{ env.TEST_FIXTURES_DIR }}/encryption-check-passed

      - name: Verify policy unit tests
        shell: bash
        run: conftest verify --no-color --policy policies

      - name: Install opa
        uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: ${{ env.OPA_VERSION }}
          static: 'true'

      # conftest verify above is the assertion that the policies behave. This
      # runs the same tests a second time only because conftest cannot report
      # coverage, and the coverage upload only speaks cobertura.
      #
      # --threshold is the gate: opa exits non-zero below it, and the default
      # bash shell runs with pipefail, so the step fails with it.
      - name: Collect policy coverage
        shell: bash
        run: |
          opa test policies --coverage --format json --threshold "$COVERAGE_THRESHOLD" |
            jq -rf .github/scripts/opa-coverage-to-cobertura.jq > cobertura.xml

      # A pull request from a fork runs with a read-only token, so the upload
      # job cannot run and the artifact it would consume is not worth making.
      - name: Upload coverage report as artifact
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: policy-coverage
          path: cobertura.xml
          retention-days: 1
          if-no-files-found: error

  upload-policy-coverage:
    name: unit - upload policy coverage
    runs-on: ubuntu-latest
    needs:
      - unit-policy
    if: ${{ !cancelled() && needs.unit-policy.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    permissions:
      contents: read
      code-quality: write
    steps:
      - name: Download coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: policy-coverage

      # The report covers rego, but the API rejects "Open Policy Agent" and
      # every other name for it: language_name is validated against a
      # server-side list that rego is not on. Go is a stand-in picked to get
      # the report accepted at all. What the report actually covers is the
      # label and the .rego paths inside it.
      - name: Upload coverage report
        uses: actions/upload-code-coverage@d8e329117199404bba6fc81efe8093dc7c015e34 # v1.4.2
        with:
          file: cobertura.xml
          language: Go
          label: code-coverage/opa

  unit-policy-check:
    name: unit - tofu-policy-check
    runs-on: ubuntu-slim
    strategy:
      fail-fast: false
      matrix:
        chroot-directory:
          - encryption-check-passed
          - encryption-check-split-files
          - encryption-check-modules-ignored
          - .encryption-check-missing-encryption
          - .encryption-check-missing-plan
          - .encryption-check-not-enforced
          - .encryption-check-undeclared-method
          - .encryption-check-undeclared-key-provider
          - .encryption-check-missing-state
          - .encryption-check-state-not-enforced
          - .encryption-check-state-undeclared-method
          - .encryption-check-state-undeclared-key-provider
        # An exit code only says that something was denied. The finding each
        # fixture is built to provoke says that the right rule denied it, so
        # that is what gets asserted. An empty value expects a clean run.
        include:
          - chroot-directory: encryption-check-passed
            expect-finding: ''
          - chroot-directory: encryption-check-split-files
            expect-finding: ''
          - chroot-directory: encryption-check-modules-ignored
            expect-finding: ''
          - chroot-directory: .encryption-check-missing-encryption
            expect-finding: 'terraform.encryption block is missing'
          - chroot-directory: .encryption-check-missing-plan
            expect-finding: 'terraform.encryption is declared but has no plan{} sub-block'
          - chroot-directory: .encryption-check-not-enforced
            expect-finding: 'terraform.encryption.plan must set enforced = true (got false)'
          - chroot-directory: .encryption-check-undeclared-method
            expect-finding: 'terraform.encryption.plan.method references "method.aes_gcm.missing"'
          - chroot-directory: .encryption-check-undeclared-key-provider
            expect-finding: 'method.aes_gcm.plan keys references "key_provider.pbkdf2.missing"'
          - chroot-directory: .encryption-check-missing-state
            expect-finding: 'terraform.encryption is declared but has no state{} sub-block'
          - chroot-directory: .encryption-check-state-not-enforced
            expect-finding: 'terraform.encryption.state must set enforced = true (got false)'
          - chroot-directory: .encryption-check-state-undeclared-method
            expect-finding: 'terraform.encryption.state.method references "method.aes_gcm.missing"'
          - chroot-directory: .encryption-check-state-undeclared-key-provider
            expect-finding: 'method.aes_gcm.state keys references "key_provider.pbkdf2.missing"'
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No continue-on-error: every fixture here is expected to come back
      # clean, so the action failing the job is itself the assertion that
      # nothing in this matrix denies.
      - name: Run tofu-policy-check
        id: policy-check
        uses: ./actions/tofu-policy-check
        with:
          chroot-directory: ${{ env.TEST_FIXTURES_DIR }}/${{ matrix.chroot-directory }}
          upload-artifact: 'true'
          # Artifact names have to be unique across a workflow run, and every
          # entry in this matrix belongs to the same one.
          artifact-name: conftest-results-${{ matrix.chroot-directory }}

      - name: Assert policy findings
        shell: bash
        env:
          RESULTS_PATH: ${{ steps.policy-check.outputs.results-path }}
          EXPECT_FINDING: ${{ matrix.expect-finding }}
        run: |
          set -euo pipefail
          if [ -z "$EXPECT_FINDING" ]; then
            jq -e '[.[].warnings[]?] | length == 0' "$RESULTS_PATH" > /dev/null
          else
            jq -e --arg want "$EXPECT_FINDING" \
              'any(.[].warnings[]?.msg; contains($want))' "$RESULTS_PATH" > /dev/null
          fi

  unit-plan-encrypted:
    name: unit - tofu-plan produces an encrypted plan file
    runs-on: ubuntu-slim
    strategy:
      matrix:
        # Pinned rather than matrixed over every release: the fixture declares
        # required_version >= 1.12.0, so older minors cannot run it.
        tofu-version:
          - 1.12.4
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run tofu setup
        uses: ./actions/tofu-setup
        with:
          tofu-version: ${{ matrix.tofu-version }}

      - name: Run tofu plan
        id: tf-plan
        uses: ./actions/tofu-plan
        with:
          chroot-directory: ${{ env.TEST_FIXTURES_DIR }}/plan-with-encryption
          environment: ${{ matrix.tofu-version }}
          upload-artifact: 'false'

      - name: Assert plan file is encrypted rather than a plaintext archive
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.encrypted_data and .encryption_version and .meta' \
            "${{ steps.tf-plan.outputs.plan-file-path }}" > /dev/null

  unit-plan:
    name: unit - tofu-plan
    runs-on: ubuntu-slim
    needs:
      - get-tofu-releases
    strategy:
      matrix:
        tofu-version: ${{ fromJson(needs.get-tofu-releases.outputs.releases) }}
        chroot-directory:
          - plan-with-changes
          - plan-without-changes
        include:
          - chroot-directory: plan-with-changes
            plan-has-changes: 'true'
            plan-add-count: '1'
            upload-artifact: 'false'
            tofu-apply: 'true'
            tofu-destroy: 'true'
          - chroot-directory: plan-without-changes
            plan-has-changes: 'false'
            plan-add-count: '0'
            upload-artifact: 'false'
            tofu-apply: 'true'
            tofu-destroy: 'true'
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run tofu setup
        uses: ./actions/tofu-setup
        with:
          tofu-version: ${{ matrix.tofu-version }}

      - name: Run tofu plan for apply test fixture
        id: tf-plan
        uses: ./actions/tofu-plan
        with:
          chroot-directory: ${{ env.TEST_FIXTURES_DIR }}/${{ matrix.chroot-directory }}
          environment: ${{ matrix.tofu-version }}
          upload-artifact: ${{ matrix.upload-artifact }}

      - name: Assert tofu plan change counts
        shell: bash
        run: |
          set -euo pipefail
          [ "${{ steps.tf-plan.outputs.plan-has-changes }}" = "${{ matrix.plan-has-changes }}" ]
          [ "${{ steps.tf-plan.outputs.plan-add-count }}" = "${{ matrix.plan-add-count }}" ]
          [ "${{ steps.tf-plan.outputs.plan-change-count }}" = "0" ]
          [ "${{ steps.tf-plan.outputs.plan-destroy-count }}" = "0" ]
          [ "${{ steps.tf-plan.outputs.plan-replace-count }}" = "0" ]
          [ "${{ steps.tf-plan.outputs.plan-import-count }}" = "0" ]

      - name: Run tofu apply without artifact
        id: tf-apply-no-artifact
        uses: ./actions/tofu-apply
        if: matrix.tofu-apply == 'true' && matrix.upload-artifact == 'false'
        with:
          chroot-directory: ${{ env.TEST_FIXTURES_DIR }}/${{ matrix.chroot-directory }}
          environment: ${{ matrix.tofu-version }}
          plan-file-path: ${{ steps.tf-plan.outputs.plan-file-path }}

      - name: Run tofu apply with artifact
        id: tf-apply-with-artifact
        uses: ./actions/tofu-apply
        if: matrix.tofu-apply == 'true' && matrix.upload-artifact == 'true'
        with:
          chroot-directory: ${{ env.TEST_FIXTURES_DIR }}/${{ matrix.chroot-directory }}
          environment: ${{ matrix.tofu-version }}
          plan-artifact-name: ${{ steps.tf-plan.outputs.plan-artifact-name }}

      - name: Run tofu plan for destroy test fixture
        id: tf-plan-destroy
        uses: ./actions/tofu-plan
        if: matrix.tofu-destroy == 'true'
        with:
          chroot-directory: ${{ env.TEST_FIXTURES_DIR }}/${{ matrix.chroot-directory }}
          environment: ${{ matrix.tofu-version }}
          tofu-destroy: '${{ matrix.tofu-destroy }}'
          upload-artifact: '${{ matrix.upload-artifact }}'

      - name: Run tofu apply for destroy test fixture
        id: tf-apply-destroy
        uses: ./actions/tofu-apply
        if: matrix.tofu-destroy == 'true'
        with:
          chroot-directory: ${{ env.TEST_FIXTURES_DIR }}/${{ matrix.chroot-directory }}
          environment: ${{ matrix.tofu-version }}
          plan-file-path: ${{ steps.tf-plan-destroy.outputs.plan-file-path }}

  unit-plan-init-backend:
    name: unit - tofu-plan - init-backend
    runs-on: ubuntu-slim
    needs:
      - get-tofu-releases
    strategy:
      matrix:
        tofu-version: ${{ fromJson(needs.get-tofu-releases.outputs.releases) }}
        tofu-init-backend:
          - 'true'
          - 'false'
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run tofu setup
        uses: ./actions/tofu-setup
        with:
          tofu-version: ${{ matrix.tofu-version }}

      - name: Run tofu plan with tofu-init-backend=${{ matrix.tofu-init-backend }}
        id: tf-plan
        uses: ./actions/tofu-plan
        with:
          chroot-directory: ${{ env.TEST_FIXTURES_DIR }}/plan-with-changes
          environment: ${{ matrix.tofu-version }}
          tofu-init-backend: '${{ matrix.tofu-init-backend }}'
          upload-artifact: 'false'

      - name: Assert tofu plan change counts
        shell: bash
        run: |
          set -euo pipefail
          [ "${{ steps.tf-plan.outputs.plan-has-changes }}" = "true" ]
          [ "${{ steps.tf-plan.outputs.plan-add-count }}" = "1" ]

      - name: Run tofu apply with tofu-init-backend=${{ matrix.tofu-init-backend }}
        uses: ./actions/tofu-apply
        with:
          chroot-directory: ${{ env.TEST_FIXTURES_DIR }}/plan-with-changes
          environment: ${{ matrix.tofu-version }}
          tofu-init-backend: '${{ matrix.tofu-init-backend }}'
          plan-file-path: ${{ steps.tf-plan.outputs.plan-file-path }}

      - name: Run tofu plan for destroy
        id: tf-plan-destroy
        uses: ./actions/tofu-plan
        with:
          chroot-directory: ${{ env.TEST_FIXTURES_DIR }}/plan-with-changes
          environment: ${{ matrix.tofu-version }}
          tofu-init-backend: '${{ matrix.tofu-init-backend }}'
          tofu-destroy: 'true'
          upload-artifact: 'false'

      - name: Run tofu apply for destroy
        uses: ./actions/tofu-apply
        with:
          chroot-directory: ${{ env.TEST_FIXTURES_DIR }}/plan-with-changes
          environment: ${{ matrix.tofu-version }}
          tofu-init-backend: '${{ matrix.tofu-init-backend }}'
          plan-file-path: ${{ steps.tf-plan-destroy.outputs.plan-file-path }}

  unit-plan-upload-artifact-on-no-changes:
    name: unit - tofu-plan - upload-artifact-on-no-changes
    runs-on: ubuntu-slim
    needs:
      - get-tofu-releases
    strategy:
      matrix:
        tofu-version: ${{ fromJson(needs.get-tofu-releases.outputs.releases) }}
        chroot-directory:
          - plan-with-changes
          - plan-without-changes
        upload-artifact-on-no-changes:
          - true
          - false
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run tofu setup
        uses: ./actions/tofu-setup
        with:
          tofu-version: ${{ matrix.tofu-version }}

      - name: Run tofu plan with upload-artifact-on-no-changes=${{ matrix.upload-artifact-on-no-changes }}
        id: tf-plan
        uses: ./actions/tofu-plan
        with:
          chroot-directory: ${{ env.TEST_FIXTURES_DIR }}/${{ matrix.chroot-directory }}
          environment: ${{ matrix.tofu-version }}
          upload-artifact: 'true'
          upload-artifact-on-no-changes: '${{ matrix.upload-artifact-on-no-changes }}'

      - name: Assert plan-artifact-uploaded
        shell: bash
        run: |
          set -euo pipefail
          expected_uploaded="true"
          if [ "${{ matrix.chroot-directory }}" = "plan-without-changes" ] && [ "${{ matrix.upload-artifact-on-no-changes }}" = "false" ]; then
            expected_uploaded="false"
          fi
          [ "${{ steps.tf-plan.outputs.plan-artifact-uploaded }}" = "$expected_uploaded" ]

      - name: Assert artifact exists via GitHub API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected_uploaded="true"
          if [ "${{ matrix.chroot-directory }}" = "plan-without-changes" ] && [ "${{ matrix.upload-artifact-on-no-changes }}" = "false" ]; then
            expected_uploaded="false"
          fi
          artifact_name="${{ steps.tf-plan.outputs.plan-artifact-name }}"
          artifact_exists="$(gh api \
            "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq ".artifacts | any(.name == \"$artifact_name\")")"
          [ "$artifact_exists" = "$expected_uploaded" ]

  unit-taint:
    name: unit - tofu-taint
    runs-on: ubuntu-slim
    needs:
      - get-tofu-releases
    strategy:
      matrix:
        tofu-version: ${{ fromJson(needs.get-tofu-releases.outputs.releases) }}
        chroot-directory:
          - taint-resource
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run tofu setup
        uses: ./actions/tofu-setup
        with:
          tofu-version: ${{ matrix.tofu-version }}

      - name: Run tofu plan for taint test fixture
        id: tf-plan
        uses: ./actions/tofu-plan
        with:
          chroot-directory: ${{ env.TEST_FIXTURES_DIR }}/${{ matrix.chroot-directory }}
          environment: ${{ matrix.tofu-version }}
          upload-artifact: 'false'

      - name: Run tofu apply to create state
        uses: ./actions/tofu-apply
        with:
          chroot-directory: ${{ env.TEST_FIXTURES_DIR }}/${{ matrix.chroot-directory }}
          plan-file-path: ${{ steps.tf-plan.outputs.plan-file-path }}

      - name: Run tofu taint
        uses: ./actions/tofu-taint
        with:
          chroot-directory: ${{ env.TEST_FIXTURES_DIR }}/${{ matrix.chroot-directory }}
          address: time_static.this

      - name: Assert resource is marked for tainting
        working-directory: ${{ env.TEST_FIXTURES_DIR }}/${{ matrix.chroot-directory }}
        shell: bash
        run: |
          tofu state pull | jq -e '
            .resources[]
            | select(.type == "time_static" and .name == "this")
            | .instances[].status == "tainted"
          '

  unit-import:
    name: unit - tofu-import
    runs-on: ubuntu-slim
    needs:
      - get-tofu-releases
    strategy:
      matrix:
        tofu-version: ${{ fromJson(needs.get-tofu-releases.outputs.releases) }}
        chroot-directory:
          - plan-with-import
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run tofu setup
        uses: ./actions/tofu-setup
        with:
          tofu-version: ${{ matrix.tofu-version }}

      - name: Run tofu plan for import test fixture
        id: tf-plan
        uses: ./actions/tofu-plan
        with:
          chroot-directory: ${{ env.TEST_FIXTURES_DIR }}/${{ matrix.chroot-directory }}
          environment: ${{ matrix.tofu-version }}
          upload-artifact: 'false'

      - name: Assert tofu plan import count
        shell: bash
        run: |
          set -euo pipefail
          [ "${{ steps.tf-plan.outputs.plan-import-count }}" = "1" ]

      - name: Run tofu apply to import resource
        uses: ./actions/tofu-apply
        with:
          chroot-directory: ${{ env.TEST_FIXTURES_DIR }}/${{ matrix.chroot-directory }}
          plan-file-path: ${{ steps.tf-plan.outputs.plan-file-path }}

      - name: Assert resource has been imported into state
        working-directory: ${{ env.TEST_FIXTURES_DIR }}/${{ matrix.chroot-directory }}
        shell: bash
        run: |
          tofu state pull | jq -e '
            .resources[]
            | select(.type == "time_static" and .name == "this")
            | .instances[].attributes.rfc3339 == "2024-01-01T00:00:00Z"
          '

  unit-skeleton-extra-secret-env-encode:
    name: unit - skeleton / extra-secret-environment-variables / encode
    runs-on: ubuntu-slim
    outputs:
      extra-secret-environment-variables: ${{ steps.encode.outputs.extra-secret-environment-variables }}
    steps:
      - name: Encode keys
        id: encode
        env:
          SOPS_AGE_KEY_1: 'AGE-SECRET-KEY-18EDM87RHYPH4DNF8V8D80DQPZLY8M08EYD0AYF42A0HJAN225ZGS6EHY7X'
          SOPS_AGE_KEY_2: 'AGE-SECRET-KEY-1TVVD90ZZAYM6ULUN5ZJX2FAJR0885UQNTADMX28WGRMY467Q3G9Q8FSM97'
        run: |
          encoded=$(
            {
              echo "$SOPS_AGE_KEY_1"
              echo "$SOPS_AGE_KEY_2"
            } | base64 -w0 | base64 -w0
          )
          echo "extra-secret-environment-variables=SOPS_AGE_KEY=$encoded" >> "$GITHUB_OUTPUT"

  unit-skeleton-extra-secret-env:
    name: unit - skeleton / extra-secret-environment-variables
    needs:
      - unit-skeleton-extra-secret-env-encode
    uses: ./.github/workflows/skeleton-plan-apply.yaml
    secrets:
      extra-secret-environment-variables: ${{ needs.unit-skeleton-extra-secret-env-encode.outputs.extra-secret-environment-variables }}
    with:
      tofu-version: '1.11.5'
      chroot-directory: test-fixtures/plan-with-sops
      environment: unit
      tofu-apply: true

  integration-plan:
    name: integration / plan
    runs-on: ubuntu-slim
    outputs:
      plan-has-changes: ${{ steps.tf-plan.outputs.plan-has-changes }}
      plan-artifact-name: ${{ steps.tf-plan.outputs.plan-artifact-name }}
      tofu-version: ${{ matrix.tofu-version }}
    strategy:
      fail-fast: true
      matrix:
        tofu-version:
          - 1.11.5
        chroot-directory:
          - plan-with-changes
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run tofu setup
        uses: ./actions/tofu-setup
        with:
          tofu-version: ${{ matrix.tofu-version }}

      - name: Run tofu plan
        id: tf-plan
        uses: ./actions/tofu-plan
        with:
          chroot-directory: ${{ env.TEST_FIXTURES_DIR }}/${{ matrix.chroot-directory }}
          environment: integration
          upload-artifact: 'true'

      - name: Assert resources to be added
        shell: bash
        run: |
          [[ "${{ steps.tf-plan.outputs.plan-has-changes }}" = "true" ]]
          [[ "${{ steps.tf-plan.outputs.plan-add-count }}" = "1" ]]

  integration-apply-with-artifact:
    name: integration / apply with artifact
    runs-on: ubuntu-slim
    needs:
      - integration-plan
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run tofu setup
        uses: ./actions/tofu-setup
        with:
          tofu-version: ${{ needs.integration-plan.outputs.tofu-version }}

      - name: Run tofu apply with artifact
        id: tf-apply-with-artifact
        uses: ./actions/tofu-apply
        with:
          chroot-directory: ${{ env.TEST_FIXTURES_DIR }}/plan-with-changes
          environment: integration
          plan-artifact-name: ${{ needs.integration-plan.outputs.plan-artifact-name }}

      - name: Run tofu plan for destroy
        id: tf-plan-destroy
        uses: ./actions/tofu-plan
        with:
          chroot-directory: ${{ env.TEST_FIXTURES_DIR }}/plan-with-changes
          environment: integration
          tofu-destroy: 'true'
          upload-artifact: 'false'

      - name: Assert resources to be removed
        shell: bash
        run: |
          [[ "${{ steps.tf-plan-destroy.outputs.plan-has-changes }}" = "true" ]]
          [[ "${{ steps.tf-plan-destroy.outputs.plan-destroy-count }}" = "1" ]]

      - name: Run tofu apply for destroy
        id: tf-apply-destroy
        uses: ./actions/tofu-apply
        with:
          chroot-directory: ${{ env.TEST_FIXTURES_DIR }}/plan-with-changes
          environment: integration
          plan-file-path: ${{ steps.tf-plan-destroy.outputs.plan-file-path }}

  integration-skeleton:
    name: integration / skeleton (${{ matrix.chroot-directory }})
    needs:
      - integration-plan
    strategy:
      fail-fast: true
      matrix:
        include:
          - chroot-directory: plan-with-changes
          - chroot-directory: plan-without-changes
    uses: ./.github/workflows/skeleton-plan-apply.yaml
    secrets: inherit
    with:
      tofu-version: ${{ needs.integration-plan.outputs.tofu-version }}
      chroot-directory: test-fixtures/${{ matrix.chroot-directory }}
      environment: integration

  integration-skeleton-apply-disabled:
    name: integration / skeleton apply disabled (${{ matrix.chroot-directory }})
    needs:
      - integration-plan
    strategy:
      fail-fast: true
      matrix:
        include:
          - chroot-directory: plan-with-changes
          - chroot-directory: plan-without-changes
    uses: ./.github/workflows/skeleton-plan-apply.yaml
    secrets: inherit
    with:
      tofu-version: ${{ needs.integration-plan.outputs.tofu-version }}
      chroot-directory: test-fixtures/${{ matrix.chroot-directory }}
      environment: integration
      tofu-apply: false

  integration-skeleton-version-file:
    name: integration / skeleton version file
    needs:
      - integration-plan
    strategy:
      fail-fast: true
      matrix:
        include:
          - chroot-directory: plan-with-changes
          - chroot-directory: plan-without-changes
    uses: ./.github/workflows/skeleton-plan-apply.yaml
    secrets: inherit
    with:
      tofu-version-file: test-fixtures/tofu-version/.tofu-version
      chroot-directory: test-fixtures/${{ matrix.chroot-directory }}
      environment: integration

  integration-skeleton-static-analysis:
    name: integration / skeleton static-analysis
    needs:
      - integration-plan
    uses: ./.github/workflows/skeleton-static-analysis.yaml
    secrets: inherit
    with:
      tofu-version: ${{ needs.integration-plan.outputs.tofu-version }}

  integration-telemetry-jaeger:
    name: integration / telemetry to jaeger
    runs-on: ubuntu-latest
    needs:
      - get-tofu-releases
    strategy:
      fail-fast: false
      # Only the newest minor: what this asserts is that the action reaches a
      # collector, and every supported minor exports over the same protocol.
      # The version matrix on unit-setup already covers the rest.
      matrix:
        # tofu builds its exporter with otel autoexport, whose protocol default
        # is http/protobuf rather than gRPC. So an empty protocol belongs with
        # Jaeger's HTTP port on 4318, and 4317 only works when gRPC is asked
        # for by name. Pairing them the other way exports into a port that
        # cannot decode it, which is silent: tofu still exits 0.
        protocol:
          - default
          - grpc
        include:
          - protocol: default
            telemetry-protocol: ''
            telemetry-port: '4318'
          - protocol: grpc
            telemetry-protocol: grpc
            telemetry-port: '4317'
    env:
      JAEGER_QUERY_URL: http://127.0.0.1:16686
      SERVICE_NAME: tofu-ci-${{ matrix.protocol }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Jaeger v2, which is the image OpenTofu documents this feature against.
      # It serves OTLP on 4317/4318 out of the box, so no collector env needed.
      - name: Start Jaeger
        shell: bash
        run: |
          docker run -d --name jaeger \
            -p 4317:4317 \
            -p 4318:4318 \
            -p 16686:16686 \
            jaegertracing/jaeger:2.5.0
          for _ in $(seq 1 30); do
            curl -sf "$JAEGER_QUERY_URL/api/services" > /dev/null && break
            sleep 1
          done

      - name: Run tofu setup with telemetry
        uses: ./actions/tofu-setup
        with:
          tofu-version: ${{ needs.get-tofu-releases.outputs.latest-release }}
          telemetry-enabled: 'true'
          telemetry-endpoint: http://127.0.0.1:${{ matrix.telemetry-port }}
          telemetry-protocol: ${{ matrix.telemetry-protocol }}
          telemetry-insecure: 'true'
          telemetry-service-name: ${{ env.SERVICE_NAME }}

      # An empty protocol has to keep the variable out of the environment
      # rather than export it empty, which would override the exporter default.
      - name: Assert protocol variable follows the input
        shell: bash
        env:
          EXPECT_PROTOCOL: ${{ matrix.telemetry-protocol }}
        run: |
          set -euo pipefail
          [ "${OTEL_EXPORTER_OTLP_PROTOCOL:-}" = "$EXPECT_PROTOCOL" ]
          [ "$OTEL_EXPORTER_OTLP_ENDPOINT" = "http://127.0.0.1:${{ matrix.telemetry-port }}" ]
          [ "$OTEL_SERVICE_NAME" = "$SERVICE_NAME" ]

      # A fixture with a provider and a resource, so the run walks a real graph
      # and starts a provider. An empty config would leave far less to trace.
      - name: Run tofu plan
        uses: ./actions/tofu-plan
        with:
          chroot-directory: ${{ env.TEST_FIXTURES_DIR }}/plan-with-changes
          environment: ${{ env.SERVICE_NAME }}
          upload-artifact: 'false'

      - name: Assert jaeger received the traces
        shell: bash
        run: |
          set -euo pipefail

          # A search with no window is left to the server default, which has
          # changed between Jaeger versions. Bounding it keeps the query the
          # assertion, not the default.
          end_us="$(( $(date +%s) * 1000000 ))"
          start_us="$(( end_us - 3600 * 1000000 ))"
          traces_url="$JAEGER_QUERY_URL/api/traces?service=$SERVICE_NAME&start=$start_us&end=$end_us&limit=20"

          # Spans are batched and flushed as each tofu process exits, so the
          # collector is polled rather than read once.
          found=false
          for _ in $(seq 1 30); do
            if curl -sf "$traces_url" -o traces.json \
              && jq -e '[.data[]?.spans[]?] | length > 0' traces.json > /dev/null; then
              found=true
              break
            fi
            sleep 2
          done

          if [ "$found" != "true" ]; then
            echo "::error::no spans for $SERVICE_NAME reached jaeger"
            echo "services jaeger knows about:"
            curl -s "$JAEGER_QUERY_URL/api/services" || true
            echo "last response from $traces_url:"
            cat traces.json 2>/dev/null || echo "(no response body)"
            exit 1
          fi

          echo "::group::Operations reported to jaeger"
          jq -r '[.data[]?.spans[]?.operationName] | unique | .[]' traces.json
          echo "::endgroup::"

      - name: Show jaeger logs
        if: failure()
        shell: bash
        run: docker logs jaeger
