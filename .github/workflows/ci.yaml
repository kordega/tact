---
name: Continuous integration
run-name: Continuous integration

on:
  push:
    branches: [ 'main' ]
  pull_request:
    branches: [ '**' ]

permissions:
  contents: read

env:
  TEST_FIXTURES_DIR: test-fixtures

jobs:
  actionlint:
    name: lint / actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run actionlint
        uses: raven-actions/actionlint@205b530c5d9fa8f44ae9ed59f341a0db994aa6f8
        with:
          actionlint_flags: .github/workflows/*.yaml

  get-tofu-releases:
    name: setup / prepare tofu releases
    runs-on: ubuntu-slim
    outputs:
      releases: ${{ steps.read-releases.outputs.releases }}
      releases-with-lockfile: ${{ steps.read-releases.outputs.releases-with-lockfile }}
    steps:
      - name: Restore cached releases
        id: cache-releases
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .cache/tofu-releases.json
          key: tofu-releases-v1
          restore-keys: |
            tofu-releases-

      - name: Fetch releases if cache missed
        id: get-tofu-releases
        if: steps.cache-releases.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p .cache
          releases="$(curl -s 'https://api.github.com/repos/opentofu/opentofu/releases' | jq -c '
            map(select(.prerelease == false)) |
            map(.tag_name | sub("^v";"")) |
            map(select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))) |
            map(split(".") | {major:(.[0]|tonumber), minor:(.[1]|tonumber), patch:(.[2]|tonumber), ver:(.[0]+"."+.[1]+"."+.[2])}) |
            sort_by(.major,.minor,.patch) |
            group_by(.major,.minor) |
            map(last.ver)
          ')"
          echo "$releases" > .cache/tofu-releases.json

      - name: Read releases
        id: read-releases
        shell: bash
        run: |
          releases="$(cat .cache/tofu-releases.json)"
          echo "$releases"
          echo "releases=$releases" >> "$GITHUB_OUTPUT"
          releases_with_lockfile="$(echo "$releases" | jq -c 'map(select(split(".") | (.[0]|tonumber) * 100 + (.[1]|tonumber) >= 110))')"
          echo "releases-with-lockfile=$releases_with_lockfile" >> "$GITHUB_OUTPUT"

  unit-setup:
    name: unit - tofu-setup
    runs-on: ubuntu-slim
    needs:
      - get-tofu-releases
    strategy:
      fail-fast: true
      matrix:
        tofu-version: ${{ fromJson(needs.get-tofu-releases.outputs.releases) }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run tofu setup
        id: tofu-setup
        uses: ./actions/tofu-setup
        with:
          tofu-version: ${{ matrix.tofu-version }}

      - name: Assert tofu setup by checking version
        shell: bash
        run: |
          echo "::group::Show tofu version"
          tofu version
          echo "::endgroup::"

          echo "::group::Check tofu version"
          [ "$(tofu version -json | jq -r '.terraform_version')" = "${{ matrix.tofu-version }}" ] && exit 0 || exit 1
          echo "::endgroup::"

      - name: Assert provider cache path
        shell: bash
        run: |
          [[ "$TOFU_PLUGIN_CACHE_DIR" = "$RUNNER_TEMP"/tofu-provider-cache-*/.opentofu/plugin-cache ]]
          [[ "$TF_PLUGIN_CACHE_DIR" = "$TOFU_PLUGIN_CACHE_DIR" ]]
          [[ "$TOFU_PROVIDER_CACHE_DIR" = "$TOFU_PLUGIN_CACHE_DIR" ]]
          [[ "$TOFU_PLUGIN_CACHE_DIR" != "$HOME/.terraform.d/plugin-cache" ]]
          [[ -d "$TOFU_PLUGIN_CACHE_DIR" ]]

  unit-setup-version-file:
    name: unit - tofu-setup with tofu-version-file
    runs-on: ubuntu-slim
    needs:
      - get-tofu-releases
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Prepare tofu version file
        shell: bash
        run: |
          mkdir -p .cache
          echo "${{ fromJson(needs.get-tofu-releases.outputs.releases)[0] }}" > .cache/tofu-version.txt

      - name: Run tofu setup with tofu version file
        id: tofu-setup
        uses: ./actions/tofu-setup
        with:
          tofu-version-file: .cache/tofu-version.txt

      - name: Assert tofu setup by checking version
        shell: bash
        run: |
          echo "::group::Show tofu version"
          tofu version
          echo "::endgroup::"

          echo "::group::Check tofu version"
          status=0
          [ "$(tofu version -json | jq -r '.terraform_version')" = "${{ fromJson(needs.get-tofu-releases.outputs.releases)[0] }}" ] || status=$?
          echo "::endgroup::"
          exit "$status"

  unit-unlock-state:
    name: unit - tofu-unlock
    runs-on: ubuntu-latest
    needs:
      - get-tofu-releases
    strategy:
      matrix:
        tofu-version: ${{ fromJson(needs.get-tofu-releases.outputs.releases-with-lockfile) }}
        chroot-directory:
          - unlock-state
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run tofu setup
        uses: ./actions/tofu-setup
        with:
          tofu-version: ${{ matrix.tofu-version }}

      - name: Start MinIO
        shell: bash
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live && break
            sleep 1
          done

      - name: Create S3 bucket
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
        shell: bash
        run: |
          aws s3 mb s3://tofu-state \
            --endpoint-url http://127.0.0.1:9000 \
            --region us-east-1

      - name: Run tofu init
        working-directory: ${{ env.TEST_FIXTURES_DIR }}/${{ matrix.chroot-directory }}
        shell: bash
        run: |
          echo "::group::Run tofu init"
          tofu init \
            -input=false
          echo "::endgroup::"

      - name: Simulate state lock
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
        shell: bash
        run: |
          echo '{"ID":"test-lock-id","Operation":"OperationTypeApply","Info":"","Who":"test@localhost","Version":"${{ matrix.tofu-version }}","Created":"2024-01-01T00:00:00.000000Z","Path":"tofu-state/terraform.tfstate"}' \
            | aws s3 cp - s3://tofu-state/terraform.tfstate.tflock \
                --endpoint-url http://127.0.0.1:9000 \
                --region us-east-1 \
                --content-type application/json

      - name: Run tofu unlock-state
        uses: ./actions/tofu-unlock-state
        with:
          chroot-directory: ${{ env.TEST_FIXTURES_DIR }}/${{ matrix.chroot-directory }}
          lock-id: test-lock-id

      - name: Assert state lock has been removed
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
        shell: bash
        run: |
          ! aws s3 ls s3://tofu-state/terraform.tfstate.tflock \
            --endpoint-url http://127.0.0.1:9000 \
            --region us-east-1

  unit-fmt:
    name: unit - tofu-fmt
    runs-on: ubuntu-slim
    needs:
      - get-tofu-releases
    strategy:
      matrix:
        tofu-version: ${{ fromJson(needs.get-tofu-releases.outputs.releases) }}
        chroot-directory:
          - fmt-passed
          - fmt-failed
        include:
          - chroot-directory: fmt-passed
            status-code: '0'
          - chroot-directory: fmt-failed
            status-code: '3'
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run tofu setup
        uses: ./actions/tofu-setup
        with:
          tofu-version: ${{ matrix.tofu-version }}

      - name: Run tofu fmt
        id: tf-fmt
        uses: ./actions/tofu-fmt
        continue-on-error: true
        with:
          chroot-directory: ${{ env.TEST_FIXTURES_DIR }}/${{ matrix.chroot-directory }}

      - name: Assert tofu fmt status code
        if: steps.tf-fmt.outputs.status-code != matrix.status-code
        run: exit 1

  unit-plan:
    name: unit - tofu-plan
    runs-on: ubuntu-slim
    needs:
      - get-tofu-releases
    strategy:
      matrix:
        tofu-version: ${{ fromJson(needs.get-tofu-releases.outputs.releases) }}
        chroot-directory:
          - plan-with-changes
          - plan-without-changes
          - plan-with-sops
        include:
          - chroot-directory: plan-with-changes
            plan-has-changes: 'true'
            plan-add-count: '1'
            upload-artifact: 'false'
            tofu-apply: 'true'
            tofu-destroy: 'true'
            sops-age-key: ''
          - chroot-directory: plan-without-changes
            plan-has-changes: 'false'
            plan-add-count: '0'
            upload-artifact: 'false'
            tofu-apply: 'true'
            tofu-destroy: 'true'
            sops-age-key: ''
          - chroot-directory: plan-with-sops
            plan-has-changes: 'true'
            plan-add-count: '1'
            upload-artifact: 'false'
            tofu-apply: 'true'
            tofu-destroy: 'true'
            sops-age-key: 'AGE-SECRET-KEY-18EDM87RHYPH4DNF8V8D80DQPZLY8M08EYD0AYF42A0HJAN225ZGS6EHY7X'
    env:
      SOPS_AGE_KEY: ${{ matrix.sops-age-key }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run tofu setup
        uses: ./actions/tofu-setup
        with:
          tofu-version: ${{ matrix.tofu-version }}

      - name: Run tofu plan for apply test fixture
        id: tf-plan
        uses: ./actions/tofu-plan
        with:
          chroot-directory: ${{ env.TEST_FIXTURES_DIR }}/${{ matrix.chroot-directory }}
          environment: ${{ matrix.tofu-version }}
          upload-artifact: ${{ matrix.upload-artifact }}

      - name: Assert tofu plan change counts
        shell: bash
        run: |
          set -euo pipefail
          [ "${{ steps.tf-plan.outputs.plan-has-changes }}" = "${{ matrix.plan-has-changes }}" ]
          [ "${{ steps.tf-plan.outputs.plan-add-count }}" = "${{ matrix.plan-add-count }}" ]
          [ "${{ steps.tf-plan.outputs.plan-change-count }}" = "0" ]
          [ "${{ steps.tf-plan.outputs.plan-destroy-count }}" = "0" ]
          [ "${{ steps.tf-plan.outputs.plan-replace-count }}" = "0" ]
          [ "${{ steps.tf-plan.outputs.plan-import-count }}" = "0" ]

      - name: Run tofu apply without artifact
        id: tf-apply-no-artifact
        uses: ./actions/tofu-apply
        if: matrix.tofu-apply == 'true' && matrix.upload-artifact == 'false'
        with:
          chroot-directory: ${{ env.TEST_FIXTURES_DIR }}/${{ matrix.chroot-directory }}
          environment: ${{ matrix.tofu-version }}
          plan-file-path: ${{ steps.tf-plan.outputs.plan-file-path }}

      - name: Run tofu apply with artifact
        id: tf-apply-with-artifact
        uses: ./actions/tofu-apply
        if: matrix.tofu-apply == 'true' && matrix.upload-artifact == 'true'
        with:
          chroot-directory: ${{ env.TEST_FIXTURES_DIR }}/${{ matrix.chroot-directory }}
          environment: ${{ matrix.tofu-version }}
          plan-artifact-name: ${{ steps.tf-plan.outputs.plan-artifact-name }}

      - name: Run tofu plan for destroy test fixture
        id: tf-plan-destroy
        uses: ./actions/tofu-plan
        if: matrix.tofu-destroy == 'true'
        with:
          chroot-directory: ${{ env.TEST_FIXTURES_DIR }}/${{ matrix.chroot-directory }}
          environment: ${{ matrix.tofu-version }}
          tofu-destroy: '${{ matrix.tofu-destroy }}'
          upload-artifact: '${{ matrix.upload-artifact }}'

      - name: Run tofu apply for destroy test fixture
        id: tf-apply-destroy
        uses: ./actions/tofu-apply
        if: matrix.tofu-destroy == 'true'
        with:
          chroot-directory: ${{ env.TEST_FIXTURES_DIR }}/${{ matrix.chroot-directory }}
          environment: ${{ matrix.tofu-version }}
          plan-file-path: ${{ steps.tf-plan-destroy.outputs.plan-file-path }}

  unit-plan-init-backend:
    name: unit - tofu-plan - init-backend
    runs-on: ubuntu-slim
    needs:
      - get-tofu-releases
    strategy:
      matrix:
        tofu-version: ${{ fromJson(needs.get-tofu-releases.outputs.releases) }}
        tofu-init-backend:
          - 'true'
          - 'false'
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run tofu setup
        uses: ./actions/tofu-setup
        with:
          tofu-version: ${{ matrix.tofu-version }}

      - name: Run tofu plan with tofu-init-backend=${{ matrix.tofu-init-backend }}
        id: tf-plan
        uses: ./actions/tofu-plan
        with:
          chroot-directory: ${{ env.TEST_FIXTURES_DIR }}/plan-with-changes
          environment: ${{ matrix.tofu-version }}
          tofu-init-backend: '${{ matrix.tofu-init-backend }}'
          upload-artifact: 'false'

      - name: Assert tofu plan change counts
        shell: bash
        run: |
          set -euo pipefail
          [ "${{ steps.tf-plan.outputs.plan-has-changes }}" = "true" ]
          [ "${{ steps.tf-plan.outputs.plan-add-count }}" = "1" ]

      - name: Run tofu apply with tofu-init-backend=${{ matrix.tofu-init-backend }}
        uses: ./actions/tofu-apply
        with:
          chroot-directory: ${{ env.TEST_FIXTURES_DIR }}/plan-with-changes
          environment: ${{ matrix.tofu-version }}
          tofu-init-backend: '${{ matrix.tofu-init-backend }}'
          plan-file-path: ${{ steps.tf-plan.outputs.plan-file-path }}

      - name: Run tofu plan for destroy
        id: tf-plan-destroy
        uses: ./actions/tofu-plan
        with:
          chroot-directory: ${{ env.TEST_FIXTURES_DIR }}/plan-with-changes
          environment: ${{ matrix.tofu-version }}
          tofu-init-backend: '${{ matrix.tofu-init-backend }}'
          tofu-destroy: 'true'
          upload-artifact: 'false'

      - name: Run tofu apply for destroy
        uses: ./actions/tofu-apply
        with:
          chroot-directory: ${{ env.TEST_FIXTURES_DIR }}/plan-with-changes
          environment: ${{ matrix.tofu-version }}
          tofu-init-backend: '${{ matrix.tofu-init-backend }}'
          plan-file-path: ${{ steps.tf-plan-destroy.outputs.plan-file-path }}

  unit-plan-upload-artifact-on-no-changes:
    name: unit - tofu-plan - upload-artifact-on-no-changes
    runs-on: ubuntu-slim
    needs:
      - get-tofu-releases
    strategy:
      matrix:
        tofu-version: ${{ fromJson(needs.get-tofu-releases.outputs.releases) }}
        chroot-directory:
          - plan-with-changes
          - plan-without-changes
        plan-artifact-uploaded:
          - true
          - false
        upload-artifact-on-no-changes:
          - true
          - false
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run tofu setup
        uses: ./actions/tofu-setup
        with:
          tofu-version: ${{ matrix.tofu-version }}

      - name: Run tofu plan with upload-artifact-on-no-changes=${{ matrix.upload-artifact-on-no-changes }}
        id: tf-plan
        uses: ./actions/tofu-plan
        with:
          chroot-directory: ${{ env.TEST_FIXTURES_DIR }}/${{ matrix.chroot-directory }}
          environment: ${{ matrix.tofu-version }}
          upload-artifact: 'true'
          upload-artifact-on-no-changes: '${{ matrix.upload-artifact-on-no-changes }}'

      - name: Assert plan-artifact-uploaded
        shell: bash
        run: |
          set -euo pipefail
          [ "${{ steps.tf-plan.outputs.plan-artifact-uploaded }}" = "${{ matrix.plan-artifact-uploaded }}" ]

      - name: Assert artifact exists via GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_name="${{ steps.tf-plan.outputs.plan-artifact-name }}"
          artifact_exists="$(gh api \
            "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq ".artifacts | any(.name == \"$artifact_name\")")"
          [ "$artifact_exists" = "${{ matrix.plan-artifact-uploaded }}" ]

  unit-taint:
    name: unit - tofu-taint
    runs-on: ubuntu-slim
    needs:
      - get-tofu-releases
    strategy:
      matrix:
        tofu-version: ${{ fromJson(needs.get-tofu-releases.outputs.releases) }}
        chroot-directory:
          - taint-resource
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run tofu setup
        uses: ./actions/tofu-setup
        with:
          tofu-version: ${{ matrix.tofu-version }}

      - name: Run tofu plan for taint test fixture
        id: tf-plan
        uses: ./actions/tofu-plan
        with:
          chroot-directory: ${{ env.TEST_FIXTURES_DIR }}/${{ matrix.chroot-directory }}
          environment: ${{ matrix.tofu-version }}
          upload-artifact: 'false'

      - name: Run tofu apply to create state
        uses: ./actions/tofu-apply
        with:
          chroot-directory: ${{ env.TEST_FIXTURES_DIR }}/${{ matrix.chroot-directory }}
          plan-file-path: ${{ steps.tf-plan.outputs.plan-file-path }}

      - name: Run tofu taint
        uses: ./actions/tofu-taint
        with:
          chroot-directory: ${{ env.TEST_FIXTURES_DIR }}/${{ matrix.chroot-directory }}
          address: time_static.this

      - name: Assert resource is marked for tainting
        working-directory: ${{ env.TEST_FIXTURES_DIR }}/${{ matrix.chroot-directory }}
        shell: bash
        run: |
          tofu state pull | jq -e '
            .resources[]
            | select(.type == "time_static" and .name == "this")
            | .instances[].status == "tainted"
          '

  unit-import:
    name: unit - tofu-import
    runs-on: ubuntu-slim
    needs:
      - get-tofu-releases
    strategy:
      matrix:
        tofu-version: ${{ fromJson(needs.get-tofu-releases.outputs.releases) }}
        chroot-directory:
          - plan-with-import
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run tofu setup
        uses: ./actions/tofu-setup
        with:
          tofu-version: ${{ matrix.tofu-version }}

      - name: Run tofu plan for import test fixture
        id: tf-plan
        uses: ./actions/tofu-plan
        with:
          chroot-directory: ${{ env.TEST_FIXTURES_DIR }}/${{ matrix.chroot-directory }}
          environment: ${{ matrix.tofu-version }}
          upload-artifact: 'false'

      - name: Assert tofu plan import count
        shell: bash
        run: |
          set -euo pipefail
          [ "${{ steps.tf-plan.outputs.plan-import-count }}" = "1" ]

      - name: Run tofu apply to import resource
        uses: ./actions/tofu-apply
        with:
          chroot-directory: ${{ env.TEST_FIXTURES_DIR }}/${{ matrix.chroot-directory }}
          plan-file-path: ${{ steps.tf-plan.outputs.plan-file-path }}

      - name: Assert resource has been imported into state
        working-directory: ${{ env.TEST_FIXTURES_DIR }}/${{ matrix.chroot-directory }}
        shell: bash
        run: |
          tofu state pull | jq -e '
            .resources[]
            | select(.type == "time_static" and .name == "this")
            | .instances[].attributes.rfc3339 == "2024-01-01T00:00:00Z"
          '

  integration-plan:
    name: integration / plan
    runs-on: ubuntu-slim
    outputs:
      plan-has-changes: ${{ steps.tf-plan.outputs.plan-has-changes }}
      plan-artifact-name: ${{ steps.tf-plan.outputs.plan-artifact-name }}
      tofu-version: ${{ matrix.tofu-version }}
    strategy:
      fail-fast: true
      matrix:
        tofu-version:
          - 1.11.5
        chroot-directory:
          - plan-with-changes
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run tofu setup
        uses: ./actions/tofu-setup
        with:
          tofu-version: ${{ matrix.tofu-version }}

      - name: Run tofu plan
        id: tf-plan
        uses: ./actions/tofu-plan
        with:
          chroot-directory: ${{ env.TEST_FIXTURES_DIR }}/${{ matrix.chroot-directory }}
          environment: integration
          upload-artifact: 'true'

      - name: Assert resources to be added
        shell: bash
        run: |
          [[ "${{ steps.tf-plan.outputs.plan-has-changes }}" = "true" ]]
          [[ "${{ steps.tf-plan.outputs.plan-add-count }}" = "1" ]]

  integration-apply-with-artifact:
    name: integration / apply with artifact
    runs-on: ubuntu-slim
    needs: 
      - integration-plan
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run tofu setup
        uses: ./actions/tofu-setup
        with:
          tofu-version: ${{ needs.integration-plan.outputs.tofu-version }}

      - name: Run tofu apply with artifact
        id: tf-apply-with-artifact
        uses: ./actions/tofu-apply
        with:
          chroot-directory: ${{ env.TEST_FIXTURES_DIR }}/plan-with-changes
          environment: integration
          plan-artifact-name: ${{ needs.integration-plan.outputs.plan-artifact-name }}

      - name: Run tofu plan for destroy
        id: tf-plan-destroy
        uses: ./actions/tofu-plan
        with:
          chroot-directory: ${{ env.TEST_FIXTURES_DIR }}/plan-with-changes
          environment: integration
          tofu-destroy: 'true'
          upload-artifact: 'false'

      - name: Assert resources to be removed
        shell: bash
        run: |
          [[ "${{ steps.tf-plan-destroy.outputs.plan-has-changes }}" = "true" ]]
          [[ "${{ steps.tf-plan-destroy.outputs.plan-destroy-count }}" = "1" ]]

      - name: Run tofu apply for destroy
        id: tf-apply-destroy
        uses: ./actions/tofu-apply
        with:
          chroot-directory: ${{ env.TEST_FIXTURES_DIR }}/plan-with-changes
          environment: integration
          plan-file-path: ${{ steps.tf-plan-destroy.outputs.plan-file-path }}

  integration-skeleton:
    name: integration / skeleton (${{ matrix.chroot-directory }})
    needs:
      - integration-plan
    strategy:
      fail-fast: true
      matrix:
        include:
          - chroot-directory: plan-with-changes
          - chroot-directory: plan-without-changes
    uses: ./.github/workflows/skeleton-plan-apply.yaml
    secrets: inherit
    with:
      tofu-version: ${{ needs.integration-plan.outputs.tofu-version }}
      chroot-directory: test-fixtures/${{ matrix.chroot-directory }}
      environment: integration

  integration-skeleton-apply-disabled:
    name: integration / skeleton apply disabled (${{ matrix.chroot-directory }})
    needs:
      - integration-plan
    strategy:
      fail-fast: true
      matrix:
        include:
          - chroot-directory: plan-with-changes
          - chroot-directory: plan-without-changes
    uses: ./.github/workflows/skeleton-plan-apply.yaml
    secrets: inherit
    with:
      tofu-version: ${{ needs.integration-plan.outputs.tofu-version }}
      chroot-directory: test-fixtures/${{ matrix.chroot-directory }}
      environment: integration
      tofu-apply: false

  integration-skeleton-version-file:
    name: integration / skeleton version file
    needs:
      - integration-plan
    strategy:
      fail-fast: true
      matrix:
        include:
          - chroot-directory: plan-with-changes
          - chroot-directory: plan-without-changes
