---
name: Skeleton - Plan and Apply

on:
  workflow_call:
    inputs:
      tofu-version:
        description: Version of opentofu to install.
        required: false
        type: string
      tofu-version-file:
        description: Path to a file containing the OpenTofu version to install.
        required: false
        type: string
      environment:
        description: Name of the tofu environment used for planning/applying.
        required: true
        type: string
      chroot-directory:
        description: Directory to chroot into before running tofu commands.
        required: false
        default: "."
        type: string
      tofu-apply:
        description: Toggle to run the tofu apply step.
        required: false
        default: true
        type: boolean
      upload-artifact-on-no-changes:
        description: Whether to upload the plan artifact when the plan has no changes.
        required: false
        default: false
        type: boolean
      extra-environment-variables:
        description: |
          Newline-separated list of NAME=VALUE pairs to expose as environment
          variables for the duration of the workflow. Example:
            TF_VAR_region=eu-west-1
            TF_VAR_cluster_name=prod
        required: false
        default: ""
        type: string
    secrets:
      aws-access-key-id:
        description: AWS Access Key ID used for authentication.
        required: false
      aws-secret-access-key:
        description: AWS Secret Access Key used for authentication.
        required: false
      cloudflare-api-token:
        description: Cloudflare API token used for DNS/infrastructure management.
        required: false
      extra-secret-environment-variables:
        description: |
          Newline-separated list of NAME=VALUE pairs to expose as masked environment
          variables for the duration of the workflow. Each VALUE must be double
          base64-encoded so it can be safely carried as a secret string. The runner
          decodes and masks every value before any tofu step runs.

          Encode a value:
            printf '%s' "my-secret" | base64 | base64

          Example secret value:
            TF_VAR_db_password=<base64(base64(password))>
            TF_VAR_api_key=<base64(base64(key))>
        required: false
    outputs:
      plan-has-changes:
        description: Whether the generated plan contains any changes.
        value: ${{ jobs.tofu-plan.outputs.plan-has-changes }}
      plan-add-count:
        description: Number of resources the plan will add.
        value: ${{ jobs.tofu-plan.outputs.plan-add-count }}
      plan-artifact-name:
        description: Name of the uploaded plan artifact.
        value: ${{ jobs.tofu-plan.outputs.plan-artifact-name }}
      plan-artifact-uploaded:
        description: Whether the plan was uploaded as a GitHub Actions artifact.
        value: ${{ jobs.tofu-plan.outputs.plan-artifact-uploaded }}

permissions:
  contents: read

jobs:
  tofu-plan:
    runs-on: ubuntu-slim
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.aws-access-key-id }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.aws-secret-access-key }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.cloudflare-api-token }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      plan-has-changes: ${{ steps.tf-plan.outputs.plan-has-changes }}
      plan-add-count: ${{ steps.tf-plan.outputs.plan-add-count }}
      plan-artifact-name: ${{ steps.tf-plan.outputs.plan-artifact-name }}
      plan-artifact-uploaded: ${{ steps.tf-plan.outputs.plan-artifact-uploaded }}
    steps:
      - name: Set extra environment variables
        if: inputs.extra-environment-variables != ''
        env:
          ENV_VARS: ${{ inputs.extra-environment-variables }}
        run: |
          while IFS= read -r line; do
            [[ -z "$line" ]] && continue
            echo "$line" >> "$GITHUB_ENV"
          done <<< "$ENV_VARS"

      - name: Decode and mask secret environment variables
        if: secrets.extra-secret-environment-variables != ''
        env:
          SECRET_VARS: ${{ secrets.extra-secret-environment-variables }}
        run: |
          while IFS= read -r line; do
            [[ -z "$line" ]] && continue
            key="${line%%=*}"
            value=$(printf '%s' "${line#*=}" | base64 -d | base64 -d)
            echo "::add-mask::${value}"
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
          done <<< "$SECRET_VARS"

      - name: Checkout the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Checkout tact
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          repository: kordega/tact
          ref: ${{ github.repository == 'kordega/tact' && github.ref || 'main' }}
          path: .tact

      - name: Run tofu setup
        uses: ./.tact/actions/tofu-setup
        with:
          tofu-version: ${{ inputs.tofu-version }}
          tofu-version-file: ${{ inputs.tofu-version-file }}

      - name: Run tofu plan
        id: tf-plan
        uses: ./.tact/actions/tofu-plan
        with:
          chroot-directory: ${{ inputs.chroot-directory }}
          environment: ${{ inputs.environment }}
          upload-artifact: 'true'
          upload-artifact-on-no-changes: ${{ inputs.upload-artifact-on-no-changes }}

  tofu-apply:
    if: needs.tofu-plan.outputs.plan-has-changes == 'true' && inputs.tofu-apply
    runs-on: ubuntu-slim
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.aws-access-key-id }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.aws-secret-access-key }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.cloudflare-api-token }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    needs:
      - tofu-plan
    steps:
      - name: Set extra environment variables
        if: inputs.extra-environment-variables != ''
        env:
          ENV_VARS: ${{ inputs.extra-environment-variables }}
        run: |
          while IFS= read -r line; do
            [[ -z "$line" ]] && continue
            echo "$line" >> "$GITHUB_ENV"
          done <<< "$ENV_VARS"

      - name: Decode and mask secret environment variables
        if: secrets.extra-secret-environment-variables != ''
        env:
          SECRET_VARS: ${{ secrets.extra-secret-environment-variables }}
        run: |
          while IFS= read -r line; do
            [[ -z "$line" ]] && continue
            key="${line%%=*}"
            value=$(printf '%s' "${line#*=}" | base64 -d | base64 -d)
            echo "::add-mask::${value}"
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
          done <<< "$SECRET_VARS"

      - name: Checkout the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Checkout tact
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          repository: kordega/tact
          ref: ${{ github.repository == 'kordega/tact' && github.ref || 'main' }}
          path: .tact

      - name: Run tofu setup
        uses: ./.tact/actions/tofu-setup
        with:
          tofu-version: ${{ inputs.tofu-version }}
          tofu-version-file: ${{ inputs.tofu-version-file }}

      - name: Run tofu apply
        uses: ./.tact/actions/tofu-apply
        with:
          chroot-directory: ${{ inputs.chroot-directory }}
          environment: ${{ inputs.environment }}
          plan-artifact-name: ${{ needs.tofu-plan.outputs.plan-artifact-name }}
