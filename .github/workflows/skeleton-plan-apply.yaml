---
name: Skeleton - Plan and Apply

on:
  workflow_call:
    inputs:
      tofu-version:
        description: Version of OpenTofu to install.
        required: false
        type: string
      tofu-version-file:
        description: Path to a file containing the OpenTofu version to install.
        required: false
        type: string
      environment:
        description: Name of the tofu environment used for planning/applying.
        required: true
        type: string
      chroot-directory:
        description: Directory to chroot into before running tofu commands.
        required: false
        default: "."
        type: string
    outputs:
      plan-has-changes:
        description: Whether the generated plan contains any changes.
        value: ${{ jobs.tofu-plan.outputs.plan-has-changes }}
      plan-add-count:
        description: Number of resources the plan will add.
        value: ${{ jobs.tofu-plan.outputs.plan-add-count }}
      plan-artifact-name:
        description: Name of the uploaded plan artifact.
        value: ${{ jobs.tofu-plan.outputs.plan-artifact-name }}

permissions:
  contents: read

jobs:
  tofu-fmt:
    runs-on: ubuntu-slim
    steps:
      - name: Resolve tofu-actions source
        id: workflow-source
        shell: bash
        run: |
          workflow_ref='${{ github.workflow_ref }}'
          if [[ "$workflow_ref" != *"/.github/workflows/"* || "$workflow_ref" != *"@"* ]]; then
            echo "Unexpected github.workflow_ref format: $workflow_ref"
            exit 1
          fi
          echo "repository=${workflow_ref%%/.github/workflows/*}" >> "$GITHUB_OUTPUT"
          echo "ref=${workflow_ref#*@}" >> "$GITHUB_OUTPUT"

      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Checkout tofu-actions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: ${{ steps.workflow-source.outputs.repository }}
          ref: ${{ steps.workflow-source.outputs.ref }}
          path: .tofu-actions

      - name: Run tofu setup
        uses: ./.tofu-actions/src/tofu-setup
        with:
          tofu-version: ${{ inputs.tofu-version }}
          tofu-version-file: ${{ inputs.tofu-version-file }}

      - name: Run tofu fmt
        uses: ./.tofu-actions/src/tofu-fmt
        with:
          chroot-directory: ${{ inputs.chroot-directory }}

  tofu-plan:
    runs-on: ubuntu-slim
    outputs:
      plan-has-changes: ${{ steps.tf-plan.outputs.plan-has-changes }}
      plan-add-count: ${{ steps.tf-plan.outputs.plan-add-count }}
      plan-artifact-name: ${{ steps.tf-plan.outputs.plan-artifact-name }}
    steps:
      - name: Resolve tofu-actions source
        id: workflow-source
        shell: bash
        run: |
          workflow_ref='${{ github.workflow_ref }}'
          if [[ "$workflow_ref" != *"/.github/workflows/"* || "$workflow_ref" != *"@"* ]]; then
            echo "Unexpected github.workflow_ref format: $workflow_ref"
            exit 1
          fi
          echo "repository=${workflow_ref%%/.github/workflows/*}" >> "$GITHUB_OUTPUT"
          echo "ref=${workflow_ref#*@}" >> "$GITHUB_OUTPUT"

      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Checkout tofu-actions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: ${{ steps.workflow-source.outputs.repository }}
          ref: ${{ steps.workflow-source.outputs.ref }}
          path: .tofu-actions

      - name: Run tofu setup
        uses: ./.tofu-actions/src/tofu-setup
        with:
          tofu-version: ${{ inputs.tofu-version }}
          tofu-version-file: ${{ inputs.tofu-version-file }}

      - name: Run tofu plan
        id: tf-plan
        uses: ./.tofu-actions/src/tofu-plan
        with:
          chroot-directory: ${{ inputs.chroot-directory }}
          environment: ${{ inputs.environment }}
          upload-artifact: 'true'

  tofu-apply:
    if: needs.tofu-plan.outputs.plan-has-changes == 'true'
    runs-on: ubuntu-slim
    needs:
      - tofu-plan
    steps:
      - name: Resolve tofu-actions source
        id: workflow-source
        shell: bash
        run: |
          workflow_ref='${{ github.workflow_ref }}'
          if [[ "$workflow_ref" != *"/.github/workflows/"* || "$workflow_ref" != *"@"* ]]; then
            echo "Unexpected github.workflow_ref format: $workflow_ref"
            exit 1
          fi
          echo "repository=${workflow_ref%%/.github/workflows/*}" >> "$GITHUB_OUTPUT"
          echo "ref=${workflow_ref#*@}" >> "$GITHUB_OUTPUT"

      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Checkout tofu-actions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: ${{ steps.workflow-source.outputs.repository }}
          ref: ${{ steps.workflow-source.outputs.ref }}
          path: .tofu-actions

      - name: Run tofu setup
        uses: ./.tofu-actions/src/tofu-setup
        with:
          tofu-version: ${{ inputs.tofu-version }}
          tofu-version-file: ${{ inputs.tofu-version-file }}

      - name: Run tofu apply
        uses: ./.tofu-actions/src/tofu-apply
        with:
          chroot-directory: ${{ inputs.chroot-directory }}
          environment: ${{ inputs.environment }}
          plan-artifact-name: ${{ needs.tofu-plan.outputs.plan-artifact-name }}
