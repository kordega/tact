---
name: Skeleton - Plan and Apply

on:
  workflow_call:
    inputs:
      tofu-version:
        description: |
          Version of opentofu to install.
        required: false
        type: string
      tofu-version-file:
        description: |
          Path to a file containing the OpenTofu version to install.
        required: false
        type: string
      environment:
        description: |
          Name of the tofu environment used for planning/applying.
        required: true
        type: string
      chroot-directory:
        description: |
          Directory to chroot into before running tofu commands.
          Defaults to the current directory.
        required: false
        default: "."
        type: string
      tofu-apply:
        description: |
          Toggle to run the tofu apply step.
          Defaults to true.
        required: false
        default: true
        type: boolean
      upload-artifact-on-no-changes:
        description: |
          Whether to upload the plan artifact when the plan has no changes.
          Defaults to false.
        required: false
        default: false
        type: boolean
      send-to-step-summary-on-no-changes:
        description: |
          Whether to send the plan output to the step summary when the plan has no changes.
          Defaults to true.
        required: false
        default: true
        type: boolean
      tofu-telemetry-enabled:
        description: |
          Whether to export OpenTelemetry traces from the tofu commands.
          Requires tofu-telemetry-endpoint.
          Defaults to false.
        required: false
        default: false
        type: boolean
      tofu-telemetry-endpoint:
        description: |
          Base OTLP endpoint the traces are exported to, such as a Jaeger collector on http://jaeger.internal:4317.
          Required when tofu-telemetry-enabled is true.
        required: false
        default: ""
        type: string
      tofu-telemetry-exporter:
        description: |
          Exporter used for traces.
          OpenTofu only implements otlp, any other value disables the export.
          Defaults to otlp.
        required: false
        default: "otlp"
        type: string
      tofu-telemetry-protocol:
        description: |
          OTLP transport protocol used to export traces.
          Accepts grpc, http/protobuf or http/json.
          Left unset by default, which the exporter treats as http/protobuf.
          Set it to grpc when tofu-telemetry-endpoint points at an OTLP gRPC port such as 4317.
        required: false
        default: ""
        type: string
      tofu-telemetry-insecure:
        description: |
          Whether to export traces over a plaintext connection instead of TLS.
          Defaults to false.
        required: false
        default: false
        type: boolean
      tofu-telemetry-service-name:
        description: |
          Service name reported on the exported traces.
          Defaults to tofu-<environment>, so each environment shows up as its own service in the collector.
        required: false
        default: ""
        type: string
      workflow-telemetry-enabled:
        description: |
          Whether to export OpenTelemetry traces and metrics for the workflow run itself, covering the jobs and steps of this skeleton rather than the tofu commands inside them.
          Requires workflow-telemetry-endpoint.
          The run is read back from the GitHub API with the token the caller granted, so a private repository needs the calling workflow to grant actions: read.
          Defaults to false.
        required: false
        default: false
        type: boolean
      workflow-telemetry-endpoint:
        description: |
          Base OTLP endpoint the workflow traces and metrics are exported to, such as https://otlp-gateway-prod-eu-west-6.grafana.net/otlp.
          Required when workflow-telemetry-enabled is true.
        required: false
        default: ""
        type: string
      workflow-telemetry-protocol:
        description: |
          OTLP transport protocol used to export the workflow telemetry.
          Accepts grpc, http/protobuf or http/json. Defaults to http/protobuf, which is what the OTLP gateways of the hosted backends expect.
        required: false
        default: "http/protobuf"
        type: string
      workflow-telemetry-service-name:
        description: |
          Service name reported on the exported workflow telemetry.
          Defaults to github-actions.
        required: false
        default: "github-actions"
        type: string
      workflow-telemetry-resource-attributes:
        description: |
          Comma-separated list of KEY=VALUE resource attributes attached to the exported workflow telemetry, such as environment=ci,team=platform.
          Empty by default.
        required: false
        default: ""
        type: string
    secrets:
      extra-secret-environment-variables:
        description: |
          Newline-separated list of NAME=VALUE pairs to expose as masked environment variables for the duration of the workflow.
          Each VALUE must be double base64-encoded so it can be safely carried as a secret string.
          The runner decodes and masks every value before any tofu step runs.

          Encode a value:
            printf '%s' "my-secret" | base64 | base64

          Example secret value:
            TF_VAR_db_password=<base64(base64(password))>
            TF_VAR_api_key=<base64(base64(key))>
        required: false
      workflow-telemetry-headers:
        description: |
          Comma-separated list of KEY=VALUE headers sent with the workflow telemetry export, which is where a backend behind authentication reads its credentials from.

          Example for a Grafana Cloud OTLP gateway:
            Authorization=Basic <base64(instance-id:token)>
        required: false
    outputs:
      plan-has-changes:
        description: |
          Whether the generated plan contains any changes.
        value: ${{ jobs.tofu-plan.outputs.plan-has-changes }}
      plan-add-count:
        description: |
          Number of resources the plan will add.
        value: ${{ jobs.tofu-plan.outputs.plan-add-count }}
      plan-artifact-name:
        description: |
          Name of the uploaded plan artifact.
        value: ${{ jobs.tofu-plan.outputs.plan-artifact-name }}
      plan-artifact-uploaded:
        description: |
          Whether the plan was uploaded as a GitHub Actions artifact.
        value: ${{ jobs.tofu-plan.outputs.plan-artifact-uploaded }}

# Permissions are pinned per job rather than for the whole workflow. A called
# workflow may not request a scope the caller withheld, and that is rejected
# when the run is parsed rather than when the job runs — so a workflow-level
# grant here would break every caller that narrows its own permissions, even
# for jobs their inputs leave switched off.

jobs:
  tofu-plan:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      plan-has-changes: ${{ steps.tf-plan.outputs.plan-has-changes }}
      plan-add-count: ${{ steps.tf-plan.outputs.plan-add-count }}
      plan-artifact-name: ${{ steps.tf-plan.outputs.plan-artifact-name }}
      plan-artifact-uploaded: ${{ steps.tf-plan.outputs.plan-artifact-uploaded }}
    steps:
      - name: Decode and mask secret environment variables
        env:
          SECRET_VARS: ${{ secrets.extra-secret-environment-variables }}
        run: |
          while IFS= read -r line; do
            [[ -z "$line" ]] && continue
            key="${line%%=*}"
            value=$(printf '%s' "${line#*=}" | base64 -d | base64 -d)
            while IFS= read -r mask_line; do
              [[ -n "$mask_line" ]] && echo "::add-mask::${mask_line}"
            done <<< "$value"
            delimiter="$(openssl rand -hex 8)"
            printf '%s<<%s\n%s\n%s\n' "$key" "$delimiter" "$value" "$delimiter" >> "$GITHUB_ENV"
          done <<< "$SECRET_VARS"

      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout tact
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kordega/tact
          ref: ${{ github.repository == 'kordega/tact' && github.ref || 'main' }}
          path: .tact

      - name: Run tofu setup
        uses: ./.tact/actions/tofu-setup
        with:
          tofu-version: ${{ inputs.tofu-version }}
          tofu-version-file: ${{ inputs.tofu-version-file }}
          telemetry-enabled: ${{ inputs.tofu-telemetry-enabled }}
          telemetry-endpoint: ${{ inputs.tofu-telemetry-endpoint }}
          telemetry-exporter: ${{ inputs.tofu-telemetry-exporter }}
          telemetry-protocol: ${{ inputs.tofu-telemetry-protocol }}
          telemetry-insecure: ${{ inputs.tofu-telemetry-insecure }}
          telemetry-service-name: ${{ inputs.tofu-telemetry-service-name || format('tofu-{0}', inputs.environment) }}

      - name: Run tofu plan
        id: tf-plan
        uses: ./.tact/actions/tofu-plan
        with:
          chroot-directory: ${{ inputs.chroot-directory }}
          environment: ${{ inputs.environment }}
          upload-artifact: 'true'
          upload-artifact-on-no-changes: ${{ inputs.upload-artifact-on-no-changes }}
          send-to-step-summary-on-no-changes: ${{ inputs.send-to-step-summary-on-no-changes }}

  tofu-apply:
    if: needs.tofu-plan.outputs.plan-has-changes == 'true' && inputs.tofu-apply
    runs-on: ubuntu-slim
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    needs:
      - tofu-plan
    steps:
      - name: Decode and mask secret environment variables
        env:
          SECRET_VARS: ${{ secrets.extra-secret-environment-variables }}
        run: |
          while IFS= read -r line; do
            [[ -z "$line" ]] && continue
            key="${line%%=*}"
            value=$(printf '%s' "${line#*=}" | base64 -d | base64 -d)
            while IFS= read -r mask_line; do
              [[ -n "$mask_line" ]] && echo "::add-mask::${mask_line}"
            done <<< "$value"
            delimiter="$(openssl rand -hex 8)"
            printf '%s<<%s\n%s\n%s\n' "$key" "$delimiter" "$value" "$delimiter" >> "$GITHUB_ENV"
          done <<< "$SECRET_VARS"

      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout tact
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kordega/tact
          ref: ${{ github.repository == 'kordega/tact' && github.ref || 'main' }}
          path: .tact

      - name: Run tofu setup
        uses: ./.tact/actions/tofu-setup
        with:
          tofu-version: ${{ inputs.tofu-version }}
          tofu-version-file: ${{ inputs.tofu-version-file }}
          telemetry-enabled: ${{ inputs.tofu-telemetry-enabled }}
          telemetry-endpoint: ${{ inputs.tofu-telemetry-endpoint }}
          telemetry-exporter: ${{ inputs.tofu-telemetry-exporter }}
          telemetry-protocol: ${{ inputs.tofu-telemetry-protocol }}
          telemetry-insecure: ${{ inputs.tofu-telemetry-insecure }}
          telemetry-service-name: ${{ inputs.tofu-telemetry-service-name || format('tofu-{0}', inputs.environment) }}

      - name: Run tofu apply
        uses: ./.tact/actions/tofu-apply
        with:
          chroot-directory: ${{ inputs.chroot-directory }}
          environment: ${{ inputs.environment }}
          plan-artifact-name: ${{ needs.tofu-plan.outputs.plan-artifact-name }}

  # The action reads the run back from the API, so it has to be the last job of
  # the run rather than a step inside one. always() keeps it reporting the runs
  # worth looking at: the ones where plan or apply failed, and the ones where
  # apply was skipped because the plan held no changes.
  # No permissions block: the job takes what the caller granted. Naming
  # actions: read here would be a request, and a caller that withheld it fails
  # the whole run rather than this job.
  workflow-telemetry:
    if: ${{ always() && inputs.workflow-telemetry-enabled }}
    runs-on: ubuntu-slim
    needs:
      - tofu-plan
      - tofu-apply
    steps:
      - name: Validate workflow-telemetry-endpoint input
        if: ${{ inputs.workflow-telemetry-endpoint == '' }}
        run: |
          echo "::error::workflow-telemetry-endpoint must be provided when workflow-telemetry-enabled is 'true'"
          exit 1

      - name: Send workflow telemetry
        uses: paper2/github-actions-opentelemetry@f7ea8331cf2167431503ed5b0218299d09c19986 # v0.10.2
        env:
          OTEL_SERVICE_NAME: ${{ inputs.workflow-telemetry-service-name }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ inputs.workflow-telemetry-endpoint }}
          OTEL_EXPORTER_OTLP_PROTOCOL: ${{ inputs.workflow-telemetry-protocol }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.workflow-telemetry-headers }}
          OTEL_RESOURCE_ATTRIBUTES: ${{ inputs.workflow-telemetry-resource-attributes }}
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
