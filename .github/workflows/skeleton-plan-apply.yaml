---
name: Skeleton - Plan and Apply

on:
  workflow_call:
    inputs:
      tofu-version:
        description: |
          Version of opentofu to install.
        required: false
        type: string
      tofu-version-file:
        description: |
          Path to a file containing the OpenTofu version to install.
        required: false
        type: string
      environment:
        description: |
          Name of the tofu environment used for planning/applying.
        required: true
        type: string
      chroot-directory:
        description: |
          Directory to chroot into before running tofu commands.
          Defaults to the current directory.
        required: false
        default: "."
        type: string
      tofu-apply:
        description: |
          Toggle to run the tofu apply step.
          Defaults to true.
        required: false
        default: true
        type: boolean
      upload-artifact-on-no-changes:
        description: |
          Whether to upload the plan artifact when the plan has no changes.
          Defaults to false.
        required: false
        default: false
        type: boolean
      send-to-step-summary-on-no-changes:
        description: |
          Whether to send the plan output to the step summary when the plan has no changes.
          Defaults to true.
        required: false
        default: true
        type: boolean
      telemetry-enabled:
        description: |
          Whether to export OpenTelemetry traces from the tofu commands.
          Requires telemetry-endpoint.
          Defaults to false.
        required: false
        default: false
        type: boolean
      telemetry-endpoint:
        description: |
          Base OTLP endpoint the traces are exported to, such as a Jaeger collector on http://jaeger.internal:4317.
          Required when telemetry-enabled is true.
        required: false
        default: ""
        type: string
      telemetry-exporter:
        description: |
          Exporter used for traces.
          OpenTofu only implements otlp, any other value disables the export.
          Defaults to otlp.
        required: false
        default: "otlp"
        type: string
      telemetry-protocol:
        description: |
          OTLP transport protocol used to export traces.
          Accepts grpc, http/protobuf or http/json.
          Left unset by default, which the exporter treats as http/protobuf.
          Set it to grpc when telemetry-endpoint points at an OTLP gRPC port such as 4317.
        required: false
        default: ""
        type: string
      telemetry-insecure:
        description: |
          Whether to export traces over a plaintext connection instead of TLS.
          Defaults to false.
        required: false
        default: false
        type: boolean
      telemetry-service-name:
        description: |
          Service name reported on the exported traces.
          Defaults to tofu-<environment>, so each environment shows up as its own service in the collector.
        required: false
        default: ""
        type: string
    secrets:
      extra-secret-environment-variables:
        description: |
          Newline-separated list of NAME=VALUE pairs to expose as masked environment variables for the duration of the workflow.
          Each VALUE must be double base64-encoded so it can be safely carried as a secret string.
          The runner decodes and masks every value before any tofu step runs.

          Encode a value:
            printf '%s' "my-secret" | base64 | base64

          Example secret value:
            TF_VAR_db_password=<base64(base64(password))>
            TF_VAR_api_key=<base64(base64(key))>
        required: false
    outputs:
      plan-has-changes:
        description: |
          Whether the generated plan contains any changes.
        value: ${{ jobs.tofu-plan.outputs.plan-has-changes }}
      plan-add-count:
        description: |
          Number of resources the plan will add.
        value: ${{ jobs.tofu-plan.outputs.plan-add-count }}
      plan-artifact-name:
        description: |
          Name of the uploaded plan artifact.
        value: ${{ jobs.tofu-plan.outputs.plan-artifact-name }}
      plan-artifact-uploaded:
        description: |
          Whether the plan was uploaded as a GitHub Actions artifact.
        value: ${{ jobs.tofu-plan.outputs.plan-artifact-uploaded }}

permissions:
  contents: read

jobs:
  tofu-plan:
    runs-on: ubuntu-slim
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      plan-has-changes: ${{ steps.tf-plan.outputs.plan-has-changes }}
      plan-add-count: ${{ steps.tf-plan.outputs.plan-add-count }}
      plan-artifact-name: ${{ steps.tf-plan.outputs.plan-artifact-name }}
      plan-artifact-uploaded: ${{ steps.tf-plan.outputs.plan-artifact-uploaded }}
    steps:
      - name: Decode and mask secret environment variables
        env:
          SECRET_VARS: ${{ secrets.extra-secret-environment-variables }}
        run: |
          while IFS= read -r line; do
            [[ -z "$line" ]] && continue
            key="${line%%=*}"
            value=$(printf '%s' "${line#*=}" | base64 -d | base64 -d)
            while IFS= read -r mask_line; do
              [[ -n "$mask_line" ]] && echo "::add-mask::${mask_line}"
            done <<< "$value"
            delimiter="$(openssl rand -hex 8)"
            printf '%s<<%s\n%s\n%s\n' "$key" "$delimiter" "$value" "$delimiter" >> "$GITHUB_ENV"
          done <<< "$SECRET_VARS"

      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout tact
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kordega/tact
          ref: ${{ github.repository == 'kordega/tact' && github.ref || 'main' }}
          path: .tact

      - name: Run tofu setup
        uses: ./.tact/actions/tofu-setup
        with:
          tofu-version: ${{ inputs.tofu-version }}
          tofu-version-file: ${{ inputs.tofu-version-file }}
          telemetry-enabled: ${{ inputs.telemetry-enabled }}
          telemetry-endpoint: ${{ inputs.telemetry-endpoint }}
          telemetry-exporter: ${{ inputs.telemetry-exporter }}
          telemetry-protocol: ${{ inputs.telemetry-protocol }}
          telemetry-insecure: ${{ inputs.telemetry-insecure }}
          telemetry-service-name: ${{ inputs.telemetry-service-name || format('tofu-{0}', inputs.environment) }}

      - name: Run tofu plan
        id: tf-plan
        uses: ./.tact/actions/tofu-plan
        with:
          chroot-directory: ${{ inputs.chroot-directory }}
          environment: ${{ inputs.environment }}
          upload-artifact: 'true'
          upload-artifact-on-no-changes: ${{ inputs.upload-artifact-on-no-changes }}
          send-to-step-summary-on-no-changes: ${{ inputs.send-to-step-summary-on-no-changes }}

  tofu-apply:
    if: needs.tofu-plan.outputs.plan-has-changes == 'true' && inputs.tofu-apply
    runs-on: ubuntu-slim
    environment: ${{ inputs.environment }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    needs:
      - tofu-plan
    steps:
      - name: Decode and mask secret environment variables
        env:
          SECRET_VARS: ${{ secrets.extra-secret-environment-variables }}
        run: |
          while IFS= read -r line; do
            [[ -z "$line" ]] && continue
            key="${line%%=*}"
            value=$(printf '%s' "${line#*=}" | base64 -d | base64 -d)
            while IFS= read -r mask_line; do
              [[ -n "$mask_line" ]] && echo "::add-mask::${mask_line}"
            done <<< "$value"
            delimiter="$(openssl rand -hex 8)"
            printf '%s<<%s\n%s\n%s\n' "$key" "$delimiter" "$value" "$delimiter" >> "$GITHUB_ENV"
          done <<< "$SECRET_VARS"

      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout tact
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kordega/tact
          ref: ${{ github.repository == 'kordega/tact' && github.ref || 'main' }}
          path: .tact

      - name: Run tofu setup
        uses: ./.tact/actions/tofu-setup
        with:
          tofu-version: ${{ inputs.tofu-version }}
          tofu-version-file: ${{ inputs.tofu-version-file }}
          telemetry-enabled: ${{ inputs.telemetry-enabled }}
          telemetry-endpoint: ${{ inputs.telemetry-endpoint }}
          telemetry-exporter: ${{ inputs.telemetry-exporter }}
          telemetry-protocol: ${{ inputs.telemetry-protocol }}
          telemetry-insecure: ${{ inputs.telemetry-insecure }}
          telemetry-service-name: ${{ inputs.telemetry-service-name || format('tofu-{0}', inputs.environment) }}

      - name: Run tofu apply
        uses: ./.tact/actions/tofu-apply
        with:
          chroot-directory: ${{ inputs.chroot-directory }}
          environment: ${{ inputs.environment }}
          plan-artifact-name: ${{ needs.tofu-plan.outputs.plan-artifact-name }}
