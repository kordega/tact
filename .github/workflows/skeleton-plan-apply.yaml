---
name: Skeleton - Plan and Apply

on:
  workflow_call:
    inputs:
      tofu-version:
        description: Version of OpenTofu to install.
        required: false
        type: string
      tofu-version-file:
        description: Path to a file containing the OpenTofu version to install.
        required: false
        type: string
      environment:
        description: Name of the tofu environment used for planning/applying.
        required: true
        type: string
      chroot-directory:
        description: Directory to chroot into before running tofu commands.
        required: false
        default: "."
        type: string
    outputs:
      plan-has-changes:
        description: Whether the generated plan contains any changes.
        value: ${{ jobs.tofu-plan.outputs.plan-has-changes }}
      plan-add-count:
        description: Number of resources the plan will add.
        value: ${{ jobs.tofu-plan.outputs.plan-add-count }}
      plan-artifact-name:
        description: Name of the uploaded plan artifact.
        value: ${{ jobs.tofu-plan.outputs.plan-artifact-name }}

permissions:
  contents: read

jobs:
  tofu-fmt:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run tofu setup (local)
        if: github.repository == 'limakzi/tofu-actions'
        uses: ./src/tofu-setup
        with:
          tofu-version: ${{ inputs.tofu-version }}
          tofu-version-file: ${{ inputs.tofu-version-file }}

      - name: Run tofu setup (remote)
        if: github.repository != 'limakzi/tofu-actions'
        uses: limakzi/tofu-actions/src/tofu-setup@main
        with:
          tofu-version: ${{ inputs.tofu-version }}
          tofu-version-file: ${{ inputs.tofu-version-file }}

      - name: Run tofu fmt (local)
        if: github.repository == 'limakzi/tofu-actions'
        uses: ./src/tofu-fmt
        with:
          chroot-directory: ${{ inputs.chroot-directory }}

      - name: Run tofu fmt (remote)
        if: github.repository != 'limakzi/tofu-actions'
        uses: limakzi/tofu-actions/src/tofu-fmt@main
        with:
          chroot-directory: ${{ inputs.chroot-directory }}

  tofu-plan:
    runs-on: ubuntu-slim
    outputs:
      plan-has-changes: ${{ steps.tf-plan-local.outputs.plan-has-changes || steps.tf-plan-remote.outputs.plan-has-changes }}
      plan-add-count: ${{ steps.tf-plan-local.outputs.plan-add-count || steps.tf-plan-remote.outputs.plan-add-count }}
      plan-artifact-name: ${{ steps.tf-plan-local.outputs.plan-artifact-name || steps.tf-plan-remote.outputs.plan-artifact-name }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run tofu setup (local)
        if: github.repository == 'limakzi/tofu-actions'
        uses: ./src/tofu-setup
        with:
          tofu-version: ${{ inputs.tofu-version }}
          tofu-version-file: ${{ inputs.tofu-version-file }}

      - name: Run tofu setup (remote)
        if: github.repository != 'limakzi/tofu-actions'
        uses: limakzi/tofu-actions/src/tofu-setup@main
        with:
          tofu-version: ${{ inputs.tofu-version }}
          tofu-version-file: ${{ inputs.tofu-version-file }}

      - name: Run tofu plan (local)
        if: github.repository == 'limakzi/tofu-actions'
        id: tf-plan-local
        uses: ./src/tofu-plan
        with:
          chroot-directory: ${{ inputs.chroot-directory }}
          environment: ${{ inputs.environment }}
          upload-artifact: 'true'

      - name: Run tofu plan (remote)
        if: github.repository != 'limakzi/tofu-actions'
        id: tf-plan-remote
        uses: limakzi/tofu-actions/src/tofu-plan@main
        with:
          chroot-directory: ${{ inputs.chroot-directory }}
          environment: ${{ inputs.environment }}
          upload-artifact: 'true'

  tofu-apply:
    if: needs.tofu-plan.outputs.plan-has-changes == 'true'
    runs-on: ubuntu-slim
    needs:
      - tofu-plan
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run tofu setup (local)
        if: github.repository == 'limakzi/tofu-actions'
        uses: ./src/tofu-setup
        with:
          tofu-version: ${{ inputs.tofu-version }}
          tofu-version-file: ${{ inputs.tofu-version-file }}

      - name: Run tofu setup (remote)
        if: github.repository != 'limakzi/tofu-actions'
        uses: limakzi/tofu-actions/src/tofu-setup@main
        with:
          tofu-version: ${{ inputs.tofu-version }}
          tofu-version-file: ${{ inputs.tofu-version-file }}

      - name: Run tofu apply (local)
        if: github.repository == 'limakzi/tofu-actions'
        uses: ./src/tofu-apply
        with:
          chroot-directory: ${{ inputs.chroot-directory }}
          environment: ${{ inputs.environment }}
          plan-artifact-name: ${{ needs.tofu-plan.outputs.plan-artifact-name }}

      - name: Run tofu apply (remote)
        if: github.repository != 'limakzi/tofu-actions'
        uses: limakzi/tofu-actions/src/tofu-apply@main
        with:
          chroot-directory: ${{ inputs.chroot-directory }}
          environment: ${{ inputs.environment }}
          plan-artifact-name: ${{ needs.tofu-plan.outputs.plan-artifact-name }}
