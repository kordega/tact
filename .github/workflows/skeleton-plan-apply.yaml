---
name: Skeleton - Plan and Apply

on:
  workflow_call:
    inputs:
      tofu-version:
        description: Version of opentofu to install.
        required: false
        type: string
      tofu-version-file:
        description: Path to a file containing the OpenTofu version to install.
        required: false
        type: string
      environment:
        description: Name of the tofu environment used for planning/applying.
        required: true
        type: string
      chroot-directory:
        description: Directory to chroot into before running tofu commands.
        required: false
        default: "."
        type: string
      tofu-apply:
        description: Toggle to run the tofu apply step.
        required: false
        default: true
        type: boolean
      encoded-secrets:
        description: |
          Double-base64-encoded secrets, one per line.
          Format: SECRET_NAME=DOUBLE_BASE64_VALUE
          Empty lines and lines starting with # are ignored.
          Use the tofu-encode-secrets action to produce this value.
        required: false
        default: ""
        type: string
    outputs:
      plan-has-changes:
        description: Whether the generated plan contains any changes.
        value: ${{ jobs.tofu-plan.outputs.plan-has-changes }}
      plan-add-count:
        description: Number of resources the plan will add.
        value: ${{ jobs.tofu-plan.outputs.plan-add-count }}
      plan-artifact-name:
        description: Name of the uploaded plan artifact.
        value: ${{ jobs.tofu-plan.outputs.plan-artifact-name }}

permissions:
  contents: read

jobs:
  tofu-plan:
    runs-on: ubuntu-slim
    outputs:
      plan-has-changes: ${{ steps.tf-plan.outputs.plan-has-changes }}
      plan-add-count: ${{ steps.tf-plan.outputs.plan-add-count }}
      plan-artifact-name: ${{ steps.tf-plan.outputs.plan-artifact-name }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Checkout tact
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: kordega/tact
          ref: ${{ github.repository == 'kordega/tact' && github.ref || 'main' }}
          path: .tact

      - name: Decode extra secrets
        uses: ./.tact/actions/tofu-decode-secrets
        with:
          encoded-secrets: ${{ inputs.encoded-secrets }}

      - name: Run tofu setup
        uses: ./.tact/actions/tofu-setup
        with:
          tofu-version: ${{ inputs.tofu-version }}
          tofu-version-file: ${{ inputs.tofu-version-file }}

      - name: Run tofu plan
        id: tf-plan
        uses: ./.tact/actions/tofu-plan
        with:
          chroot-directory: ${{ inputs.chroot-directory }}
          environment: ${{ inputs.environment }}
          upload-artifact: 'true'

  tofu-apply:
    if: needs.tofu-plan.outputs.plan-has-changes == 'true' && inputs.tofu-apply
    runs-on: ubuntu-slim
    needs:
      - tofu-plan
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Checkout tact
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: kordega/tact
          ref: ${{ github.repository == 'kordega/tact' && github.ref || 'main' }}
          path: .tact

      - name: Decode extra secrets
        uses: ./.tact/actions/tofu-decode-secrets
        with:
          encoded-secrets: ${{ inputs.encoded-secrets }}

      - name: Run tofu setup
        uses: ./.tact/actions/tofu-setup
        with:
          tofu-version: ${{ inputs.tofu-version }}
          tofu-version-file: ${{ inputs.tofu-version-file }}

      - name: Run tofu apply
        uses: ./.tact/actions/tofu-apply
        with:
          chroot-directory: ${{ inputs.chroot-directory }}
          environment: ${{ inputs.environment }}
          plan-artifact-name: ${{ needs.tofu-plan.outputs.plan-artifact-name }}
