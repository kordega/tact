---
name: Skeleton - Plan and Apply

on:
  workflow_call:
    inputs:
      tofu-version:
        description: |
          Version of opentofu to install.
        required: false
        type: string
      tofu-version-file:
        description: |
          Path to a file containing the OpenTofu version to install.
        required: false
        type: string
      environment:
        description: |
          Name of the tofu environment used for planning/applying.
        required: true
        type: string
      chroot-directory:
        description: |
          Directory to chroot into before running tofu commands.
          Defaults to the current directory.
        required: false
        default: "."
        type: string
      tofu-apply:
        description: |
          Toggle to run the tofu apply step.
          Defaults to true.
        required: false
        default: true
        type: boolean
      deployment-status:
        description: |
          Toggle to record a GitHub deployment with an inactive status after
          a successful plan on a pull request. Requires the caller to grant
          deployments write permission.
          Defaults to true.
        required: false
        default: true
        type: boolean
      upload-artifact-on-no-changes:
        description: |
          Whether to upload the plan artifact when the plan has no changes.
          Defaults to false.
        required: false
        default: false
        type: boolean
      send-to-step-summary-on-no-changes:
        description: |
          Whether to send the plan output to the step summary when the plan has no changes.
          Defaults to true.
        required: false
        default: true
        type: boolean
    secrets:
      extra-secret-environment-variables:
        description: |
          Newline-separated list of NAME=VALUE pairs to expose as masked environment variables for the duration of the workflow.
          Each VALUE must be double base64-encoded so it can be safely carried as a secret string.
          The runner decodes and masks every value before any tofu step runs.

          Encode a value:
            printf '%s' "my-secret" | base64 | base64

          Example secret value:
            TF_VAR_db_password=<base64(base64(password))>
            TF_VAR_api_key=<base64(base64(key))>
        required: false
    outputs:
      plan-has-changes:
        description: |
          Whether the generated plan contains any changes.
        value: ${{ jobs.tofu-plan.outputs.plan-has-changes }}
      plan-add-count:
        description: |
          Number of resources the plan will add.
        value: ${{ jobs.tofu-plan.outputs.plan-add-count }}
      plan-artifact-name:
        description: |
          Name of the uploaded plan artifact.
        value: ${{ jobs.tofu-plan.outputs.plan-artifact-name }}
      plan-artifact-uploaded:
        description: |
          Whether the plan was uploaded as a GitHub Actions artifact.
        value: ${{ jobs.tofu-plan.outputs.plan-artifact-uploaded }}
      deployment-id:
        description: |
          Identifier of the GitHub deployment recorded for the environment
          on a pull request.
        value: ${{ jobs.deployment-status.outputs.deployment-id }}

permissions:
  contents: read
  deployments: write

jobs:
  tofu-plan:
    runs-on: ubuntu-slim
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      plan-has-changes: ${{ steps.tf-plan.outputs.plan-has-changes }}
      plan-add-count: ${{ steps.tf-plan.outputs.plan-add-count }}
      plan-artifact-name: ${{ steps.tf-plan.outputs.plan-artifact-name }}
      plan-artifact-uploaded: ${{ steps.tf-plan.outputs.plan-artifact-uploaded }}
    steps:
      - name: Decode and mask secret environment variables
        env:
          SECRET_VARS: ${{ secrets.extra-secret-environment-variables }}
        run: |
          while IFS= read -r line; do
            [[ -z "$line" ]] && continue
            key="${line%%=*}"
            value=$(printf '%s' "${line#*=}" | base64 -d | base64 -d)
            while IFS= read -r mask_line; do
              [[ -n "$mask_line" ]] && echo "::add-mask::${mask_line}"
            done <<< "$value"
            delimiter="$(openssl rand -hex 8)"
            printf '%s<<%s\n%s\n%s\n' "$key" "$delimiter" "$value" "$delimiter" >> "$GITHUB_ENV"
          done <<< "$SECRET_VARS"

      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout tact
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kordega/tact
          ref: ${{ github.repository == 'kordega/tact' && github.ref || 'main' }}
          path: .tact

      - name: Run tofu setup
        uses: ./.tact/actions/tofu-setup
        with:
          tofu-version: ${{ inputs.tofu-version }}
          tofu-version-file: ${{ inputs.tofu-version-file }}

      - name: Run tofu plan
        id: tf-plan
        uses: ./.tact/actions/tofu-plan
        with:
          chroot-directory: ${{ inputs.chroot-directory }}
          environment: ${{ inputs.environment }}
          upload-artifact: 'true'
          upload-artifact-on-no-changes: ${{ inputs.upload-artifact-on-no-changes }}
          send-to-step-summary-on-no-changes: ${{ inputs.send-to-step-summary-on-no-changes }}

  tofu-apply:
    if: needs.tofu-plan.outputs.plan-has-changes == 'true' && inputs.tofu-apply
    runs-on: ubuntu-slim
    environment: ${{ inputs.environment }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    needs:
      - tofu-plan
    steps:
      - name: Decode and mask secret environment variables
        env:
          SECRET_VARS: ${{ secrets.extra-secret-environment-variables }}
        run: |
          while IFS= read -r line; do
            [[ -z "$line" ]] && continue
            key="${line%%=*}"
            value=$(printf '%s' "${line#*=}" | base64 -d | base64 -d)
            while IFS= read -r mask_line; do
              [[ -n "$mask_line" ]] && echo "::add-mask::${mask_line}"
            done <<< "$value"
            delimiter="$(openssl rand -hex 8)"
            printf '%s<<%s\n%s\n%s\n' "$key" "$delimiter" "$value" "$delimiter" >> "$GITHUB_ENV"
          done <<< "$SECRET_VARS"

      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout tact
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kordega/tact
          ref: ${{ github.repository == 'kordega/tact' && github.ref || 'main' }}
          path: .tact

      - name: Run tofu setup
        uses: ./.tact/actions/tofu-setup
        with:
          tofu-version: ${{ inputs.tofu-version }}
          tofu-version-file: ${{ inputs.tofu-version-file }}

      - name: Run tofu apply
        uses: ./.tact/actions/tofu-apply
        with:
          chroot-directory: ${{ inputs.chroot-directory }}
          environment: ${{ inputs.environment }}
          plan-artifact-name: ${{ needs.tofu-plan.outputs.plan-artifact-name }}

  # A pull request only plans, so nothing marks the environment as touched.
  # This records a deployment with an inactive status once the plan succeeds,
  # so the environment shows what is waiting to be applied. The apply job runs
  # inside the GitHub environment, so the push that applies the plan gets its
  # deployment marked active by GitHub itself.
  #
  # A pull request from a fork runs with a read-only token, which cannot
  # create deployments, so the job does not run for one.
  deployment-status:
    if: >-
      github.event_name == 'pull_request' &&
      inputs.deployment-status &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-slim
    needs:
      - tofu-plan
    outputs:
      deployment-id: ${{ steps.deployment.outputs.deployment-id }}
    steps:
      - name: Checkout tact
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kordega/tact
          ref: ${{ github.repository == 'kordega/tact' && github.ref || 'main' }}
          path: .tact

      - name: Record inactive deployment
        id: deployment
        uses: ./.tact/actions/deployment-status
        with:
          environment: ${{ inputs.environment }}
          state: inactive
          description: Plan for ${{ inputs.chroot-directory }} awaiting apply
