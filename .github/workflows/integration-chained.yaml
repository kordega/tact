---
name: Continuous Integration
run-name: integration-chained-${{ github.event_name == 'pull_request' && github.event.number || github.run_number }}

on:
  push:
    branches: [ 'main' ]
  pull_request:
    branches: [ '**' ]

permissions:
  contents: read
  actions: write

jobs:
  integration-chained-plan:
    name: Integration - chained plan
    runs-on: ubuntu-slim
    outputs:
      plan-artifact-name: ${{ steps.tf-plan.outputs.plan-artifact-name }}
      tofu-version: ${{ matrix.tofu-version }}
    strategy:
      fail-fast: true
      matrix:
        tofu-version:
          - 1.11.5
        chroot-directory:
          - tst/plan-with-changes
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run tofu setup
        uses: ./src/tofu-setup
        with:
          tofu-version: ${{ matrix.tofu-version }}

      - name: Run tofu plan
        id: tf-plan
        uses: ./src/tofu-plan
        with:
          chroot-directory: ${{ matrix.chroot-directory }}
          environment: integration-chained
          upload-artifact: true

      - name: Assert resources to be added
        shell: bash
        run: |
          [[ "${{ steps.tf-plan.outputs.plan-has-changes }}" = "true" ]]
          [[ "${{ steps.tf-plan.outputs.plan-add-count }}" = "1" ]]

  integration-chained-apply:
    name: Integration - chained apply
    runs-on: ubuntu-slim
    needs:
      - integration-chained-plan
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run tofu setup
        uses: ./src/tofu-setup
        with:
          tofu-version: ${{ needs.integration-chained-plan.outputs.tofu-version }}

      - name: Run tofu apply with artifact
        id: tf-apply-with-artifact
        uses: ./src/tofu-apply
        with:
          chroot-directory: tst/plan-with-changes
          environment: integration-chained
          plan-artifact-name: ${{ needs.integration-chained-plan.outputs.plan-artifact-name }}

  integration-chained-plan-destroy:
    name: Integration - chained plan destroy
    runs-on: ubuntu-slim
    needs:
      - integration-chained-plan
      - integration-chained-apply
    outputs:
      plan-artifact-name: ${{ steps.tf-plan-destroy.outputs.plan-artifact-name }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run tofu setup
        uses: ./src/tofu-setup
        with:
          tofu-version: ${{ needs.integration-chained-plan.outputs.tofu-version }}

      - name: Run tofu plan destroy
        id: tf-plan-destroy
        uses: ./src/tofu-plan
        with:
          chroot-directory: tst/plan-with-changes
          environment: integration-chained
          tofu-destroy: 'true'
          upload-artifact: true

      - name: Assert resources to be removed
        shell: bash
        run: |
          [[ "${{ steps.tf-plan-destroy.outputs.plan-has-changes }}" = "true" ]]
          [[ "${{ steps.tf-plan-destroy.outputs.plan-destroy-count }}" = "1" ]]

  integration-chained-apply-destroy:
    name: Integration - chained apply destroy
    runs-on: ubuntu-slim
    needs:
      - integration-chained-plan
      - integration-chained-plan-destroy
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run tofu setup
        uses: ./src/tofu-setup
        with:
          tofu-version: ${{ needs.integration-chained-plan.outputs.tofu-version }}

      - name: Run tofu apply for destroy
        id: tf-apply-destroy
        uses: ./src/tofu-apply
        with:
          chroot-directory: tst/plan-with-changes
          environment: integration-chained
          plan-artifact-name: ${{ needs.integration-chained-plan-destroy.outputs.plan-artifact-name }}
