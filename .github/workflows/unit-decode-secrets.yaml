---
name: Unit - tofu-decode-secrets

on:
  workflow_call:

permissions:
  contents: read

jobs:
  tofu-decode-secrets:
    name: unit - tofu-decode-secrets
    runs-on: ubuntu-slim
    strategy:
      matrix:
        include:
          - name: single-credential
            secret-value: my-secret-token
            expected-var: CLOUDFLARE_API_TOKEN
          - name: special-characters
            secret-value: "p@ss/w0rd+with=special&chars!"
            expected-var: TEST_SECRET
          - name: multiline-value
            secret-value: "line1"
            expected-var: SIMPLE_SECRET
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Encode credential (simulate upstream credentials job)
        id: encode
        shell: bash
        env:
          SECRET_VALUE: ${{ matrix.secret-value }}
          EXPECTED_VAR: ${{ matrix.expected-var }}
        run: |
          encoded="$(echo -n "$SECRET_VALUE" | base64 -w0 | base64 -w0)"
          echo "encoded-credentials=${EXPECTED_VAR}=${encoded}" >> "$GITHUB_OUTPUT"

      - name: Run tofu-decode-secrets
        uses: ./actions/tofu-decode-secrets
        with:
          encoded-secrets: ${{ steps.encode.outputs.encoded-credentials }}

      - name: Assert credential is decoded correctly
        shell: bash
        env:
          EXPECTED_VAR: ${{ matrix.expected-var }}
          EXPECTED_VALUE: ${{ matrix.secret-value }}
        run: |
          set -euo pipefail
          actual="${!EXPECTED_VAR}"
          if [[ "$actual" != "$EXPECTED_VALUE" ]]; then
            echo "::error::Expected ${EXPECTED_VAR}='${EXPECTED_VALUE}' but got '${actual}'"
            exit 1
          fi
          echo "OK: ${EXPECTED_VAR} decoded correctly"

  tofu-decode-secrets-multi:
    name: unit - tofu-decode-secrets (multiple credentials)
    runs-on: ubuntu-slim
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Encode multiple credentials
        id: encode
        shell: bash
        run: |
          token_a="$(echo -n "secret-a-value" | base64 -w0 | base64 -w0)"
          token_b="$(echo -n "secret-b-value" | base64 -w0 | base64 -w0)"
          {
            echo 'encoded-credentials<<EOF'
            echo "TOKEN_A=${token_a}"
            echo "TOKEN_B=${token_b}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run tofu-decode-secrets
        uses: ./actions/tofu-decode-secrets
        with:
          encoded-secrets: ${{ steps.encode.outputs.encoded-credentials }}

      - name: Assert both credentials decoded
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TOKEN_A" == "secret-a-value" ]] || { echo "::error::TOKEN_A mismatch: got '$TOKEN_A'"; exit 1; }
          [[ "$TOKEN_B" == "secret-b-value" ]] || { echo "::error::TOKEN_B mismatch: got '$TOKEN_B'"; exit 1; }
          echo "OK: both credentials decoded correctly"

  tofu-decode-secrets-empty:
    name: unit - tofu-decode-secrets (empty input)
    runs-on: ubuntu-slim
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run tofu-decode-secrets with empty input
        uses: ./actions/tofu-decode-secrets

      - name: Assert no unexpected env vars were injected
        shell: bash
        run: |
          set -euo pipefail
          if env | grep -q '^TOKEN_\|^CLOUDFLARE_\|^TEST_SECRET='; then
            echo "::error::Unexpected credential env var found"
            exit 1
          fi
          echo "OK: no credential variables set"
