---
name: CI - Units
run-name: ci-units-${{ github.event_name == 'pull_request' && github.event.number || github.run_number }}

on:
  push:
    branches: [ 'main' ]
  pull_request:
    branches: [ '**' ]

jobs:
  get-tofu-releases:
    name: Get tofu minor releases
    runs-on: ubuntu-slim
    outputs:
      releases: ${{ steps.read-releases.outputs.releases }}
      releases-with-lockfile: ${{ steps.read-releases.outputs.releases-with-lockfile }}
      latest-release: ${{ steps.read-releases.outputs.latest-release }}
    steps:
      - name: Restore cached releases
        id: cache-releases
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: .cache/tofu-releases.json
          key: tofu-releases-v1
          restore-keys: |
            tofu-releases-

      - name: Fetch releases if cache missed
        id: get-tofu-releases
        if: steps.cache-releases.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p .cache
          releases="$(curl -s 'https://api.github.com/repos/opentofu/opentofu/releases' | jq -c '
            map(select(.prerelease == false)) |
            map(.tag_name | sub("^v";"")) |
            map(select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))) |
            map(split(".") | {major:(.[0]|tonumber), minor:(.[1]|tonumber), patch:(.[2]|tonumber), ver:(.[0]+"."+.[1]+"."+.[2])}) |
            sort_by(.major,.minor,.patch) |
            group_by(.major,.minor) |
            map(last.ver)
          ')"
          echo "$releases" > .cache/tofu-releases.json

      - name: Read releases
        id: read-releases
        shell: bash
        run: |
          releases="$(cat .cache/tofu-releases.json)"
          echo "$releases"
          echo "releases=$releases" >> "$GITHUB_OUTPUT"
          releases_with_lockfile="$(echo "$releases" | jq -c 'map(select(split(".") | (.[0]|tonumber) * 100 + (.[1]|tonumber) >= 110))')"
          echo "releases-with-lockfile=$releases_with_lockfile" >> "$GITHUB_OUTPUT"
          latest_release="$(echo "$releases" | jq -r 'last')"
          echo "latest-release=$latest_release" >> "$GITHUB_OUTPUT"

  unit-setup:
    name: Units - tofu-setup
    needs: 
      - get-tofu-releases
    strategy:
      fail-fast: true
      matrix:
        tofu-version: ${{ fromJson(needs.get-tofu-releases.outputs.releases) }}
    runs-on: ubuntu-slim
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run tofu setup
        uses: ./src/tofu-setup
        id: tofu-setup
        with:
          tofu-version: ${{ matrix.tofu-version }}

      - name: Assert tofu setup by checking version
        shell: bash
        run: |
          echo "::group::Show tofu version"
          tofu version
          echo "::endgroup::"

          echo "::group::Check tofu version"
          [ "$(tofu version -json | jq -r '.terraform_version')" = "${{ matrix.tofu-version }}" ] && exit 0 || exit 1
          echo "::endgroup::"

  unit-unlock-state:
    name: Units - tofu-unlock-state
    runs-on: ubuntu-latest
    needs:
      - get-tofu-releases
    strategy:
      matrix:
        tofu-version: ${{ fromJson(needs.get-tofu-releases.outputs.releases-with-lockfile) }}
        chroot-directory:
          - tst/unlock-state
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run tofu setup
        uses: ./src/tofu-setup
        with:
          tofu-version: ${{ matrix.tofu-version }}

      - name: Start MinIO
        shell: bash
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live && break
            sleep 1
          done

      - name: Create S3 bucket
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
        shell: bash
        run: |
          aws s3 mb s3://tofu-state \
            --endpoint-url http://127.0.0.1:9000 \
            --region us-east-1

      - name: Run tofu init
        working-directory: ${{ matrix.chroot-directory }}
        shell: bash
        run: |
          echo "::group::Run tofu init"
          tofu init \
            -input=false
          echo "::endgroup::"

      - name: Simulate state lock
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
        shell: bash
        run: |
          echo '{"ID":"test-lock-id","Operation":"OperationTypeApply","Info":"","Who":"test@localhost","Version":"${{ matrix.tofu-version }}","Created":"2024-01-01T00:00:00.000000Z","Path":"tofu-state/terraform.tfstate"}' \
            | aws s3 cp - s3://tofu-state/terraform.tfstate.tflock \
                --endpoint-url http://127.0.0.1:9000 \
                --region us-east-1 \
                --content-type application/json

      - name: Run tofu unlock-state
        uses: ./src/tofu-unlock-state
        with:
          chroot-directory: ${{ matrix.chroot-directory }}
          lock-id: test-lock-id

      - name: Assert state lock has been removed
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
        shell: bash
        run: |
          ! aws s3 ls s3://tofu-state/terraform.tfstate.tflock \
            --endpoint-url http://127.0.0.1:9000 \
            --region us-east-1

  unit-fmt:
    name: Units - tofu-fmt
    runs-on: ubuntu-slim
    needs: 
      - get-tofu-releases
    strategy:
      matrix:
        tofu-version: ${{ fromJson(needs.get-tofu-releases.outputs.releases) }}
        chroot-directory:
          - tst/fmt-passed
          - tst/fmt-failed
        include:
          - chroot-directory: tst/fmt-passed
            status-code: '0'
          - chroot-directory: tst/fmt-failed
            status-code: '3'
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run tofu setup
        uses: ./src/tofu-setup
        with:
          tofu-version: ${{ matrix.tofu-version }}

      - name: Run tofu fmt
        id: tf-fmt
        uses: ./src/tofu-fmt
        continue-on-error: true
        with:
          chroot-directory: ${{ matrix.chroot-directory }}

      - name: Assert tofu fmt status code
        if: steps.tf-fmt.outputs.status-code != matrix.status-code
        run: exit 1

  unit-plan:
    name: Units - tofu-plan
    runs-on: ubuntu-slim
    needs: 
      - get-tofu-releases
    strategy:
      matrix:
        tofu-version: ${{ fromJson(needs.get-tofu-releases.outputs.releases) }}
        chroot-directory:
          - tst/plan-with-changes
          - tst/plan-without-changes
        include:
          - chroot-directory: tst/plan-with-changes
            plan-has-changes: 'true'
            plan-add-count: '1'
            upload-artifact: 'false'
            tofu-apply: 'true'
            tofu-destroy: 'true'
          - chroot-directory: tst/plan-without-changes
            plan-has-changes: 'false'
            plan-add-count: '0'
            upload-artifact: 'false'
            tofu-apply: 'true'
            tofu-destroy: 'true'
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run tofu setup
        uses: ./src/tofu-setup
        with:
          tofu-version: ${{ matrix.tofu-version }}

      - name: Run tofu plan for apply test fixture
        id: tf-plan
        uses: ./src/tofu-plan
        with:
          chroot-directory: ${{ matrix.chroot-directory }}
          environment: ${{ matrix.tofu-version }}
          upload-artifact: ${{ matrix.upload-artifact }}

      - name: Assert tofu plan change counts
        shell: bash
        run: |
          set -euo pipefail
          [ "${{ steps.tf-plan.outputs.plan-has-changes }}" = "${{ matrix.plan-has-changes }}" ]
          [ "${{ steps.tf-plan.outputs.plan-add-count }}" = "${{ matrix.plan-add-count }}" ]
          [ "${{ steps.tf-plan.outputs.plan-change-count }}" = "0" ]
          [ "${{ steps.tf-plan.outputs.plan-destroy-count }}" = "0" ]
          [ "${{ steps.tf-plan.outputs.plan-replace-count }}" = "0" ]
          [ "${{ steps.tf-plan.outputs.plan-import-count }}" = "0" ]

      - name: Run tofu apply without artifact
        id: tf-apply-no-artifact
        uses: ./src/tofu-apply
        if: matrix.tofu-apply == 'true' && matrix.upload-artifact == 'false'
        with:
          chroot-directory: ${{ matrix.chroot-directory }}
          environment: ${{ matrix.tofu-version }}
          plan-file-path: ${{ steps.tf-plan.outputs.plan-file-path }}

      - name: Run tofu apply with artifact
        id: tf-apply-with-artifact
        uses: ./src/tofu-apply
        if: matrix.tofu-apply == 'true' && matrix.upload-artifact == 'true'
        with:
          chroot-directory: ${{ matrix.chroot-directory }}
          environment: ${{ matrix.tofu-version }}
          plan-artifact-name: ${{ steps.tf-plan.outputs.plan-artifact-name }}

      - name: Run tofu plan for destroy test fixture
        id: tf-plan-destroy
        uses: ./src/tofu-plan
        if: matrix.tofu-destroy == 'true'
        with:
          chroot-directory: ${{ matrix.chroot-directory }}
          environment: ${{ matrix.tofu-version }}
          tofu-destroy: '${{ matrix.tofu-destroy }}'
          upload-artifact: '${{ matrix.upload-artifact }}'

      - name: Run tofu apply for destroy test fixture
        id: tf-apply-destroy
        uses: ./src/tofu-apply
        if: matrix.tofu-destroy == 'true'
        with:
          chroot-directory: ${{ matrix.chroot-directory }}
          environment: ${{ matrix.tofu-version }}
          plan-file-path: ${{ steps.tf-plan-destroy.outputs.plan-file-path }}

  unit-taint:
    name: Units - tofu-taint
    runs-on: ubuntu-slim
    needs:
      - get-tofu-releases
    permissions:
      contents: read
    strategy:
      matrix:
        tofu-version: ${{ fromJson(needs.get-tofu-releases.outputs.releases) }}
        chroot-directory:
          - tst/taint-resource
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run tofu setup
        uses: ./src/tofu-setup
        with:
          tofu-version: ${{ matrix.tofu-version }}

      - name: Run tofu plan for taint test fixture
        id: tf-plan
        uses: ./src/tofu-plan
        with:
          chroot-directory: ${{ matrix.chroot-directory }}
          environment: ${{ matrix.tofu-version }}
          upload-artifact: 'false'

      - name: Run tofu apply to create state
        uses: ./src/tofu-apply
        with:
          chroot-directory: ${{ matrix.chroot-directory }}
          plan-file-path: ${{ steps.tf-plan.outputs.plan-file-path }}

      - name: Run tofu taint
        uses: ./src/tofu-taint
        with:
          chroot-directory: ${{ matrix.chroot-directory }}
          address: time_static.this

      - name: Assert resource is marked for tainting
        working-directory: ${{ matrix.chroot-directory }}
        shell: bash
        run: |
          tofu state pull | jq -e '
            .resources[]
            | select(.type == "time_static" and .name == "this")
            | .instances[].status == "tainted"
          '

  unit-import:
    name: Units - tofu-import
    runs-on: ubuntu-slim
    needs:
      - get-tofu-releases
    permissions:
      contents: read
    strategy:
      matrix:
        tofu-version: ${{ fromJson(needs.get-tofu-releases.outputs.releases) }}
        chroot-directory:
          - tst/import-with-plan
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run tofu setup
        uses: ./src/tofu-setup
        with:
          tofu-version: ${{ matrix.tofu-version }}

      - name: Run tofu plan for import test fixture
        id: tf-plan
        uses: ./src/tofu-plan
        with:
          chroot-directory: ${{ matrix.chroot-directory }}
          environment: ${{ matrix.tofu-version }}
          upload-artifact: 'false'

      - name: Assert tofu plan import count
        shell: bash
        run: |
          set -euo pipefail
          [ "${{ steps.tf-plan.outputs.plan-import-count }}" = "1" ]

      - name: Run tofu apply to import resource
        uses: ./src/tofu-apply
        with:
          chroot-directory: ${{ matrix.chroot-directory }}
          plan-file-path: ${{ steps.tf-plan.outputs.plan-file-path }}

      - name: Assert resource has been imported into state
        working-directory: ${{ matrix.chroot-directory }}
        shell: bash
        run: |
          tofu state pull | jq -e '
            .resources[]
            | select(.type == "time_static" and .name == "this")
            | .instances[].attributes.rfc3339 == "2024-01-01T00:00:00Z"
          '

  unit-github-comment:
    name: Units - tofu-github-comment
    runs-on: ubuntu-slim
    needs:
      - get-tofu-releases
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run tofu setup
        uses: ./src/tofu-setup
        with:
          tofu-version: ${{ needs.get-tofu-releases.outputs.latest-release }}

      - name: Run tofu plan
        id: tf-plan
        uses: ./src/tofu-plan
        with:
          chroot-directory: tst/plan-with-changes
          environment: ${{ needs.get-tofu-releases.outputs.latest-release }}
          upload-artifact: 'false'
          upload-comment-artifact: 'true'

      - name: Run tofu-github-comment
        id: tofu-comment
        uses: ./src/tofu-github-comment
        with:
          comment-artifact-name: ${{ steps.tf-plan.outputs.comment-artifact-name }}
          comment-identifier: ${{ steps.tf-plan.outputs.environment }}

      - name: Assert comment was added
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ENV_TITLE: ${{ needs.get-tofu-releases.outputs.latest-release }}
          COMMENT_ID: ${{ steps.tofu-comment.outputs.comment-id }}
        shell: bash
        run: |
          body=$(
            curl -fsSL \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" \
            | jq -r .body
          )
          echo "comment_body=$body"
          grep -q "## ${ENV_TITLE}" <<< "$body"
