---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/.github/workflows"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/src/tofu-apply"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/src/tofu-fmt"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/src/tofu-plan"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/src/tofu-setup"
    schedule:
      interval: "weekly"
  - package-ecosystem: "terraform"
    directory: "/tst/fmt-failed"
    schedule:
      interval: "weekly"
  - package-ecosystem: "terraform"
    directory: "/tst/fmt-passed"
    schedule:
      interval: "weekly"
  - package-ecosystem: "terraform"
    directory: "/tst/plan-with-changes"
    schedule:
      interval: "weekly"
